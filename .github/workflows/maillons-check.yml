name: Vérifications Maillons

# Tests automatiques sur GitHub uniquement : ils ne changent rien à l'appli et ne
# déploient rien. Ils tournent sur toute branche reprise/… et sur toute demande
# de fusion vers main, dès qu'un fichier de l'appli change.
on:
  push:
    branches:
      - "reprise/**"
    paths:
      - "main.py"
      - "db.py"
      - "gpx_import.py"
      - "requirements.txt"
      - ".github/workflows/maillons-check.yml"
  pull_request:
    branches:
      - main
    paths:
      - "main.py"
      - "db.py"
      - "gpx_import.py"
      - "requirements.txt"
      - ".github/workflows/maillons-check.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  syntaxe-et-migration-sqlite:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: maillons_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d maillons_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Récupérer le code
        uses: actions/checkout@v4
      - name: Installer Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Vérifier la syntaxe Python complète
        run: python -m py_compile main.py
      - name: Vérifier le chargement initial du sélecteur multi-vélos
        run: |
          python - <<'PY'
          from pathlib import Path

          source = Path("main.py").read_text(encoding="utf-8")
          marqueur = "// Vérifie si un code est déjà en mémoire"
          debut = source.index(marqueur)
          fin = source.index("const MR_GROUPES", debut)
          initialisation = source[debut:fin]
          assert "await chargerVelos();" in initialisation, "Le sélecteur n'est pas chargé à la reconnexion"
          assert "await chargerEtat();" in initialisation, "L'état du vélo n'est pas chargé au démarrage"
          assert initialisation.index("await chargerVelos();") < initialisation.index("await chargerEtat();"), "L'état est chargé avant la liste des vélos"
          print("OK: reconnexion automatique, sélecteur multi-vélos chargé avant l'état du vélo.")

          import re
          import subprocess

          scripts = re.findall(r"<script[^>]*>([\s\S]*?)</script>", source)
          assert scripts, "Aucun script JavaScript intégré trouvé"
          for numero, script in enumerate(scripts, start=1):
              subprocess.run(["node", "--check"], input=script, text=True, check=True)
              print(f"OK: syntaxe JavaScript du script intégré {numero}/{len(scripts)}.")
          PY
      - name: Installer les dépendances de l'application
        run: pip install -r requirements.txt
      - name: Tester la recherche de fiche et l'adaptation des freins
        run: |
          python - <<'PY'
          import json
          import sqlite3
          import main

          # Extraction des composants dans plusieurs présentations HTML utilisées
          # par les fiches vélo : paires de tableau, listes, paragraphes et classes label/value.
          html_specs = """
          <table><tr><td>Fork</td><td>Fox Rhythm 36</td><td>Rear shock</td><td>Fox Float X</td></tr></table>
          <ul><li><strong>Seatpost:</strong> TranzX JD-YSP39, 150 mm</li></ul>
          <p>Saddle — Bontrager Arvada</p>
          <div class="spec-row"><span class="spec-label">Brakes</span><span class="spec-value">Shimano Deore M6120</span></div>
          """
          pieces_specs = main.composants_techniques_de_page(html_specs, "https://example.test/specs")
          extraits_specs = {
              (piece["categorie"], piece["nom"])
              for piece in pieces_specs if piece.get("nom")
          }
          assert ("fourche", "Fox Rhythm 36") in extraits_specs, extraits_specs
          assert ("amortisseur", "Fox Float X") in extraits_specs, extraits_specs
          assert ("tige_de_selle", "TranzX JD-YSP39, 150 mm") in extraits_specs, extraits_specs
          assert ("selle", "Bontrager Arvada") in extraits_specs, extraits_specs
          assert ("freins", "Shimano Deore M6120") in extraits_specs, extraits_specs

          # Présentation par sections utilisée notamment par Opticycles :
          # titre du composant, sous-titre « Modèle », puis valeur.
          html_sections = """
          <h3>Fourche</h3>
          <h4>Modèle</h4><p>Fox Rhythm 36, Float EVOL, GRIP</p>
          <h4>Débattement</h4><p>150 mm</p>
          <h3>Suspension arrière</h3>
          <h4>Modèle</h4><p>Fox Performance Float X</p>
          <h4>Débattement</h4><p>140 mm</p>
          <h3>Selle</h3>
          <h4>Modèle</h4><p>Bontrager Arvada, rails chromoly</p>
          """
          pieces_sections = main.composants_techniques_de_page(
              html_sections, "https://example.test/sections"
          )
          extraits_sections = {
              (piece["categorie"], piece["nom"])
              for piece in pieces_sections if piece.get("nom")
          }
          assert ("fourche", "Fox Rhythm 36, Float EVOL, GRIP") in extraits_sections, extraits_sections
          assert ("amortisseur", "Fox Performance Float X") in extraits_sections, extraits_sections
          assert ("selle", "Bontrager Arvada, rails chromoly") in extraits_sections, extraits_sections

          # Vitesse : une grosse page de boutique (beaucoup d'éléments « label » sans valeur voisine)
          # ne doit pas bloquer la recherche. Avant la correction, 260 Ko prenaient 10 s et 530 Ko environ 40 s.
          import time
          bruit = "".join(
              '<div class="product-label">Produit %d</div><div class="card"><span class="label">Nom %d</span><span class="other">x</span></div>' % (i, i)
              for i in range(4000)
          )
          grosse_page = "<html><body>" + html_specs + bruit + "</body></html>"
          assert len(grosse_page) > 400000, len(grosse_page)
          depart = time.time()
          pieces_grosse = main.composants_techniques_de_page(grosse_page, "https://example.test/grosse")
          duree = time.time() - depart
