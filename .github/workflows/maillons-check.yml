              # Menu du Gravel (pas affiché) : « Modifier la fiche » le rend actif et ouvre la fenêtre
              pg.click("#listeMesVelos .velo-ligne:nth-child(2) .velo-ligne-tete .menu-sortie-btn")
              etats = pg.eval_on_selector_all("#listeMesVelos .velo-ligne:nth-child(2) .velo-ligne-tete [role=menuitem]", "e => e.map(x => [x.textContent.trim(), x.disabled])")
              assert [e[0] for e in etats][0] == "Modifier la fiche de « Gravel test »" and not etats[0][1] and not etats[-1][1], etats
              pg.click("#listeMesVelos .velo-ligne:nth-child(2) .velo-ligne-tete [role=menuitem]:has-text('Modifier la fiche')"); pg.wait_for_timeout(800)
              assert pg.evaluate("veloActifId") == 2 and pg.eval_on_selector("#selectVelo", "s => s.value") == "2"
              assert pg.eval_on_selector("#fenetreVelo", "e => e.open") and pg.input_value("#nouveauVeloNom") == "Gravel test"
              pg.keyboard.press("Escape"); pg.wait_for_timeout(300)
              assert pg.eval_on_selector_all("#listeMesVelos .velo-ligne.actif .velo-ligne-nom", "e => e.map(x => x.textContent.trim())") == ["Gravel testAffiché"]
              # Fiche technique et réglages sont dans la ligne du vélo affiché, avec une flèche pour tout replier
              dans = lambda i: pg.evaluate("id => !!document.querySelector('#listeMesVelos .velo-ligne.deplie .velo-ligne-corps #' + id)", i)
              assert dans("ficheTechniqueAutre") and dans("mesReglages") and not pg.is_visible("#ficheTechniqueCube")
              assert pg.is_visible("#listeMesVelos .velo-ligne.deplie .velo-ligne-corps #ficheTechniqueAutre")
              boite = lambda sel: pg.evaluate("s => { const b = document.querySelector(s).getBoundingClientRect(); return [Math.round(b.x), Math.round(b.width), Math.round(b.height)]; }", sel)
              assert boite("#mesReglages .mr-chevron") == boite("#ficheTechniqueAutre .ftv-chevron"), (boite("#mesReglages .mr-chevron"), boite("#ficheTechniqueAutre .ftv-chevron"))
              pg.click("#listeMesVelos .velo-ligne:nth-child(2) .velo-ligne-fleche"); pg.wait_for_timeout(300)
              assert pg.eval_on_selector_all("#listeMesVelos .velo-ligne-corps", "e => e.length") == 0
              assert pg.evaluate("document.getElementById('ficheTechniqueAutre').parentElement.id") == "reserveFicheVelo"
              assert not pg.is_visible("#ficheTechniqueAutre")
              pg.click("#listeMesVelos .velo-ligne:nth-child(2) .velo-ligne-fleche"); pg.wait_for_timeout(300)
              assert dans("mesReglages")
              # La flèche d'un autre vélo l'affiche et lui donne la fiche
              pg.click("#listeMesVelos .velo-ligne:nth-child(1) .velo-ligne-fleche"); pg.wait_for_timeout(800)
              assert pg.evaluate("veloActifId") == 1 and pg.eval_on_selector("#selectVelo", "s => s.value") == "1"
              assert dans("ficheTechniqueCube") and dans("mesReglages")
              assert pg.eval_on_selector_all("#listeMesVelos .velo-ligne.deplie", "e => e.length") == 1
              # Toucher le nom replie le vélo affiché
              pg.click("#listeMesVelos .velo-ligne:nth-child(1) .velo-ligne-choix"); pg.wait_for_timeout(300)
              assert pg.eval_on_selector_all("#listeMesVelos .velo-ligne-corps", "e => e.length") == 0
              # Icône « Mon compte » entre les kilomètres et l'engrenage, qui ouvre la page du compte
              ordre = pg.evaluate("[...document.querySelectorAll('header > *')].map(e => e.id || e.className).filter(x => ['veloInfo', 'boutonCompte', 'boutonParametres'].includes(x))")
              assert ordre == ["veloInfo", "boutonCompte", "boutonParametres"], ordre
              assert not pg.is_visible("#blocCompte")
              pg.click("#boutonCompte"); pg.wait_for_timeout(300)
              assert pg.evaluate("location.hash") == "#compte" and pg.is_visible("#page-compte") and pg.is_visible("#boutonDeconnexion")
              assert "actif" in pg.get_attribute("#boutonCompte", "class") and not pg.is_visible("#page-reglages")
              pg.click("#boutonRetourCompte"); pg.wait_for_timeout(300)
              assert pg.is_visible("#page-reglages") and not pg.is_visible("#page-compte")
              pg.click("#boutonCompte"); pg.wait_for_timeout(200); pg.click("#boutonParametres"); pg.wait_for_timeout(200)
              assert pg.evaluate("location.hash") == "#parametres" and "actif" not in pg.get_attribute("#boutonCompte", "class")
              assert not err, err
              nav.close()
          print("OK liste Mes vélos : une ligne et un menu par vélo")
          PY
          rm -f "$SQLITE_PATH"
          PYTHONPATH="$PWD" python "$RUNNER_TEMP/test_liste_velos.py"
