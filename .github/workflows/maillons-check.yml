          main.telecharger_lien = bing_secours
          resultat = main.recherche_fiche_velo(
              main.RechercheFicheVeloRequest(recherche="Cube Stereo Hybrid"), None
          )
          assert resultat["candidats"] == [{"titre": "Fiche constructeur Bing", "url": url_bing}], resultat
          assert len(appels) == 2 and "duckduckgo.com" in appels[0] and "bing.com/search" in appels[1], appels

          # Les deux moteurs échouent : erreur 502 explicite.
          def deux_echecs(url, accepte):
              raise ValueError("Moteur indisponible")
          main.telecharger_lien = deux_echecs
          try:
              main.recherche_fiche_velo(
                  main.RechercheFicheVeloRequest(recherche="Cube Stereo Hybrid"), None
              )
              raise AssertionError("Une erreur 502 était attendue")
          except HTTPException as erreur:
              assert erreur.status_code == 502, erreur.status_code
              assert "DuckDuckGo ni Bing" in erreur.detail, erreur.detail

          # Aucun moteur ne fournit de lien : réponse 404, pas une erreur réseau 502.
          appels = []
          def aucun_resultat(url, accepte):
              appels.append(url)
              if "duckduckgo.com" in url:
                  return "text/html", b"<html><body>No results</body></html>", url
              return "application/rss+xml", b"<rss><channel></channel></rss>", url
          main.telecharger_lien = aucun_resultat
          try:
              main.recherche_fiche_velo(
                  main.RechercheFicheVeloRequest(recherche="Cube Stereo Hybrid"), None
              )
              raise AssertionError("Une erreur 404 était attendue")
          except HTTPException as erreur:
              assert erreur.status_code == 404, erreur.status_code
              assert "Aucune fiche trouvée" in erreur.detail, erreur.detail
          assert len(appels) == 2, appels

          print("OK : DDG prioritaire, Bing de secours, erreurs réseau distinguées de l'absence de résultats.")
          PY
      - name: Vérifier la conservation de la nomenclature technique par vélo
        env:
          SQLITE_PATH: ${{ runner.temp }}/maillons-fiche-composants.db
