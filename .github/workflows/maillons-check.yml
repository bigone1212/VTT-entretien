      - name: Vérifier la récupération d'une photo depuis un lien (faux site local, garde anti-réseau interne)
        env:
          SQLITE_PATH: ${{ runner.temp }}/maillons-photo-lien-test.db
          CODE_ACCES: test
        run: |
          cat > "$RUNNER_TEMP/test_photo_lien_srv.py" <<'PY'
          import base64, json, threading
          from http.server import BaseHTTPRequestHandler, HTTPServer
          import main
          from fastapi import HTTPException
          main.verifier_auth = lambda _c: None
          JPEG = b"\xff\xd8\xff\xe0" + b"J" * 8000
          PNG = b"\x89PNG\r\n\x1a\n" + b"P" * 8000

          class H(BaseHTTPRequestHandler):
              def log_message(self, *a): pass
              def rep(self, code, type_, corps, extra=None):
                  self.send_response(code); self.send_header("Content-Type", type_); self.send_header("Content-Length", str(len(corps)))
                  for k, v in (extra or {}).items(): self.send_header(k, v)
                  self.end_headers(); self.wfile.write(corps)
              def do_GET(self):
                  ua = self.headers.get("User-Agent", "")
                  if "Mozilla" not in ua: return self.rep(403, "text/plain", b"bot")
                  c = self.path
                  if c == "/page": self.rep(200, "text/html; charset=utf-8", b'<html><head><meta property="og:image" content="/img/velo.jpg?a=1&amp;b=2"></head></html>')
                  elif c.startswith("/img/velo.jpg"): self.rep(200, "image/jpeg", JPEG)
                  elif c == "/direct.png": self.rep(200, "image/png", PNG)
                  elif c == "/redir": self.rep(302, "text/plain", b"", {"Location": "/page"})
                  elif c == "/boucle": self.rep(302, "text/plain", b"", {"Location": "/boucle"})
                  elif c == "/jsonld": self.rep(200, "text/html", b'<script type="application/ld+json">{"@type":"Product","image":["/img/velo.jpg"]}</script>')
                  elif c == "/vide": self.rep(200, "text/html", b"<html><body>rien</body></html>")
                  elif c == "/pixel": self.rep(200, "text/html", b'<meta property="og:image" content="/mini.png">')
                  elif c == "/mini.png": self.rep(200, "image/png", PNG[:100])
                  elif c == "/texte": self.rep(200, "text/plain", b"salut")
                  elif c == "/svg": self.rep(200, "text/html", b'<meta property="og:image" content="/logo.svg">')
                  elif c == "/logo.svg": self.rep(200, "image/svg+xml", b"<svg/>")
                  elif c == "/interdit": self.rep(403, "text/plain", b"non")
                  else: self.rep(404, "text/plain", b"?")

          srv = HTTPServer(("127.0.0.1", 0), H); port = srv.server_address[1]
          threading.Thread(target=srv.serve_forever, daemon=True).start()
          B = "http://127.0.0.1:%d" % port
          REEL = main.adresse_publique
          main.adresse_publique = lambda h: True
          main.LIEN_PORTS = (None, 80, 443, port)

          def go(chemin):
              return main.photo_depuis_lien(main.LienPhotoRequest(url=B + chemin), x_code_acces="x")
          def refuse(code, chemin):
              try: go(chemin)
              except HTTPException as e:
                  assert e.status_code == code, (chemin, e.status_code, e.detail); return e.detail
              raise AssertionError("erreur attendue " + chemin)

          r = go("/page")
          assert r["photo"] == "data:image/jpeg;base64," + base64.b64encode(JPEG).decode() and r["source"] == B + "/img/velo.jpg?a=1&b=2", r["source"]
          assert go("/direct.png")["photo"].startswith("data:image/png;base64,")
          assert go("/redir")["photo"].startswith("data:image/jpeg")
          assert go("/jsonld")["photo"].startswith("data:image/jpeg")
          assert "Aucune photo" in refuse(404, "/vide")
          refuse(404, "/pixel"); refuse(404, "/svg")
          print(refuse(400, "/texte")); print(refuse(400, "/interdit")); print(refuse(400, "/boucle"))
          # lien sans http:// : "https://" ajouté automatiquement -> hôte inconnu ici, refusé proprement
          main.adresse_publique = lambda h: False
          print(refuse(400, "/page"))
          # Garde réelle contre le réseau interne
          main.adresse_publique = REEL; main.LIEN_PORTS = (None, 80, 443); real = REEL
          for hote in ("127.0.0.1", "localhost", "10.0.0.5", "192.168.1.1", "169.254.169.254", "::1", "0.0.0.0", "nom-qui-n-existe-pas.invalid"):
              assert real(hote) is False, hote
          assert real("8.8.8.8") is True
          for url in ("file:///etc/passwd", "ftp://exemple.fr/x", "http://user:mdp@8.8.8.8/", "http://8.8.8.8:8080/x", "http://127.0.0.1/"):
              try: main.telecharger_lien(url, "*/*"); raise AssertionError(url)
              except ValueError as e: pass
          # images_de_la_page : plusieurs formes
          html = '<meta name="twitter:image" content="https://a.fr/x.jpg"><link rel="image_src" href="y.jpg"><meta content="z.jpg" property="og:image">'
          assert main.images_de_la_page(html, "https://b.fr/dir/p") == ["https://a.fr/x.jpg", "https://b.fr/dir/z.jpg", "https://b.fr/dir/y.jpg"]
          print("OK photo depuis un lien (serveur)")
          PY
          rm -f "$SQLITE_PATH"
          PYTHONPATH="$PWD" python "$RUNNER_TEMP/test_photo_lien_srv.py"
