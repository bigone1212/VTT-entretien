      - name: Vérifier le dernier vélo utilisé et la pastille à vérifier (SQLite puis PostgreSQL)
        env:
          SQLITE_PATH: ${{ runner.temp }}/maillons-dernier-velo-test.db
          CODE_ACCES: test
        run: |
          cat > "$RUNNER_TEMP/test_dernier_velo.py" <<'PY'
          import sys
          from datetime import datetime, timedelta

          import db
          import main
          from fastapi import HTTPException

          CODE = "test"


          def gpx(debut, km=10.0, nom="Sortie test"):
              t0 = datetime.strptime(debut, "%Y-%m-%dT%H:%M:%SZ")
              n = 120
              pas_m = km * 1000 / (n - 1)
              pts = []
              for i in range(n):
                  lat = 44.0 + (i * pas_m) / 111320.0
                  t = (t0 + timedelta(seconds=20 * i)).strftime("%Y-%m-%dT%H:%M:%SZ")
                  pts.append('<trkpt lat="%.6f" lon="2.500000"><ele>%d</ele><time>%s</time></trkpt>' % (lat, 500 + i % 10, t))
              return ('<?xml version="1.0"?><gpx version="1.1" creator="test" xmlns="http://www.topografix.com/GPX/1/1">'
                      '<trk><name>' + nom + '</name><trkseg>' + "".join(pts) + '</trkseg></trk></gpx>')


          def importer(debut, km, velo_id=None, nom="Sortie test"):
              return main.importer_sortie(main.ImportGpxRequest(gpx=gpx(debut, km, nom)), velo_id=velo_id, x_code_acces=CODE)


          def refuse(code, fonction, *a, **k):
              try:
                  fonction(*a, **k)
              except HTTPException as e:
                  assert e.status_code == code, (code, e.status_code, e.detail)
                  return
              raise AssertionError("Une erreur %s était attendue" % code)


          def ligne(sortie_id):
              conn = db.connect()
              c = conn.cursor()
              c.execute("SELECT velo_id, a_verifier, km_compte, distance_km FROM sorties WHERE id = ?", (sortie_id,))
              r = c.fetchone()
              conn.close()
              return tuple(r)


          def km(velo_id):
              conn = db.connect()
              c = conn.cursor()
              c.execute("SELECT km_total, km_frac FROM velos WHERE id = ?", (velo_id,))
              r = c.fetchone()
              conn.close()
              return r[0] + r[1]


          def sorties_a_verifier():
              return {v["id"]: v["sorties_a_verifier"] for v in main.obtenir_velos(x_code_acces=CODE)}


          # --- Préparation : le CUBE (id 1) et un gravel (id 2) ; km_maj_le du CUBE ancien
          gravel = main.creer_velo(main.NouveauVeloRequest(nom="Gravel test", type="gravel"), x_code_acces=CODE)["velo_id"]
          assert gravel == 2, gravel
          conn = db.connect()
          conn.cursor().execute("UPDATE velos SET km_maj_le = '2000-01-01T00:00:00Z' WHERE id = 1")
          conn.commit()
          conn.close()
          base_cube, base_gravel = km(1), km(2)

          # L. Premier import automatique alors qu'aucune sortie n'existe : vélo 1, à vérifier
          r1 = importer("2030-05-01T08:00:00Z", 10.0, velo_id=None, nom="Auto 1")
          assert r1["velo_id"] == 1 and r1["a_verifier"] is True, r1
          id1 = main.lister_sorties(velo_id=1, x_code_acces=CODE)[0]["id"]
          assert ligne(id1)[:2] == (1, 1), ligne(id1)

          # C. Import fait DANS l'appli (vélo 2 choisi) : rien à vérifier
          r2 = importer("2030-05-02T08:00:00Z", 12.0, velo_id=2, nom="Appli gravel")
          assert r2["velo_id"] == 2 and r2["a_verifier"] is False, r2
          id2 = main.lister_sorties(velo_id=2, x_code_acces=CODE)[0]["id"]
          assert ligne(id2)[:2] == (2, 0), ligne(id2)

          # D. Import automatique ensuite : dernier vélo utilisé = vélo 2 (sortie la plus récente)
          r3 = importer("2030-05-03T08:00:00Z", 8.0, velo_id=None, nom="Auto 3")
          assert r3["velo_id"] == 2 and r3["a_verifier"] is True, r3
          id3 = [s["id"] for s in main.lister_sorties(velo_id=2, x_code_acces=CODE) if s["nom"] == "Auto 3"][0]

          # E. Import dans l'appli sur le CUBE, puis automatique : suit le CUBE
          r4 = importer("2030-05-04T08:00:00Z", 15.0, velo_id=1, nom="Appli cube")
          assert r4["velo_id"] == 1 and r4["a_verifier"] is False
          r5 = importer("2030-05-05T08:00:00Z", 9.0, velo_id=None, nom="Auto 5")
          assert r5["velo_id"] == 1 and r5["a_verifier"] is True, r5
          id5 = [s["id"] for s in main.lister_sorties(velo_id=1, x_code_acces=CODE) if s["nom"] == "Auto 5"][0]

          # F. Compteur par vélo dans la liste des vélos
          assert sorties_a_verifier() == {1: 2, 2: 1}, sorties_a_verifier()

          # G. La liste des sorties expose le drapeau
          l2 = {s["nom"]: s["a_verifier"] for s in main.lister_sorties(velo_id=2, x_code_acces=CODE)}
          assert l2 == {"Appli gravel": 0, "Auto 3": 1}, l2

          # K. Kilomètres : chaque vélo ne compte que ses sorties
          assert abs((km(1) - base_cube) - (r1["distance_km"] + r4["distance_km"] + r5["distance_km"])) < 0.02
          assert abs((km(2) - base_gravel) - (r2["distance_km"] + r3["distance_km"])) < 0.02

          # I. Doublons, tous vélos confondus (même heure exacte, ou même sortie à quelques minutes)
          refuse(409, importer, "2030-05-02T08:00:00Z", 12.0, None)
          refuse(409, importer, "2030-05-02T08:00:00Z", 12.0, 1)
          refuse(409, importer, "2030-05-03T08:04:00Z", 8.0, None)

          # H. Confirmer : bon vélo = ok, mauvais vélo = 404, puis plus « à vérifier »
          refuse(404, main.confirmer_velo_sortie, id3, velo_id=1, x_code_acces=CODE)
          assert ligne(id3)[1] == 1
          main.confirmer_velo_sortie(id3, velo_id=2, x_code_acces=CODE)
          assert ligne(id3)[1] == 0
          assert sorties_a_verifier() == {1: 2, 2: 0}, sorties_a_verifier()

          # J. Changer le vélo d'une sortie à vérifier : elle est confirmée, les km suivent
          avant1, avant2 = km(1), km(2)
          main.affecter_sortie_a_un_autre_velo(id5, main.AffecterSortieVeloRequest(nouveau_velo_id=2), velo_id=1, x_code_acces=CODE)
          assert ligne(id5)[:2] == (2, 0), ligne(id5)
          assert abs((avant1 - km(1)) - r5["distance_km"]) < 0.02 and abs((km(2) - avant2) - r5["distance_km"]) < 0.02
          # « Auto 1 » (vélo 1) reste à vérifier ; « Auto 5 » est maintenant confirmée sur le vélo 2
          assert sorties_a_verifier() == {1: 1, 2: 0}, sorties_a_verifier()

          # Mauvais code d'accès : refus sur les deux nouvelles routes
          refuse(401, main.confirmer_velo_sortie, id3, velo_id=2, x_code_acces="faux")

          print("OK: import automatique sur le dernier vélo utilisé + à vérifier ; import de l'appli sans pastille ; compteurs, doublons, confirmation et changement de vélo.")
          PY
          rm -f "$SQLITE_PATH"
          PYTHONPATH="$PWD" python "$RUNNER_TEMP/test_dernier_velo.py"
          python - <<'PY2'
          import psycopg
          with psycopg.connect("postgresql://postgres:postgres@localhost:5432/maillons_test", autocommit=True) as c:
              c.execute("DROP DATABASE IF EXISTS maillons_dernier_velo")
              c.execute("CREATE DATABASE maillons_dernier_velo")
          PY2
          DATABASE_URL=postgresql://postgres:postgres@localhost:5432/maillons_dernier_velo PYTHONPATH="$PWD" python "$RUNNER_TEMP/test_dernier_velo.py"
      - name: Vérifier la suppression d'un vélo (SQLite puis PostgreSQL)
        env:
          SQLITE_PATH: ${{ runner.temp }}/maillons-suppression-test.db
          CODE_ACCES: test
        run: |
          pip install httpx
          cat > "$RUNNER_TEMP/test_suppression.py" <<'PY'
          import os
          import main
          from fastapi.testclient import TestClient

          main.verifier_auth = lambda _code: 1
          import db


          def n(sql, p=()):
              c = db.connect(); cur = c.cursor(); cur.execute(sql, p); r = cur.fetchone()[0]; c.close(); return r


          with TestClient(main.app) as client:
              g = client.post("/api/velos", json={"nom": "Gravel a supprimer", "type": "gravel"}).json()["velo_id"]
              h = client.post("/api/velos", json={"nom": "VTT a garder", "type": "vtt"}).json()["velo_id"]
              avant = {v: tuple(n("SELECT COUNT(*) FROM " + t + " WHERE velo_id = ?", (v,)) for t in ("composants", "historique", "sorties")) for v in (1, h)}
              c = db.connect(); cur = c.cursor()
              cur.execute("INSERT INTO sorties (velo_id, debut, distance_km) VALUES (?, ?, ?)", (g, "2030-01-01T08:00:00Z", 10.0))
              cur.execute("SELECT id FROM composants WHERE velo_id = ? LIMIT 1", (g,)); comp = cur.fetchone()
              cur.execute("INSERT INTO historique (composant_id, velo_id) VALUES (?, ?)", (comp[0], g))
              cur.execute("INSERT INTO mes_reglages_velo (velo_id, cle, valeur, maj_le) VALUES (?, 'x', 'y', 'z')", (g,))
              c.commit(); c.close()

              ct = client.get("/api/velos/%d/contenu" % g).json()
              assert ct["sorties"] == 1 and ct["historique"] == 1 and ct["composants"] > 0, ct
              assert client.post("/api/velos/1/supprimer").status_code == 400
              assert client.post("/api/velos/9999/supprimer").status_code == 404
              assert client.get("/api/velos/9999/contenu").status_code == 404
              assert n("SELECT COUNT(*) FROM velos WHERE id = 1") == 1

              r = client.post("/api/velos/%d/supprimer" % g)
              assert r.status_code == 200 and r.json()["efface"] == ct, r.text
              for t in ("composants", "historique", "sorties", "mes_reglages_velo"):
                  assert n("SELECT COUNT(*) FROM " + t + " WHERE velo_id = ?", (g,)) == 0, t
              assert n("SELECT COUNT(*) FROM velos WHERE id = ?", (g,)) == 0
              apres = {v: tuple(n("SELECT COUNT(*) FROM " + t + " WHERE velo_id = ?", (v,)) for t in ("composants", "historique", "sorties")) for v in (1, h)}
              assert apres == avant, (apres, avant)
              assert client.post("/api/velos/%d/supprimer" % g).status_code == 404

          print("OK: suppression d'un vélo (SQLite/PostgreSQL) : tout part avec lui, les autres vélos et le CUBE restent intacts.")
          PY
          rm -f "$SQLITE_PATH"
          PYTHONPATH="$PWD" python "$RUNNER_TEMP/test_suppression.py"
          python - <<'PY2'
          import psycopg
          with psycopg.connect("postgresql://postgres:postgres@localhost:5432/maillons_test", autocommit=True) as c:
              c.execute("DROP DATABASE IF EXISTS maillons_suppression")
              c.execute("CREATE DATABASE maillons_suppression")
          PY2
          DATABASE_URL=postgresql://postgres:postgres@localhost:5432/maillons_suppression PYTHONPATH="$PWD" python "$RUNNER_TEMP/test_suppression.py"
