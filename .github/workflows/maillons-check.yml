name: Vérifications Maillons

# Tests automatiques sur GitHub uniquement : ils ne changent rien à l'appli et ne
# déploient rien. Ils tournent sur toute branche reprise/… et sur toute demande
# de fusion vers main, dès qu'un fichier de l'appli change.
on:
  push:
    branches:
      - "reprise/**"
    paths:
      - "main.py"
      - "db.py"
      - "gpx_import.py"
      - "requirements.txt"
      - ".github/workflows/maillons-check.yml"
  pull_request:
    branches:
      - main
    paths:
      - "main.py"
      - "db.py"
      - "gpx_import.py"
      - "requirements.txt"
      - ".github/workflows/maillons-check.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  syntaxe-et-migration-sqlite:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: maillons_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d maillons_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Récupérer le code
        uses: actions/checkout@v4
      - name: Installer Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Vérifier la syntaxe Python complète
        run: python -m py_compile main.py
      - name: Vérifier le chargement initial du sélecteur multi-vélos
        run: |
          python - <<'PY'
          from pathlib import Path

          source = Path("main.py").read_text(encoding="utf-8")
          marqueur = "// Vérifie si un code est déjà en mémoire"
          debut = source.index(marqueur)
          fin = source.index("const MR_GROUPES", debut)
          initialisation = source[debut:fin]
          assert "await chargerVelos();" in initialisation, "Le sélecteur n'est pas chargé à la reconnexion"
          assert "await chargerEtat();" in initialisation, "L'état du vélo n'est pas chargé au démarrage"
          assert initialisation.index("await chargerVelos();") < initialisation.index("await chargerEtat();"), "L'état est chargé avant la liste des vélos"
          print("OK: reconnexion automatique, sélecteur multi-vélos chargé avant l'état du vélo.")

          import re
          import subprocess

          scripts = re.findall(r"<script[^>]*>([\s\S]*?)</script>", source)
          assert scripts, "Aucun script JavaScript intégré trouvé"
          for numero, script in enumerate(scripts, start=1):
              subprocess.run(["node", "--check"], input=script, text=True, check=True)
              print(f"OK: syntaxe JavaScript du script intégré {numero}/{len(scripts)}.")
          PY
      - name: Installer les dépendances de l'application
        run: pip install -r requirements.txt
      - name: Tester la recherche de fiche et l'adaptation des freins
        run: |
          python - <<'PY'
          import json
          import sqlite3
          import main

          main.verifier_auth = lambda _code: None

          patins = main.entretiens_du_type("route", "patins")
          noms_patins = [ligne[0] for ligne in patins]
          assert "Patins de frein (avant)" in noms_patins
          assert "Patins de frein (arrière)" in noms_patins
          assert not any("disque de frein" in nom.lower() for nom in noms_patins)
          assert not any("plaquettes de frein" in nom.lower() for nom in noms_patins)
          assert not any("purge du liquide" in nom.lower() for nom in noms_patins)

          disques = [ligne[0] for ligne in main.entretiens_du_type("route", "disque")]
          assert "Plaquettes de frein (avant)" in disques
          assert "Disque de frein (avant)" in disques
          assert "Purge du liquide de frein" not in disques
          hydrauliques = [ligne[0] for ligne in main.entretiens_du_type("route", "disque_hydraulique")]
          assert "Purge du liquide de frein" in hydrauliques
          mecaniques = [ligne[0] for ligne in main.entretiens_du_type("route", "disque_mecanique")]
          assert "Purge du liquide de frein" not in mecaniques

          rigide = [ligne[0] for ligne in main.entretiens_du_type("vtt", None, "rigide", "chambre", "courroie")]
          assert "Courroie (contrôle et remplacement)" in rigide
          assert not any("chaîne" in nom.lower() or "cassette" in nom.lower() for nom in rigide)
          assert not any("liquide préventif tubeless" in nom.lower() for nom in rigide)
          assert not any("fourche -" in nom.lower() or "amortisseur -" in nom.lower() for nom in rigide)

          double = [ligne[0] for ligne in main.entretiens_du_type("vtt", None, "double", "tubeless", "chaine")]
          assert "Fourche - entretien (50 h)" in double
          assert "Amortisseur - entretien (50 h)" in double
          assert "Liquide préventif tubeless (2 pneus)" in double
          assert "Chaîne (remplacement)" in double

          inconnus = [ligne[0] for ligne in main.entretiens_du_type("vtt", None, None, None, None)]
          assert "Freins - contrôle général (type à confirmer)" in inconnus
          assert not any("disque de frein" in nom.lower() or "plaquettes de frein" in nom.lower() for nom in inconnus)
          assert not any("fourche -" in nom.lower() or "amortisseur -" in nom.lower() for nom in inconnus)
          assert not any("liquide préventif tubeless" in nom.lower() for nom in inconnus)
          assert not any("chaîne" in nom.lower() or "cassette" in nom.lower() for nom in inconnus)

          from pathlib import Path
          source = Path("main.py").read_text(encoding="utf-8")
          guides_start = source.index("const GUIDES = {")
          guides_end = source.index("function lienYoutube(nom) {", guides_start)
          guides = source[guides_start:guides_end]
          configurations = (
              ("route", "patins", "rigide", "chambre", "chaine"),
              ("vtt", "disque_hydraulique", "double", "tubeless", "chaine"),
              ("route", "disque_mecanique", "rigide", "chambre", "courroie"),
              ("vtt", None, None, None, None),
          )
          for configuration in configurations:
              for ligne in main.entretiens_du_type(*configuration):
                  assert '"' + ligne[0] + '"' in guides, (
                      "Fiche « Comment faire » absente pour la configuration "
                      + str(configuration) + ": " + ligne[0]
                  )

          ouverture = "<scr" + "ipt"
          fermeture = "</scr" + "ipt>"
          page = (
              "<html>" + ouverture + " type='application/ld+json'>" +
              json.dumps({"@type": "Product", "name": "EDR Easy Route", "brand": {"@type": "Brand", "name": "EDR"}, "releaseDate": "2025"}) +
              fermeture + "<p>Freins à patins. Fourche rigide. Chambre à air. Chaîne et dérailleur.</p></html>"
          )
          main.telecharger_lien = lambda url, accepter: ("text/html", page.encode("utf-8"), url)
          fiche = main.recherche_fiche_velo(
              main.RechercheFicheVeloRequest(url="https://example.com/edr"),
              None
          )
          assert fiche["marque"] == "EDR", fiche
          assert fiche["modele"] == "EDR Easy Route", fiche
          assert fiche["annee"] == 2025, fiche
          assert fiche["freins"] == "patins", fiche
          assert fiche["suspension"] == "rigide", fiche
          assert fiche["tubeless"] == "chambre", fiche
          assert fiche["transmission"] == "chaine", fiche

          page = (
              "<html>" + ouverture + " type='application/ld+json'>" +
              json.dumps({"@type": "Product", "name": "Vélo test", "brand": "Test"}) +
              fermeture + "<p>Freins à disque hydrauliques. Pneus tubeless ready.</p></html>"
          )
          hydraulique = main.recherche_fiche_velo(
              main.RechercheFicheVeloRequest(url="https://example.com/hydraulique"),
              None
          )
          assert hydraulique["freins"] == "disque_hydraulique", hydraulique
          assert hydraulique["tubeless"] is None, hydraulique

          conn = sqlite3.connect(":memory:")
          cur = conn.cursor()
          cur.execute("CREATE TABLE velos (id INTEGER PRIMARY KEY, type TEXT)")
          cur.execute("INSERT INTO velos VALUES (2, 'route')")
          cur.execute("""CREATE TABLE composants (
              id INTEGER PRIMARY KEY AUTOINCREMENT,
              velo_id INTEGER, nom TEXT, km_depart INTEGER DEFAULT 0,
              seuil_alerte INTEGER DEFAULT 0, seuil_jours INTEGER DEFAULT 0,
              categorie TEXT DEFAULT 'piece', pos_x INTEGER DEFAULT 50,
              pos_y INTEGER DEFAULT 50, verification INTEGER DEFAULT 0,
              coef_usure REAL DEFAULT 1
          )""")
          cur.executemany(
              "INSERT INTO composants (id, velo_id, nom, seuil_alerte) VALUES (?, 2, ?, 1000)",
              [(1, "Plaquettes de frein (avant)"), (2, "Plaquettes de frein (arrière)"),
               (3, "Disque de frein (avant)"), (4, "Disque de frein (arrière)"),
               (5, "Purge du liquide de frein")]
          )
          main.adapter_freins_velo(cur, 2, "patins")
          composants = dict(cur.execute("SELECT id, nom FROM composants WHERE velo_id = 2").fetchall())
          assert composants[1] == "Patins de frein (avant)", composants
          assert composants[2] == "Patins de frein (arrière)", composants
          assert composants[3] == "Non concerné — disque de frein (avant)", composants
          assert composants[5] == "Non concerné — purge du liquide de frein", composants
          assert cur.execute("SELECT COUNT(*) FROM composants").fetchone()[0] >= 5

          main.adapter_freins_velo(cur, 2, "patins", "rigide", "chambre", "courroie")
          noms_courroie = {r[0] for r in cur.execute("SELECT nom FROM composants WHERE velo_id = 2").fetchall()}
          assert "Courroie (contrôle et remplacement)" in noms_courroie
          assert not any("chaîne" in nom.lower() or "cassette" in nom.lower() for nom in noms_courroie if not nom.startswith("Non concerné"))
          main.adapter_freins_velo(cur, 2, "patins", "rigide", "chambre", "chaine")
          noms_chaine = {r[0] for r in cur.execute("SELECT nom FROM composants WHERE velo_id = 2").fetchall()}
          assert "Chaîne (remplacement)" in noms_chaine
          assert "Non concerné — Courroie (contrôle et remplacement)" in noms_chaine

          print("OK : recherche structurée, équipements adaptés, transitions chaîne/courroie et conservation des identifiants.")
          PY
      - name: Tester le téléchargement JSON de la sauvegarde avec des kilométrages divergents
        env:
          SQLITE_PATH: ${{ runner.temp }}/maillons-sauvegarde-test.db
          DATABASE_URL: ""
        run: |
          pip install httpx
          python - <<'PY'
          import os
          import sqlite3
          from pathlib import Path

          path = Path(os.environ["SQLITE_PATH"])
          if path.exists():
              path.unlink()

          import main
          from fastapi.testclient import TestClient

          # L'authentification est neutralisée uniquement dans ce test isolé.
          main.verifier_auth = lambda _code: None

          with TestClient(main.app) as client:
              with sqlite3.connect(path) as conn:
                  cube = conn.execute("SELECT id FROM velos WHERE id = 1").fetchone()
                  ancien = conn.execute("SELECT id FROM velo WHERE id = 1").fetchone()
                  assert cube is not None, "Le CUBE manque dans velos"
                  assert ancien is not None, "La ligne historique manque dans velo"
                  conn.execute("UPDATE velos SET km_total = 2831 WHERE id = 1")
                  conn.execute("UPDATE velo SET km_total = 2700 WHERE id = 1")
                  conn.commit()

              reponse = client.get("/api/sauvegarde")
              assert reponse.status_code == 200, (reponse.status_code, reponse.text)
              donnees = reponse.json()
              assert donnees["km_total"] == 2831, donnees.get("km_total")
              cube_exporte = next(v for v in donnees["velos"] if v["id"] == 1)
              assert cube_exporte["km_total"] == 2831, cube_exporte
              assert all(cle in donnees for cle in (
                  "date_sauvegarde", "km_total", "velos",
                  "reglages_personnels_par_velo", "composants",
                  "historique", "sorties", "reglages"
              )), list(donnees)
              print("OK : le téléchargement JSON exporte 2831 km depuis velos, pas les 2700 km de velo.")

              # Vérifie aussi le repli historique lorsque le kilométrage courant est absent.
              with sqlite3.connect(path) as conn:
                  conn.execute("UPDATE velos SET km_total = NULL WHERE id = 1")
                  conn.commit()
              repli = client.get("/api/sauvegarde")
              assert repli.status_code == 200, (repli.status_code, repli.text)
              assert repli.json()["km_total"] == 2700, repli.json().get("km_total")
              print("OK : le repli sur velo fonctionne si le kilométrage de velos est nul.")

              # Vérifie aussi le repli si la ligne du CUBE est absente du registre.
              with sqlite3.connect(path) as conn:
                  conn.execute("DELETE FROM velos WHERE id = 1")
                  conn.commit()
              absent = client.get("/api/sauvegarde")
              assert absent.status_code == 200, (absent.status_code, absent.text)
              assert absent.json()["km_total"] == 2700, absent.json().get("km_total")
              print("OK : le repli sur velo fonctionne si la ligne CUBE manque dans velos.")
          PY
      - name: Démarrer l'application sur une copie SQLite isolée et vérifier la migration réelle
        env:
          SQLITE_PATH: ${{ runner.temp }}/maillons-migration-test.db
        run: |
          python - <<'PY'
          import os
          import sqlite3
          import subprocess
          import sys
          from pathlib import Path

          path = Path(os.environ["SQLITE_PATH"])
          if path.exists():
              path.unlink()

          # Ancien schéma représentatif, avec données à préserver.
          db = sqlite3.connect(path)
          db.executescript("""
              CREATE TABLE velo (
                  id INTEGER PRIMARY KEY CHECK (id = 1),
                  km_total INTEGER DEFAULT 2700,
                  date_achat TEXT,
                  km_maj_le TEXT,
                  km_frac REAL DEFAULT 0
              );
              INSERT INTO velo VALUES (1, 2700, '2025-11-18', '2026-10-26T14:33:17Z', 0);
              CREATE TABLE composants (
                  id INTEGER PRIMARY KEY AUTOINCREMENT,
                  nom TEXT NOT NULL,
                  km_depart INTEGER DEFAULT 0,
                  seuil_alerte INTEGER NOT NULL,
                  categorie TEXT DEFAULT 'piece',
                  pos_x INTEGER DEFAULT 50,
                  pos_y INTEGER DEFAULT 50
              );
              INSERT INTO composants (id, nom, km_depart, seuil_alerte, categorie)
              VALUES (1, 'Composant historique test', 1200, 2000, 'piece');
              CREATE TABLE historique (
                  id INTEGER PRIMARY KEY AUTOINCREMENT,
                  composant_id INTEGER,
                  date_remplacement TEXT,
                  cout DOUBLE PRECISION DEFAULT 0,
                  notes TEXT,
                  km_intervention INTEGER
              );
              INSERT INTO historique VALUES (1, 1, '2026-03-05', 0, 'Historique à conserver', 1236);
              CREATE TABLE sorties (
                  id INTEGER PRIMARY KEY AUTOINCREMENT,
                  nom TEXT,
                  debut TEXT NOT NULL UNIQUE,
                  sport TEXT,
                  distance_km DOUBLE PRECISION,
                  denivele_pos INTEGER,
                  denivele_neg INTEGER,
                  duree_s INTEGER,
                  vitesse_moy DOUBLE PRECISION,
                  alt_max INTEGER,
                  pente_moy_montee DOUBLE PRECISION,
                  terrain TEXT DEFAULT 'mixte',
                  notes TEXT,
                  km_compte INTEGER DEFAULT 0,
                  trace TEXT
              );
              INSERT INTO sorties (id, nom, debut, distance_km)
              VALUES (1, 'Sortie historique test', '2026-10-20T08:00:00Z', 25.5);
              CREATE TABLE reglages (cle TEXT PRIMARY KEY, valeur DOUBLE PRECISION NOT NULL);
              INSERT INTO reglages VALUES ('terrain_route', 1.0);
              CREATE TABLE mes_reglages (
                  cle TEXT PRIMARY KEY,
                  valeur TEXT NOT NULL,
                  maj_le TEXT
              );
              INSERT INTO mes_reglages VALUES ('taille_cadre', 'L', '2026-10-01');
          """)
          db.commit()
          db.close()

          # L'import de main appelle init_db : on teste donc le vrai démarrage
          # et les migrations, dans un processus séparé et une base temporaire.
          env = os.environ.copy()
          env.pop("DATABASE_URL", None)
          subprocess.run([sys.executable, "-c", "import main"], env=env, check=True)

          db = sqlite3.connect(path)
          db.row_factory = sqlite3.Row
          bike = db.execute("SELECT * FROM velos WHERE legacy_velo_id=1").fetchone()
          assert bike is not None, "Le CUBE historique n'a pas été créé"
          assert bike["km_total"] == 2700, dict(bike)
          assert bike["date_achat"] == "2025-11-18", dict(bike)
          assert bike["km_maj_le"] == "2026-10-26T14:33:17Z", dict(bike)
          assert db.execute("SELECT nom FROM composants WHERE id=1").fetchone()[0] == "Composant historique test"
          assert db.execute("SELECT km_intervention FROM historique WHERE id=1").fetchone()[0] == 1236
          assert db.execute("SELECT velo_id FROM historique WHERE id=1").fetchone()[0] == 1
          assert db.execute("SELECT distance_km FROM sorties WHERE id=1").fetchone()[0] == 25.5
          assert db.execute("SELECT valeur FROM mes_reglages WHERE cle='taille_cadre'").fetchone()[0] == "L"
          assert db.execute("SELECT valeur FROM mes_reglages_velo WHERE velo_id=1 AND cle='taille_cadre'").fetchone()[0] == "L"
          assert {"moteur", "batterie"}.issubset({row[1] for row in db.execute("PRAGMA table_info(velos)")})
          assert db.execute("SELECT velo_id FROM composants WHERE id=1").fetchone()[0] == 1
          assert db.execute("SELECT velo_id FROM sorties WHERE id=1").fetchone()[0] == 1
          count_bikes = db.execute("SELECT COUNT(*) FROM velos").fetchone()[0]
          count_components = db.execute("SELECT COUNT(*) FROM composants").fetchone()[0]
          db.close()

          # Deuxième démarrage : la migration doit être relançable sans doublons.
          subprocess.run([sys.executable, "-c", "import main"], env=env, check=True)
          db = sqlite3.connect(path)
          assert db.execute("SELECT COUNT(*) FROM velos").fetchone()[0] == count_bikes
          assert db.execute("SELECT COUNT(*) FROM composants").fetchone()[0] == count_components
          db.close()
          print("OK: démarrage réel sur SQLite temporaire, conservation des données et seconde migration sans doublon.")
          PY
      - name: Démarrer Maillons sur PostgreSQL temporaire et vérifier la migration réelle
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/maillons_test
        run: |
          python - <<'PY'
          import os
          import subprocess
          import sys
          import time
          import psycopg

          url = os.environ["DATABASE_URL"]

          # Prépare un schéma historique représentatif dans le conteneur PostgreSQL
          # jetable de ce job. Aucune adresse de base externe n'est utilisée.
          with psycopg.connect(url) as conn:
              conn.execute("""
                  CREATE TABLE velo (
                      id INTEGER PRIMARY KEY CHECK (id = 1),
                      km_total INTEGER DEFAULT 2700,
                      date_achat TEXT,
                      km_maj_le TEXT,
                      km_frac DOUBLE PRECISION DEFAULT 0
                  )
              """)
              conn.execute(
                  "INSERT INTO velo VALUES (1, 2700, '2025-11-18', '2026-10-26T14:33:17Z', 0)"
              )
              conn.execute("""
                  CREATE TABLE composants (
                      id SERIAL PRIMARY KEY,
                      nom TEXT NOT NULL,
                      km_depart INTEGER DEFAULT 0,
                      seuil_alerte INTEGER NOT NULL,
                      categorie TEXT DEFAULT 'piece',
                      pos_x INTEGER DEFAULT 50,
                      pos_y INTEGER DEFAULT 50
                  )
              """)
              conn.execute("""
                  INSERT INTO composants (nom, km_depart, seuil_alerte, categorie)
                  VALUES ('Composant historique test', 1200, 2000, 'piece')
              """)
              conn.execute("""
                  CREATE TABLE historique (
                      id SERIAL PRIMARY KEY,
                      composant_id INTEGER REFERENCES composants(id),
                      date_remplacement TEXT,
                      cout DOUBLE PRECISION DEFAULT 0,
                      notes TEXT,
                      km_intervention INTEGER
                  )
              """)
              conn.execute("""
                  INSERT INTO historique
                      (composant_id, date_remplacement, cout, notes, km_intervention)
                  VALUES (1, '2026-03-05', 0, 'Historique à conserver', 1236)
              """)
              conn.execute("""
                  CREATE TABLE sorties (
                      id SERIAL PRIMARY KEY,
                      nom TEXT,
                      debut TEXT NOT NULL UNIQUE,
                      sport TEXT,
                      distance_km DOUBLE PRECISION,
                      denivele_pos INTEGER,
                      denivele_neg INTEGER,
                      duree_s INTEGER,
                      vitesse_moy DOUBLE PRECISION,
                      alt_max INTEGER,
                      pente_moy_montee DOUBLE PRECISION,
                      terrain TEXT DEFAULT 'mixte',
                      notes TEXT,
                      km_compte INTEGER DEFAULT 0,
                      trace TEXT
                  )
              """)
              conn.execute("""
                  INSERT INTO sorties (nom, debut, distance_km)
                  VALUES ('Sortie historique test', '2026-10-20T08:00:00Z', 25.5)
              """)
              conn.execute("""
                  CREATE TABLE reglages (
                      cle TEXT PRIMARY KEY,
                      valeur DOUBLE PRECISION NOT NULL
                  )
              """)
              conn.execute("INSERT INTO reglages VALUES ('terrain_route', 1.0)")
              conn.execute("""
                  CREATE TABLE mes_reglages (
                      cle TEXT PRIMARY KEY,
                      valeur TEXT NOT NULL,
                      maj_le TEXT
                  )
              """)
              conn.execute(
                  "INSERT INTO mes_reglages VALUES ('taille_cadre', 'L', '2026-10-01')"
              )

          env = os.environ.copy()
          env.pop("SQLITE_PATH", None)
          subprocess.run([sys.executable, "-c", "import main"], env=env, check=True)

          with psycopg.connect(url) as conn:
              bike = conn.execute(
                  "SELECT * FROM velos WHERE legacy_velo_id = 1"
              ).fetchone()
              assert bike is not None, "Le CUBE historique n'a pas été créé"
              assert bike[8] == 2700, bike
              assert bike[10] == "2026-10-26T14:33:17Z", bike
              assert bike[11] == "2025-11-18", bike
              assert conn.execute(
                  "SELECT nom FROM composants WHERE id = 1"
              ).fetchone()[0] == "Composant historique test"
              assert conn.execute(
                  "SELECT km_intervention FROM historique WHERE id = 1"
              ).fetchone()[0] == 1236
              assert conn.execute(
                  "SELECT velo_id FROM historique WHERE id = 1"
              ).fetchone()[0] == 1
              assert conn.execute(
                  "SELECT distance_km FROM sorties WHERE id = 1"
              ).fetchone()[0] == 25.5
              assert conn.execute(
                  "SELECT valeur FROM mes_reglages WHERE cle = 'taille_cadre'"
              ).fetchone()[0] == "L"
              assert conn.execute(
                  "SELECT valeur FROM mes_reglages_velo WHERE velo_id = 1 AND cle = 'taille_cadre'"
              ).fetchone()[0] == "L"
              assert {"moteur", "batterie"}.issubset({
                  row[0] for row in conn.execute("""
                      SELECT column_name FROM information_schema.columns
                      WHERE table_name = 'velos'
                  """).fetchall()
              })
              assert conn.execute(
                  "SELECT velo_id FROM composants WHERE id = 1"
              ).fetchone()[0] == 1
              assert conn.execute(
                  "SELECT velo_id FROM sorties WHERE id = 1"
              ).fetchone()[0] == 1
              count_bikes = conn.execute("SELECT COUNT(*) FROM velos").fetchone()[0]
              count_components = conn.execute("SELECT COUNT(*) FROM composants").fetchone()[0]

          # Deuxième démarrage réel : vérifier l'idempotence sur PostgreSQL aussi.
          subprocess.run([sys.executable, "-c", "import main"], env=env, check=True)
          with psycopg.connect(url) as conn:
              assert conn.execute("SELECT COUNT(*) FROM velos").fetchone()[0] == count_bikes
              assert conn.execute("SELECT COUNT(*) FROM composants").fetchone()[0] == count_components

          # Les kilomètres ajoutés pendant que l'appli tourne doivent survivre à un
          # redémarrage (ancien défaut : retour à l'ancienne valeur à chaque démarrage).
          with psycopg.connect(url) as conn:
              conn.execute(
                  "UPDATE velos SET km_total = 2800, km_maj_le = '2026-10-27T10:00:00Z' WHERE id = 1"
              )
          subprocess.run([sys.executable, "-c", "import main"], env=env, check=True)
          with psycopg.connect(url) as conn:
              ligne = conn.execute(
                  "SELECT km_total, km_maj_le FROM velos WHERE id = 1"
              ).fetchone()
              assert ligne == (2800, "2026-10-27T10:00:00Z"), ligne
              assert conn.execute(
                  "SELECT legacy_velo_id FROM velos WHERE id = 1"
              ).fetchone()[0] == 1
              # Le prochain vélo ajouté (sans id imposé) ne doit pas reprendre l'id 1.
