              assert len(client.get("/api/velos/%d/photos" % g).json()["photos"]) == 4
              assert client.get("/api/velos/9999/photos").status_code == 404
              assert client.post("/api/velos/9999/photos", json={"photo": img}).status_code == 404
              assert client.delete("/api/velos/9999/photos/0").status_code == 404
              assert client.post("/api/velos/%d/supprimer" % g).status_code == 200
              assert client.get("/api/velos/%d/photo" % g).status_code == 404
              assert client.get("/api/velos/%d/photos" % g).status_code == 404

          print("OK: photo du vélo (SQLite/PostgreSQL) : enregistrer, lire, refuser les fichiers invalides, supprimer ; la photo part avec le vélo.")
