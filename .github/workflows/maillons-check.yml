      - name: Tester la galerie de 6 photos par vélo dans un vrai navigateur
        env:
          SQLITE_PATH: ${{ runner.temp }}/maillons-galerie-test.db
          CODE_ACCES: test
        run: |
          cat > "$RUNNER_TEMP/test_galerie.py" <<'PY'
          import base64, json
          from urllib.parse import urlparse
          from playwright.sync_api import sync_playwright
          import main
          html = main.accueil()
          JPEG = ""
          URL = "data:image/jpeg;base64," + JPEG
          V = [{"id": 1, "nom": "Mon CUBE", "type": "vtt_electrique", "actif": 1, "km_total": 0, "km_frac": 0, "a_photo": 0, "sorties_a_verifier": 0},
               {"id": 2, "nom": "Gravel test", "type": "gravel", "actif": 1, "km_total": 0, "km_frac": 0, "a_photo": 1, "sorties_a_verifier": 0},
               {"id": 3, "nom": "Route test", "type": "route", "actif": 1, "km_total": 0, "km_frac": 0, "a_photo": 0, "sorties_a_verifier": 0}]
          galeries = {2: [URL, URL], 3: []}
          principales = {}
          posts = []
          err = []
          with sync_playwright() as p:
              nav = p.chromium.launch(); ctx = nav.new_context(viewport={"width": 390, "height": 844})
              def api(r):
                  u = urlparse(r.request.url); m = r.request.method; ch = u.path.split("/")
                  def rep(c, st=200): r.fulfill(status=st, content_type="application/json", body=json.dumps(c))
                  if len(ch) >= 5 and ch[1] == "api" and ch[2] == "velos" and ch[4] == "photos":
                      vid = int(ch[3])
                      if m == "GET": return rep({"photos": galeries.get(vid, [])})
                      if m == "POST":
                          if len(galeries[vid]) >= 5: return rep({"detail": "6 photos au maximum par vélo."}, 400)
                          galeries[vid].append(json.loads(r.request.post_data)["photo"]); posts.append(vid); return rep({"statut": "success", "nombre": len(galeries[vid])})
                      if m == "DELETE": galeries[vid].pop(int(ch[5])); return rep({"statut": "success"})
                  if len(ch) == 5 and ch[4] == "photo":
                      vid = int(ch[3])
                      if m == "GET": return rep({"photo": principales.get(vid, URL if vid == 2 else None)})
                      if m == "PUT":
                          principales[vid] = json.loads(r.request.post_data)["photo"]
                          for v in V:
                              if v["id"] == vid: v["a_photo"] = 1
                          return rep({"statut": "success"})
                  c = V if u.path == "/api/velos" else {"km_total": 0, "composants": []} if u.path == "/api/etat" else {"valeurs": {}, "maj_le": None} if u.path == "/api/mes-reglages" else {"terrain_route": 1, "terrain_mixte": 1.2, "terrain_chemin": 1.5, "terrain_sentier": 2, "poids_denivele": 1} if u.path == "/api/reglages" else []
                  rep(c)
              ctx.route("**/localhost/api/**", api); ctx.route(lambda u: not u.startswith("http://localhost/"), lambda r: r.abort())
              ctx.add_init_script("sessionStorage.setItem('vtt_code','t');sessionStorage.setItem('maillons_velo_id','2')")
              pg = ctx.new_page(); pg.on("pageerror", lambda e: err.append(str(e)))
              pg.route("http://localhost/", lambda r: r.fulfill(status=200, content_type="text/html", body=html))
              pg.goto("http://localhost/"); pg.wait_for_timeout(1200)
              pg.evaluate("location.hash = 'reglages'"); pg.wait_for_timeout(800)
              nb = lambda: pg.eval_on_selector_all("#galerieVelo .galerie-diapo img", "e => e.length")
              # La galerie est dans la ligne du vélo, entre son nom et la fiche technique : photo principale + 2 autres
              assert nb() == 3, nb()
              ordre = pg.evaluate("[...document.querySelectorAll('#listeMesVelos .velo-ligne.deplie > *')].map(e => e.className.split(' ')[0])")
              assert ordre == ["velo-ligne-tete", "velo-ligne-corps"], ordre
              assert pg.evaluate("document.querySelector('.velo-ligne-corps').firstElementChild.id") == "galerieVelo"
              assert pg.evaluate("document.querySelector('#galerieVelo').nextElementSibling.id") != ""
              assert pg.inner_text("#galerieVelo .galerie-compteur") == "1 / 3" and pg.inner_text("#galerieVelo .galerie-badge") == "Principale"
              pg.click("#galerieVelo .galerie-nav[aria-label='Photo suivante']"); pg.wait_for_timeout(300)
              assert pg.inner_text("#galerieVelo .galerie-compteur") == "2 / 3"
              # Fondu : une seule photo visible à la fois, avec une transition d'opacité
              assert pg.eval_on_selector_all("#galerieVelo .galerie-diapo.actif", "e => e.length") == 1
              assert pg.eval_on_selector("#galerieVelo .galerie-diapo", "e => getComputedStyle(e).transitionProperty + '|' + getComputedStyle(e).transitionDuration") == "opacity|0.9s"
              pg.click("#galerieVelo .galerie-point:nth-child(1)"); pg.wait_for_timeout(200)
              assert pg.inner_text("#galerieVelo .galerie-compteur") == "1 / 3"
              # Défilement automatique (délai raccourci pour le test), arrêté quand la souris est sur les photos
              pg.evaluate("delaiDiaporama = 700; rafraichirGalerieVelo()"); pg.wait_for_timeout(300)
              assert pg.inner_text("#galerieVelo .galerie-compteur") == "1 / 3"
              pg.wait_for_timeout(1000)
              assert pg.inner_text("#galerieVelo .galerie-compteur") in ("2 / 3", "3 / 3")
              pg.hover("#galerieVelo .galerie-piste"); figee = pg.inner_text("#galerieVelo .galerie-compteur"); pg.wait_for_timeout(1800)
              assert pg.inner_text("#galerieVelo .galerie-compteur") == figee
              pg.mouse.move(5, 5); pg.wait_for_timeout(1100)
              assert pg.inner_text("#galerieVelo .galerie-compteur") != figee
              pg.evaluate("delaiDiaporama = 600000; rafraichirGalerieVelo()"); pg.wait_for_timeout(300)
              # Ajout de 3 photos d'un coup : on arrive à 6, le bouton d'ajout disparaît
              fichiers = [{"name": "p%d.jpg" % i, "mimeType": "image/jpeg", "buffer": base64.b64decode(JPEG)} for i in range(3)]
              pg.set_input_files("#galeriePhotoInput", fichiers); pg.wait_for_timeout(2500)
              assert nb() == 6 and len(galeries[2]) == 5, (nb(), galeries)
              assert pg.is_visible("#galerieVelo .galerie-plein") and not pg.is_visible("#galerieVelo .galerie-ajout .photo-velo-bouton")
              # Au-delà de 6 : refusé
              pg.on("dialog", lambda d: d.accept())
              pg.set_input_files("#galeriePhotoInput", fichiers[:1]); pg.wait_for_timeout(1200)
              assert nb() == 6 and len(galeries[2]) == 5
              # Supprimer une photo supplémentaire
              pg.click("#galerieVelo .galerie-point:nth-child(3)"); pg.wait_for_timeout(1200)
              pg.click("#galerieVelo .galerie-diapo:nth-child(3) .galerie-suppr"); pg.wait_for_timeout(700)
              assert nb() == 5 and len(galeries[2]) == 4 and pg.is_visible("#galerieVelo .galerie-ajout .photo-velo-bouton")
              # Vélo sans photo : la première photo devient la photo principale, la suivante va dans la galerie
              pg.click("#listeMesVelos .velo-ligne:nth-child(3) .velo-ligne-fleche"); pg.wait_for_timeout(1000)
              assert nb() == 0 and "Aucune photo" in pg.inner_text("#galerieVelo")
              pg.set_input_files("#galeriePhotoInput", fichiers[:1]); pg.wait_for_timeout(2000)
              assert 3 in principales and galeries[3] == [] and nb() == 1, (principales.keys(), galeries[3], nb())
              pg.set_input_files("#galeriePhotoInput", fichiers[:1]); pg.wait_for_timeout(1500)
              assert len(galeries[3]) == 1 and nb() == 2
              # Le CUBE montre sa photo d'origine ; une photo ajoutée vient en plus
              pg.click("#listeMesVelos .velo-ligne:nth-child(1) .velo-ligne-fleche"); pg.wait_for_timeout(1000)
              assert nb() == 1 and pg.inner_text("#galerieVelo .galerie-badge") == "Principale"
              assert pg.eval_on_selector_all("#galerieVelo .galerie-suppr", "e => e.length") == 0
              assert not err, err
              nav.close()
          print("OK galerie : 6 photos au maximum, défilement, ajout, suppression")
          PY
          rm -f "$SQLITE_PATH"
          PYTHONPATH="$PWD" python "$RUNNER_TEMP/test_galerie.py"
      - name: Tester les pastilles rouges de nouveauté (mes actions / ce qui vient d'ailleurs)
        env:
          SQLITE_PATH: ${{ runner.temp }}/maillons-pastilles-test.db
          CODE_ACCES: test
        run: |
          cat > "$RUNNER_TEMP/test_pastilles.py" <<'PY'
          import json
          from urllib.parse import urlparse
          from playwright.sync_api import sync_playwright
          import main
          html = main.accueil()
          V = [{"id": 1, "nom": "Mon CUBE", "type": "vtt_electrique", "actif": 1, "km_total": 0, "km_frac": 0, "a_photo": 0, "sorties_a_verifier": 0}]
          def comp(i, nom, usure=50): return {"id": i, "nom": nom, "categorie": "piece", "pourcentage_usure": usure, "pos_x": 50, "pos_y": 50, "numero": i, "km_restants": 100, "seuil_km": 1000, "verification": False, "alerte_entretien": usure >= 90}
          HIST = [{"id": 1, "nom_composant": "Chaîne", "date": "2026-10-01", "notes": "x", "km": 100}]
          SORT = [{"id": 1, "nom": "Sortie 1", "debut": "2026-10-01T10:00:00", "distance": 10, "favori": 0, "a_verifier": 0}]
          ETAT = {"km_total": 0, "composants": [comp(11, "Pneu arrière / tubeless"), comp(13, "Cassette")]}
          err = []
          with sync_playwright() as p:
              nav = p.chromium.launch(); ctx = nav.new_context(viewport={"width": 390, "height": 900})
              def api(r):
                  u = urlparse(r.request.url); m = r.request.method
                  if u.path.endswith("/remplacer"):
                      HIST.append({"id": len(HIST) + 10, "nom_composant": "Pneu", "date": "2026-11-10", "notes": "n", "km": 0}); c = {"statut": "success"}
                  elif m == "POST" and u.path == "/api/velos":
                      V.append({"id": len(V) + 1, "nom": "Nouveau vélo", "type": "gravel", "actif": 1, "km_total": 0, "km_frac": 0, "a_photo": 0, "sorties_a_verifier": 0}); c = {"statut": "success", "velo_id": len(V)}
                  else: c = V if u.path == "/api/velos" else ETAT if u.path == "/api/etat" else HIST if u.path == "/api/historique" else SORT if u.path == "/api/sorties" else {"valeurs": {}, "maj_le": None} if u.path == "/api/mes-reglages" else {"terrain_route": 1, "terrain_mixte": 1.2, "terrain_chemin": 1.5, "terrain_sentier": 2, "poids_denivele": 1} if u.path == "/api/reglages" else []
                  r.fulfill(status=200, content_type="application/json", body=json.dumps(c))
              ctx.route("**/localhost/api/**", api); ctx.route(lambda u: not u.startswith("http://localhost/"), lambda r: r.abort())
              ctx.add_init_script("sessionStorage.setItem('vtt_code','t');sessionStorage.setItem('maillons_velo_id','1')")
              pg = ctx.new_page(); pg.on("dialog", lambda d: d.accept()); pg.on("pageerror", lambda e: err.append(str(e)))
              pg.route("http://localhost/", lambda r: r.fulfill(status=200, content_type="text/html", body=html))
              pg.goto("http://localhost/"); pg.wait_for_timeout(1500)
              badges = lambda: pg.evaluate("['entretien','historique','reglages','sorties'].filter(p => document.getElementById('onglet-'+p).classList.contains('avec-pastille'))")
              assert badges() == [], badges()
              # 1) Ce que je fais moi-même n'allume aucune pastille (entretien, nouveau vélo)
              pg.evaluate("remplacer(11,'Pneu arrière / tubeless','piece')"); pg.wait_for_timeout(300)
              pg.click("#boutonValiderRemplacement"); pg.wait_for_timeout(1500)
              assert badges() == [], badges()
              pg.evaluate("fetch('/api/velos', {method: 'POST', body: '{}'}).then(() => rechargerDonneesVelo ? chargerVelos().then(rechargerDonneesVelo) : null)"); pg.wait_for_timeout(1500)
              assert len(V) == 2 and badges() == [], (len(V), badges())
              # 2) Quelqu'un d'autre (ou un autre appareil) ajoute une sortie, un entretien et un vélo : pastilles aux bons endroits
              pg.evaluate("derniereModifLocale = 0")
              SORT.append({"id": 2, "nom": "Sortie 2", "debut": "2026-11-10T10:00:00", "distance": 20, "favori": 0, "a_verifier": 0})
              HIST.append({"id": 99, "nom_composant": "Autre", "date": "2026-11-10", "notes": "n", "km": 0})
              V.append({"id": 3, "nom": "Vélo d'ailleurs", "type": "route", "actif": 1, "km_total": 0, "km_frac": 0, "a_photo": 0, "sorties_a_verifier": 0})
              pg.reload(); pg.wait_for_timeout(1800)
              assert sorted(badges()) == ["historique", "reglages", "sorties"], badges()
              # 3) Ouvrir l'onglet efface sa pastille
              pg.click("#onglet-reglages"); pg.wait_for_timeout(300)
              assert sorted(badges()) == ["historique", "sorties"], badges()
              pg.click("#onglet-historique"); pg.wait_for_timeout(300)
              assert badges() == ["sorties"], badges()
              pg.click("#onglet-sorties"); pg.wait_for_timeout(300)
              assert badges() == [], badges()
              pg.click("#onglet-entretien"); pg.wait_for_timeout(300)
              # 4) Retour dans l'appli après un moment : le nouveau venu d'ailleurs est signalé sans recharger la page
              SORT.append({"id": 3, "nom": "Sortie 3", "debut": "2026-11-11T10:00:00", "distance": 5, "favori": 0, "a_verifier": 0})
              pg.evaluate("derniereVerifExterne = 0; document.dispatchEvent(new Event('visibilitychange'))"); pg.wait_for_timeout(1800)
              assert badges() == ["sorties"], badges()
