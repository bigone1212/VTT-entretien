name: Vérifications Maillons (branche de test)

on:
  push:
    branches:
      - reprise/2026-10-26-multivelos-base-main
      - reprise/2026-10-26-multivelos-completion
    paths:
      - "main.py"
      - ".github/workflows/maillons-check.yml"
  pull_request:
    branches:
      - main
    paths:
      - "main.py"
      - ".github/workflows/maillons-check.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  syntaxe-et-migration-sqlite:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: maillons_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d maillons_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Récupérer le code
        uses: actions/checkout@v4
      - name: Installer Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Vérifier la syntaxe Python complète
        run: python -m py_compile main.py
      - name: Vérifier le chargement initial du sélecteur multi-vélos
        run: |
          python - <<'PY'
          from pathlib import Path

          source = Path("main.py").read_text(encoding="utf-8")
          marqueur = "// Vérifie si un code est déjà en mémoire"
          debut = source.index(marqueur)
          fin = source.index("const MR_GROUPES", debut)
          initialisation = source[debut:fin]
          assert "await chargerVelos();" in initialisation, "Le sélecteur n'est pas chargé à la reconnexion"
          assert "await chargerEtat();" in initialisation, "L'état du vélo n'est pas chargé au démarrage"
          assert initialisation.index("await chargerVelos();") < initialisation.index("await chargerEtat();"), "L'état est chargé avant la liste des vélos"
          print("OK: reconnexion automatique, sélecteur multi-vélos chargé avant l'état du vélo.")
          PY
      - name: Installer les dépendances de l'application
        run: pip install -r requirements.txt
      - name: Démarrer l'application sur une copie SQLite isolée et vérifier la migration réelle
        env:
          SQLITE_PATH: ${{ runner.temp }}/maillons-migration-test.db
        run: |
          python - <<'PY'
          import os
          import sqlite3
          import subprocess
          import sys
          from pathlib import Path

          path = Path(os.environ["SQLITE_PATH"])
          if path.exists():
              path.unlink()

          # Ancien schéma représentatif, avec données à préserver.
          db = sqlite3.connect(path)
          db.executescript("""
              CREATE TABLE velo (
                  id INTEGER PRIMARY KEY CHECK (id = 1),
                  km_total INTEGER DEFAULT 2700,
                  date_achat TEXT,
                  km_maj_le TEXT,
                  km_frac REAL DEFAULT 0
              );
              INSERT INTO velo VALUES (1, 2700, '2025-11-18', '2026-10-26T14:33:17Z', 0);
              CREATE TABLE composants (
                  id INTEGER PRIMARY KEY AUTOINCREMENT,
                  nom TEXT NOT NULL,
                  km_depart INTEGER DEFAULT 0,
                  seuil_alerte INTEGER NOT NULL,
                  categorie TEXT DEFAULT 'piece',
                  pos_x INTEGER DEFAULT 50,
                  pos_y INTEGER DEFAULT 50
              );
              INSERT INTO composants (id, nom, km_depart, seuil_alerte, categorie)
              VALUES (1, 'Composant historique test', 1200, 2000, 'piece');
              CREATE TABLE historique (
                  id INTEGER PRIMARY KEY AUTOINCREMENT,
                  composant_id INTEGER,
                  date_remplacement TEXT,
                  cout DOUBLE PRECISION DEFAULT 0,
                  notes TEXT,
                  km_intervention INTEGER
              );
              INSERT INTO historique VALUES (1, 1, '2026-03-05', 0, 'Historique à conserver', 1236);
              CREATE TABLE sorties (
                  id INTEGER PRIMARY KEY AUTOINCREMENT,
                  nom TEXT,
                  debut TEXT NOT NULL UNIQUE,
                  sport TEXT,
                  distance_km DOUBLE PRECISION,
                  denivele_pos INTEGER,
                  denivele_neg INTEGER,
                  duree_s INTEGER,
                  vitesse_moy DOUBLE PRECISION,
                  alt_max INTEGER,
                  pente_moy_montee DOUBLE PRECISION,
                  terrain TEXT DEFAULT 'mixte',
                  notes TEXT,
                  km_compte INTEGER DEFAULT 0,
                  trace TEXT
              );
              INSERT INTO sorties (id, nom, debut, distance_km)
              VALUES (1, 'Sortie historique test', '2026-10-20T08:00:00Z', 25.5);
              CREATE TABLE reglages (cle TEXT PRIMARY KEY, valeur DOUBLE PRECISION NOT NULL);
              INSERT INTO reglages VALUES ('terrain_route', 1.0);
              CREATE TABLE mes_reglages (
                  cle TEXT PRIMARY KEY,
                  valeur TEXT NOT NULL,
                  maj_le TEXT
              );
              INSERT INTO mes_reglages VALUES ('taille_cadre', 'L', '2026-10-01');
          """)
          db.commit()
          db.close()

          # L'import de main appelle init_db : on teste donc le vrai démarrage
          # et les migrations, dans un processus séparé et une base temporaire.
          env = os.environ.copy()
          env.pop("DATABASE_URL", None)
          subprocess.run([sys.executable, "-c", "import main"], env=env, check=True)

          db = sqlite3.connect(path)
          db.row_factory = sqlite3.Row
          bike = db.execute("SELECT * FROM velos WHERE legacy_velo_id=1").fetchone()
          assert bike is not None, "Le CUBE historique n'a pas été créé"
          assert bike["km_total"] == 2700, dict(bike)
          assert bike["date_achat"] == "2025-11-18", dict(bike)
          assert bike["km_maj_le"] == "2026-10-26T14:33:17Z", dict(bike)
          assert db.execute("SELECT nom FROM composants WHERE id=1").fetchone()[0] == "Composant historique test"
          assert db.execute("SELECT km_intervention FROM historique WHERE id=1").fetchone()[0] == 1236
          assert db.execute("SELECT velo_id FROM historique WHERE id=1").fetchone()[0] == 1
          assert db.execute("SELECT distance_km FROM sorties WHERE id=1").fetchone()[0] == 25.5
          assert db.execute("SELECT valeur FROM mes_reglages WHERE cle='taille_cadre'").fetchone()[0] == "L"
          assert db.execute("SELECT valeur FROM mes_reglages_velo WHERE velo_id=1 AND cle='taille_cadre'").fetchone()[0] == "L"
          assert {"moteur", "batterie"}.issubset({row[1] for row in db.execute("PRAGMA table_info(velos)")})
          assert db.execute("SELECT velo_id FROM composants WHERE id=1").fetchone()[0] == 1
          assert db.execute("SELECT velo_id FROM sorties WHERE id=1").fetchone()[0] == 1
          count_bikes = db.execute("SELECT COUNT(*) FROM velos").fetchone()[0]
          count_components = db.execute("SELECT COUNT(*) FROM composants").fetchone()[0]
          db.close()

          # Deuxième démarrage : la migration doit être relançable sans doublons.
          subprocess.run([sys.executable, "-c", "import main"], env=env, check=True)
          db = sqlite3.connect(path)
          assert db.execute("SELECT COUNT(*) FROM velos").fetchone()[0] == count_bikes
          assert db.execute("SELECT COUNT(*) FROM composants").fetchone()[0] == count_components
          db.close()
          print("OK: démarrage réel sur SQLite temporaire, conservation des données et seconde migration sans doublon.")
          PY
      - name: Démarrer Maillons sur PostgreSQL temporaire et vérifier la migration réelle
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/maillons_test
        run: |
          python - <<'PY'
          import os
          import subprocess
          import sys
          import time
          import psycopg

          url = os.environ["DATABASE_URL"]

          # Prépare un schéma historique représentatif dans le conteneur PostgreSQL
          # jetable de ce job. Aucune adresse de base externe n'est utilisée.
          with psycopg.connect(url) as conn:
              conn.execute("""
                  CREATE TABLE velo (
                      id INTEGER PRIMARY KEY CHECK (id = 1),
                      km_total INTEGER DEFAULT 2700,
                      date_achat TEXT,
                      km_maj_le TEXT,
                      km_frac DOUBLE PRECISION DEFAULT 0
                  )
              """)
              conn.execute(
                  "INSERT INTO velo VALUES (1, 2700, '2025-11-18', '2026-10-26T14:33:17Z', 0)"
              )
              conn.execute("""
                  CREATE TABLE composants (
                      id SERIAL PRIMARY KEY,
                      nom TEXT NOT NULL,
                      km_depart INTEGER DEFAULT 0,
                      seuil_alerte INTEGER NOT NULL,
                      categorie TEXT DEFAULT 'piece',
                      pos_x INTEGER DEFAULT 50,
                      pos_y INTEGER DEFAULT 50
                  )
              """)
              conn.execute("""
                  INSERT INTO composants (nom, km_depart, seuil_alerte, categorie)
                  VALUES ('Composant historique test', 1200, 2000, 'piece')
              """)
              conn.execute("""
                  CREATE TABLE historique (
                      id SERIAL PRIMARY KEY,
                      composant_id INTEGER REFERENCES composants(id),
                      date_remplacement TEXT,
                      cout DOUBLE PRECISION DEFAULT 0,
                      notes TEXT,
                      km_intervention INTEGER
                  )
              """)
              conn.execute("""
                  INSERT INTO historique
                      (composant_id, date_remplacement, cout, notes, km_intervention)
                  VALUES (1, '2026-03-05', 0, 'Historique à conserver', 1236)
              """)
              conn.execute("""
                  CREATE TABLE sorties (
                      id SERIAL PRIMARY KEY,
                      nom TEXT,
                      debut TEXT NOT NULL UNIQUE,
                      sport TEXT,
                      distance_km DOUBLE PRECISION,
                      denivele_pos INTEGER,
                      denivele_neg INTEGER,
                      duree_s INTEGER,
                      vitesse_moy DOUBLE PRECISION,
                      alt_max INTEGER,
                      pente_moy_montee DOUBLE PRECISION,
                      terrain TEXT DEFAULT 'mixte',
                      notes TEXT,
                      km_compte INTEGER DEFAULT 0,
                      trace TEXT
                  )
              """)
              conn.execute("""
                  INSERT INTO sorties (nom, debut, distance_km)
                  VALUES ('Sortie historique test', '2026-10-20T08:00:00Z', 25.5)
              """)
              conn.execute("""
                  CREATE TABLE reglages (
                      cle TEXT PRIMARY KEY,
                      valeur DOUBLE PRECISION NOT NULL
                  )
              """)
              conn.execute("INSERT INTO reglages VALUES ('terrain_route', 1.0)")
              conn.execute("""
                  CREATE TABLE mes_reglages (
                      cle TEXT PRIMARY KEY,
                      valeur TEXT NOT NULL,
                      maj_le TEXT
                  )
              """)
              conn.execute(
                  "INSERT INTO mes_reglages VALUES ('taille_cadre', 'L', '2026-10-01')"
              )

          env = os.environ.copy()
          env.pop("SQLITE_PATH", None)
          subprocess.run([sys.executable, "-c", "import main"], env=env, check=True)

          with psycopg.connect(url) as conn:
              bike = conn.execute(
                  "SELECT * FROM velos WHERE legacy_velo_id = 1"
              ).fetchone()
              assert bike is not None, "Le CUBE historique n'a pas été créé"
              assert bike[8] == 2700, bike
              assert bike[10] == "2026-10-26T14:33:17Z", bike
              assert bike[11] == "2025-11-18", bike
              assert conn.execute(
                  "SELECT nom FROM composants WHERE id = 1"
              ).fetchone()[0] == "Composant historique test"
              assert conn.execute(
                  "SELECT km_intervention FROM historique WHERE id = 1"
              ).fetchone()[0] == 1236
              assert conn.execute(
                  "SELECT velo_id FROM historique WHERE id = 1"
              ).fetchone()[0] == 1
              assert conn.execute(
                  "SELECT distance_km FROM sorties WHERE id = 1"
              ).fetchone()[0] == 25.5
              assert conn.execute(
                  "SELECT valeur FROM mes_reglages WHERE cle = 'taille_cadre'"
              ).fetchone()[0] == "L"
              assert conn.execute(
                  "SELECT valeur FROM mes_reglages_velo WHERE velo_id = 1 AND cle = 'taille_cadre'"
              ).fetchone()[0] == "L"
              assert {"moteur", "batterie"}.issubset({
                  row[0] for row in conn.execute("""
                      SELECT column_name FROM information_schema.columns
                      WHERE table_name = 'velos'
                  """).fetchall()
              })
              assert conn.execute(
                  "SELECT velo_id FROM composants WHERE id = 1"
              ).fetchone()[0] == 1
              assert conn.execute(
                  "SELECT velo_id FROM sorties WHERE id = 1"
              ).fetchone()[0] == 1
              count_bikes = conn.execute("SELECT COUNT(*) FROM velos").fetchone()[0]
              count_components = conn.execute("SELECT COUNT(*) FROM composants").fetchone()[0]

          # Deuxième démarrage réel : vérifier l'idempotence sur PostgreSQL aussi.
          subprocess.run([sys.executable, "-c", "import main"], env=env, check=True)
          with psycopg.connect(url) as conn:
              assert conn.execute("SELECT COUNT(*) FROM velos").fetchone()[0] == count_bikes
              assert conn.execute("SELECT COUNT(*) FROM composants").fetchone()[0] == count_components

          print("OK: démarrage réel PostgreSQL temporaire, données historiques conservées, relance sans doublons.")
          PY
      - name: Vérifier la création et l'isolation des vélos sur SQLite
        env:
          SQLITE_PATH: ${{ runner.temp }}/maillons-multivelos-test.db
          CODE_ACCES: test
        run: |
          python - <<'PY'
          import main
          import db

          route = main.creer_velo(
              main.NouveauVeloRequest(nom="Gravel test", type="gravel"),
              x_code_acces="test"
          )
          route_id = route["velo_id"]
          electrique = main.creer_velo(
              main.NouveauVeloRequest(nom="VTT électrique test", type="vtt_electrique"),
              x_code_acces="test"
          )
          electrique_id = electrique["velo_id"]

          main.enregistrer_mes_reglages(
              main.MesReglagesRequest(valeurs={"taille_cadre": "M"}),
              velo_id=route_id,
              x_code_acces="test"
          )
          gravel_reglages = main.lire_mes_reglages(velo_id=route_id, x_code_acces="test")
          cube_reglages = main.lire_mes_reglages(velo_id=1, x_code_acces="test")
          assert gravel_reglages["valeurs"]["taille_cadre"] == "M"
          assert cube_reglages["valeurs"].get("taille_cadre") != "M"

          conn = db.connect()
          cursor = conn.cursor()
          cursor.execute("SELECT COUNT(*) FROM composants WHERE velo_id = ?", (route_id,))
          assert cursor.fetchone()[0] >= 7
          cursor.execute("SELECT COUNT(*) FROM composants WHERE velo_id = ? AND nom LIKE '%Moteur%'", (route_id,))
          assert cursor.fetchone()[0] == 0
          cursor.execute("SELECT COUNT(*) FROM composants WHERE velo_id = ? AND nom LIKE '%Moteur%'", (electrique_id,))
          assert cursor.fetchone()[0] == 1
          cursor.execute("SELECT COUNT(*) FROM composants WHERE velo_id = ?", (1,))
          assert cursor.fetchone()[0] > 0
          conn.close()

          fiche = main.modifier_fiche_velo(
              route_id,
              main.ModifierFicheVeloRequest(nom="Gravel test modifié", marque="Test"),
              x_code_acces="test"
          )
          assert fiche["nom"] == "Gravel test modifié"

          conn = db.connect()
          cursor = conn.cursor()
          cursor.execute("""
              INSERT INTO sorties (velo_id, nom, debut, distance_km, km_compte)
              VALUES (?, ?, ?, ?, 1)
          """, (route_id, "Sortie de transfert", "2026-10-25T10:00:00Z", 20))
          cursor.execute("SELECT id FROM sorties WHERE debut = ?", ("2026-10-25T10:00:00Z",))
          sortie_id = cursor.fetchone()[0]
          main.ajuster_km_total(cursor, 20, route_id)
          conn.commit()
          conn.close()

          transfert = main.affecter_sortie_a_un_autre_velo(
              sortie_id,
              main.AffecterSortieVeloRequest(nouveau_velo_id=electrique_id),
              velo_id=route_id,
              x_code_acces="test"
          )
          assert transfert["velo_nouveau"] == electrique_id
          conn = db.connect()
          cursor = conn.cursor()
          cursor.execute("SELECT velo_id, km_compte FROM sorties WHERE id = ?", (sortie_id,))
          sortie_transferee = cursor.fetchone()
          assert sortie_transferee[0] == electrique_id
          assert sortie_transferee[1] == 1
          cursor.execute("SELECT km_total FROM velos WHERE id = ?", (route_id,))
          assert cursor.fetchone()[0] == 0
          cursor.execute("SELECT km_total FROM velos WHERE id = ?", (electrique_id,))
          assert cursor.fetchone()[0] == 20
          conn.close()
          # L'import d'une sortie doit incrémenter uniquement le vélo sélectionné.
          analyser_original = main.gpx_import.analyser_activite
          main.gpx_import.analyser_activite = lambda **kwargs: {
              "nom": "Sortie test vélo A",
              "debut": "2026-10-26T08:00:00Z",
              "sport": "cycling",
              "distance_km": 12.5,
              "denivele_pos": 300,
              "denivele_neg": 280,
              "duree_s": 3600,
              "vitesse_moy": 12.5,
              "alt_max": 800,
              "pente_moy_montee": 7.0,
              "trace": "[]",
          }
          try:
              import_result = main.importer_sortie(
                  main.ImportGpxRequest(gpx="<gpx>" + (" " * 50) + "</gpx>", nom="Sortie test vélo A"),
                  velo_id=route_id,
                  x_code_acces="test"
              )
          finally:
              main.gpx_import.analyser_activite = analyser_original
          assert import_result["statut"] == "success", import_result
          assert import_result["ajoute_au_total"] is True, import_result

          sorties_route = main.lister_sorties(velo_id=route_id, x_code_acces="test")
          sorties_electrique = main.lister_sorties(velo_id=electrique_id, x_code_acces="test")
          assert any(s["nom"] == "Sortie test vélo A" for s in sorties_route)
          assert all(s["nom"] != "Sortie test vélo A" for s in sorties_electrique)

          conn = db.connect()
          cursor = conn.cursor()
          cursor.execute("SELECT id, velo_id, distance_km, km_compte FROM sorties WHERE debut = ?", ("2026-10-26T08:00:00Z",))
          sortie_importee = cursor.fetchone()
          assert sortie_importee is not None
          sortie_importee_id = sortie_importee[0]
          assert sortie_importee[1] == route_id
          assert sortie_importee[2] == 12.5
          assert sortie_importee[3] == 1
          cursor.execute("SELECT km_total, km_frac FROM velos WHERE id = ?", (route_id,))
          km_route = cursor.fetchone()
          assert km_route[0] + km_route[1] == 12.5, tuple(km_route)
          cursor.execute("SELECT km_total, km_frac FROM velos WHERE id = ?", (electrique_id,))
          km_electrique = cursor.fetchone()
          assert km_electrique[0] + km_electrique[1] == 20, tuple(km_electrique)
          conn.close()

          try:
              main.supprimer_sortie(
                  sortie_importee_id,
                  velo_id=electrique_id,
                  x_code_acces="test"
              )
              raise AssertionError("Un vélo a pu supprimer la sortie d'un autre vélo")
          except main.HTTPException as exc:
              assert exc.status_code == 404, exc.status_code

          conn = db.connect()
          cursor = conn.cursor()
          cursor.execute("SELECT COUNT(*) FROM sorties WHERE id = ? AND velo_id = ?", (sortie_importee_id, route_id))
          assert cursor.fetchone()[0] == 1
          conn.close()

          main.supprimer_sortie(
              sortie_importee_id,
              velo_id=route_id,
              x_code_acces="test"
          )
          conn = db.connect()
          cursor = conn.cursor()
          cursor.execute("SELECT km_total, km_frac FROM velos WHERE id = ?", (route_id,))
          km_route_apres_suppression = cursor.fetchone()
          assert km_route_apres_suppression[0] + km_route_apres_suppression[1] == 0, tuple(km_route_apres_suppression)
          cursor.execute("SELECT km_total, km_frac FROM velos WHERE id = ?", (electrique_id,))
          km_electrique_apres_suppression = cursor.fetchone()
          assert km_electrique_apres_suppression[0] + km_electrique_apres_suppression[1] == 20, tuple(km_electrique_apres_suppression)
          conn.close()

          # Les interventions d'entretien doivent rester propres à chaque vélo.
          conn = db.connect()
          cursor = conn.cursor()
          cursor.execute("SELECT id FROM composants WHERE velo_id = ? ORDER BY id LIMIT 1", (route_id,))
          composant_route = cursor.fetchone()[0]
          cursor.execute("SELECT seuil_alerte FROM composants WHERE id = ? AND velo_id = ?", (composant_route, route_id))
          seuil_initial = cursor.fetchone()[0]
          conn.close()

          main.modifier_seuils(
              composant_route,
              main.SeuilsRequest(seuil_alerte=1234, seuil_jours=90),
              velo_id=route_id,
              x_code_acces="test"
          )
          try:
              main.modifier_seuils(
                  composant_route,
                  main.SeuilsRequest(seuil_alerte=4321, seuil_jours=180),
                  velo_id=electrique_id,
                  x_code_acces="test"
              )
              raise AssertionError("Un vélo a pu modifier le composant d'un autre vélo")
          except main.HTTPException as exc:
              assert exc.status_code == 404, exc.status_code

          conn = db.connect()
          cursor = conn.cursor()
          cursor.execute("SELECT seuil_alerte, seuil_jours FROM composants WHERE id = ? AND velo_id = ?", (composant_route, route_id))
          assert tuple(cursor.fetchone()) == (1234, 90)
          conn.close()

          main.ajouter_historique(
              main.HistoriqueRequest(
                  composant_id=composant_route,
                  date_remplacement="2026-10-26",
                  km_intervention=0,
                  cout=0,
                  notes="Intervention test isolée"
              ),
              velo_id=route_id,
              x_code_acces="test"
          )
          conn = db.connect()
          cursor = conn.cursor()
          cursor.execute(
              "SELECT id FROM historique WHERE velo_id = ? AND composant_id = ? ORDER BY id DESC LIMIT 1",
              (route_id, composant_route)
          )
          historique_id = cursor.fetchone()[0]
          conn.close()

          historique_route = main.obtenir_historique(velo_id=route_id, x_code_acces="test")
          historique_electrique = main.obtenir_historique(velo_id=electrique_id, x_code_acces="test")
          assert any(h["id"] == historique_id for h in historique_route)
          assert all(h["id"] != historique_id for h in historique_electrique)

          etat_route = main.obtenir_etat(velo_id=route_id, x_code_acces="test")
          etat_electrique = main.obtenir_etat(velo_id=electrique_id, x_code_acces="test")
          ids_composants_route = {c["id"] for c in etat_route["composants"]}
          ids_composants_electrique = {c["id"] for c in etat_electrique["composants"]}
          assert composant_route in ids_composants_route
          assert composant_route not in ids_composants_electrique
          assert ids_composants_electrique
          assert ids_composants_route.isdisjoint(ids_composants_electrique)

          try:
              main.modifier_intervention(
                  historique_id,
                  main.HistoriqueModifRequest(
                      date_remplacement="2026-10-26",
                      km_intervention=0,
                      cout=0,
                      notes="Tentative interdite"
                  ),
                  velo_id=electrique_id,
                  x_code_acces="test"
              )
              raise AssertionError("Un vélo a pu modifier l'historique d'un autre vélo")
          except main.HTTPException as exc:
              assert exc.status_code == 404, exc.status_code

          try:
              main.supprimer_intervention(
                  historique_id,
                  velo_id=electrique_id,
                  x_code_acces="test"
              )
              raise AssertionError("Un vélo a pu supprimer l'historique d'un autre vélo")
          except main.HTTPException as exc:
              assert exc.status_code == 404, exc.status_code

          conn = db.connect()
          cursor = conn.cursor()
          cursor.execute("SELECT notes FROM historique WHERE id = ? AND velo_id = ?", (historique_id, route_id))
          assert cursor.fetchone()[0] == "Intervention test isolée"
          conn.close()

          main.supprimer_intervention(
              historique_id,
              velo_id=route_id,
              x_code_acces="test"
          )
          conn = db.connect()
          cursor = conn.cursor()
          cursor.execute("SELECT COUNT(*) FROM historique WHERE id = ?", (historique_id,))
          assert cursor.fetchone()[0] == 0
          conn.close()

          print("OK: création, fiche modifiable, composants par type, réglages isolés, transfert de sortie, et isolation des interventions.")
          PY
      - name: Vérifier le script de migration SQLite sur une base temporaire
        run: |
          python - <<'PY'
          import sqlite3
