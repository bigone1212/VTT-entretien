          # Code de Math (réglé dans Render) et codes personnels des autres.
          CODE_MATH = "code-de-math-123"
          CODE_2 = "code-ami-deux-456"
          CODE_3 = "code-ami-trois-789"
          main.CODE_ACCES = CODE_MATH
          os.environ["CODE_ACCES"] = CODE_MATH


          def ecrire(sql, p=()):
              c = db.connect()
              cur = c.cursor()
              cur.execute(sql, p)
              c.commit()
              c.close()


          def lire(sql, p=()):
              c = db.connect()
              cur = c.cursor()
              cur.execute(sql, p)
              r = [tuple(x) for x in cur.fetchall()]
              c.close()
              return r


          def refuse(statut, detail, fonction, *a, **k):
              try:
                  fonction(*a, **k)
              except HTTPException as e:
                  assert e.status_code == statut and e.detail == detail, (fonction.__name__, e.status_code, e.detail)
                  return
              raise AssertionError("%s aurait dû répondre %s" % (fonction.__name__, statut))


          def gpx(debut, km=10.0, nom="Sortie test"):
              t0 = datetime.strptime(debut, "%Y-%m-%dT%H:%M:%SZ")
              n = 120
              pas_m = km * 1000 / (n - 1)
              pts = []
              for i in range(n):
                  lat = 44.0 + (i * pas_m) / 111320.0
                  t = (t0 + timedelta(seconds=20 * i)).strftime("%Y-%m-%dT%H:%M:%SZ")
                  pts.append('<trkpt lat="%.6f" lon="2.500000"><ele>%d</ele><time>%s</time></trkpt>' % (lat, 500 + i % 10, t))
              return ('<?xml version="1.0"?><gpx version="1.1" creator="test" xmlns="http://www.topografix.com/GPX/1/1">'
                      '<trk><name>' + nom + '</name><trkseg>' + "".join(pts) + '</trkseg></trk></gpx>')


          def importer(code, debut, velo_id=None, nom="Sortie"):
              return main.importer_sortie(main.ImportGpxRequest(gpx=gpx(debut, 10.0, nom)), velo_id=velo_id, x_code_acces=code)


          # ---------------------------------------------------------------------------
          # A. Garde-fou : on lit main.py. Toute route doit contrôler le vélo demandé,
          #    sauf celles d'une liste explicite (avec la raison). Une nouvelle route qui
          #    oublie le contrôle fait échouer ce test.
          # ---------------------------------------------------------------------------
          SANS_CONTROLE_DE_VELO = {
              "accueil": "page publique, aucune donnée",
              "obtenir_velos": "liste filtrée sur la personne connectée",
              "creer_velo": "le propriétaire est la personne connectée",
              "recherche_fiche_velo": "recherche web, aucune donnée enregistrée",
              "photo_depuis_lien": "récupération d'une photo sur le web, aucune donnée enregistrée",
              "obtenir_reglages": "réglages d'usure de la personne connectée (sans vélo demandé)",
              "enregistrer_reglages": "réglages d'usure de la personne connectée (sans vélo demandé)",
              "sauvegarde": "export filtré sur la personne connectée",
              "qui_suis_je": "nom et statut de la personne connectée (sans vélo demandé)",
              "lister_personnes": "administration : réservée à l'administrateur (exiger_admin)",
              "ajouter_personne": "administration : réservée à l'administrateur (exiger_admin)",
              "nouveau_code_personne": "administration : réservée à l'administrateur (exiger_admin)",
              "activer_personne": "administration : réservée à l'administrateur (exiger_admin)",
              "supprimer_personne": "administration : réservée à l'administrateur (exiger_admin)",
              "renommer_personne": "administration : réservée à l'administrateur (exiger_admin)",
              "inscription": "publique : protégée par un code d'invitation à usage unique",
              "connexion": "publique : protégée par e-mail + mot de passe, avec blocage après 5 échecs",
              "deconnexion": "ferme la session de la personne connectée (verifier_auth)",
              "changer_mot_de_passe": "mot de passe de la personne connectée (verifier_auth)",
              "creer_invitation": "administration : réservée à l'administrateur (exiger_admin)",
              "lister_invitations": "administration : réservée à l'administrateur (exiger_admin)",
              "annuler_invitation": "administration : réservée à l'administrateur (exiger_admin)",
              "reinitialiser_mot_de_passe": "administration : réservée à l'administrateur (exiger_admin)",
          }

          arbre = ast.parse(open("main.py", encoding="utf-8").read())
          routes = []
          for noeud in arbre.body:
              if not isinstance(noeud, (ast.FunctionDef, ast.AsyncFunctionDef)):
                  continue
              est_route = any(
                  isinstance(d, ast.Call) and isinstance(d.func, ast.Attribute)
                  and isinstance(d.func.value, ast.Name) and d.func.value.id == "app"
                  for d in noeud.decorator_list
              )
              if est_route:
                  appels = {
                      n.func.id for n in ast.walk(noeud)
                      if isinstance(n, ast.Call) and isinstance(n.func, ast.Name)
                  }
                  routes.append((noeud.name, appels))

          assert len(routes) >= 40, "routes trouvées : %d" % len(routes)
          avec_controle = []
          for nom, appels in routes:
              if "controle_acces" in appels:
                  avec_controle.append(nom)
                  continue
              assert nom in SANS_CONTROLE_DE_VELO, (
                  "La route %s ne contrôle pas le vélo demandé (controle_acces). "
                  "Ajoute le contrôle, ou justifie-la dans SANS_CONTROLE_DE_VELO." % nom
              )
              if nom not in ("accueil", "inscription", "connexion"):
                  assert "verifier_auth" in appels or "exiger_admin" in appels, "La route %s n'a aucun contrôle d'accès" % nom
          for nom in SANS_CONTROLE_DE_VELO:
              assert nom in [r[0] for r in routes], "Liste d'exceptions périmée : %s n'est plus une route" % nom
          assert len(avec_controle) >= 30, len(avec_controle)

          # ---------------------------------------------------------------------------
          # B. Mise en place : Math (personne 1), deux amis, chacun avec son code.
          # ---------------------------------------------------------------------------
          ecrire("INSERT INTO personnes (nom) VALUES ('Ami deux')")
          ecrire("INSERT INTO personnes (nom) VALUES ('Ami trois')")
          c = db.connect()
          cur = c.cursor()
          main.definir_code_personne(cur, 2, CODE_2)
          main.definir_code_personne(cur, 3, CODE_3)
          c.commit()
          c.close()

          v_math = main.creer_velo(main.NouveauVeloRequest(nom="Gravel", type="gravel"), CODE_MATH)["velo_id"]
          v_ami = main.creer_velo(main.NouveauVeloRequest(nom="Gravel", type="gravel"), CODE_2)["velo_id"]  # même nom !
          assert len({1, v_math, v_ami}) == 3
          assert lire("SELECT personne_id FROM velos WHERE id = ?", (v_math,)) == [(1,)]
          assert lire("SELECT personne_id FROM velos WHERE id = ?", (v_ami,)) == [(2,)]

          ids_math = [v["id"] for v in main.obtenir_velos(CODE_MATH)]
          ids_ami = [v["id"] for v in main.obtenir_velos(CODE_2)]
          assert ids_math == [1, v_math], ids_math
          assert ids_ami == [v_ami], ids_ami
          assert main.obtenir_velos(CODE_3) == []

          # ---------------------------------------------------------------------------
          # C. Chaque route qui reçoit un vélo : l'ami 2 sur le vélo de Math = « introuvable ».
          #    Contre-épreuve : Math sur son propre vélo n'est jamais refusé pour ce motif.
          # ---------------------------------------------------------------------------
          ID_BIDON = 999999


          def arguments(fonction, code, velo_id):
              args = {}
              for nom, p in inspect.signature(fonction).parameters.items():
                  ann = p.annotation
                  if nom == "x_code_acces":
                      args[nom] = code
                  elif nom == "velo_id":
                      args[nom] = velo_id
                  elif isinstance(ann, type) and issubclass(ann, main.BaseModel):
                      fabrique = getattr(ann, "model_construct", None) or ann.construct
                      args[nom] = fabrique()
                  elif ann is int:
                      args[nom] = ID_BIDON
                  else:
                      raise AssertionError("paramètre inattendu %s de %s" % (nom, fonction.__name__))
              return args


          for nom in avec_controle:
              f = getattr(main, nom)
              # L'ami 2 vise le CUBE de Math (n° 1) et le 2e vélo de Math.
              for cible in (1, v_math):
                  refuse(404, "Vélo introuvable.", f, **arguments(f, CODE_2, cible))
              # L'ami 3 (sans vélo) aussi.
              refuse(404, "Vélo introuvable.", f, **arguments(f, CODE_3, 1))
              # Math n'est pas refusé pour ce motif sur son propre vélo.
              try:
                  f(**arguments(f, CODE_MATH, 1))
              except HTTPException as e:
                  assert e.detail != "Vélo introuvable.", (nom, "Math refusé sur son propre vélo")
              except Exception:
                  pass  # autre erreur (données factices) : le contrôle d'accès, lui, est passé

          # ---------------------------------------------------------------------------
          # D. Des données réelles : chacun ne voit que les siennes.
          # ---------------------------------------------------------------------------
          importer(CODE_MATH, "2030-01-01T08:00:00Z", velo_id=1, nom="Sortie Math 1")
          importer(CODE_MATH, "2030-01-03T08:00:00Z", nom="Sortie Math auto")       # automatique
          importer(CODE_2, "2030-01-02T08:00:00Z", nom="Sortie Ami auto")           # automatique : SON vélo
          assert lire("SELECT velo_id FROM sorties WHERE nom = 'Sortie Ami auto'") == [(v_ami,)]
          assert lire("SELECT velo_id FROM sorties WHERE nom = 'Sortie Math auto'")[0][0] in (1, v_math)

          noms_math = sorted(s["nom"] for v in (1, v_math) for s in main.lister_sorties(velo_id=v, x_code_acces=CODE_MATH))
          noms_ami = sorted(s["nom"] for s in main.lister_sorties(velo_id=v_ami, x_code_acces=CODE_2))
          assert noms_math == ["Sortie Math 1", "Sortie Math auto"], noms_math
          assert noms_ami == ["Sortie Ami auto"], noms_ami

          # Une personne sans vélo ne peut rien importer.
          refuse(404, "Vélo introuvable.", importer, CODE_3, "2030-01-05T08:00:00Z")

          # Déplacer une sortie vers le vélo de quelqu'un d'autre : refusé.
          sortie_ami = main.lister_sorties(velo_id=v_ami, x_code_acces=CODE_2)[0]["id"]
          refuse(
              404, "Le vélo de destination est introuvable.",
              main.affecter_sortie_a_un_autre_velo, sortie_ami,
              main.AffecterSortieVeloRequest(nouveau_velo_id=1), velo_id=v_ami, x_code_acces=CODE_2,
          )

          # Sauvegarde : seulement les siennes.
          s_ami = main.sauvegarde(CODE_2)
          assert [v["id"] for v in s_ami["velos"]] == [v_ami]
          assert {c["velo_id"] for c in s_ami["composants"]} == {v_ami}
          assert [s["nom"] for s in s_ami["sorties"]] == ["Sortie Ami auto"]
          assert all(h["velo_id"] == v_ami for h in s_ami["historique"])
          s_math = main.sauvegarde(CODE_MATH)
          assert [v["id"] for v in s_math["velos"]] == [1, v_math]
          assert v_ami not in {c["velo_id"] for c in s_math["composants"]}
          assert sorted(s["nom"] for s in s_math["sorties"]) == ["Sortie Math 1", "Sortie Math auto"]
          s_vide = main.sauvegarde(CODE_3)
          assert s_vide["velos"] == [] and s_vide["composants"] == [] and s_vide["sorties"] == [] and s_vide["historique"] == []

          # Les pastilles « à vérifier » ne comptent que les vélos de la personne.
          # (Un import automatique est marqué « à vérifier » : chacun en a une, la sienne.)
          ecrire("UPDATE sorties SET a_verifier = 1 WHERE nom = 'Sortie Ami auto'")
          assert {v["id"]: v["sorties_a_verifier"] for v in main.obtenir_velos(CODE_2)} == {v_ami: 1}
          chez_math = lire("SELECT COUNT(*) FROM sorties WHERE a_verifier = 1 AND velo_id IN (1, ?)", (v_math,))[0][0]
          assert chez_math == 1
          assert sum(v["sorties_a_verifier"] for v in main.obtenir_velos(CODE_MATH)) == chez_math

          # Math supprime son 2e vélo : celui de l'ami reste intact.
          main.supprimer_velo(v_math, CODE_MATH)
          assert [v["id"] for v in main.obtenir_velos(CODE_2)] == [v_ami]
          assert len(main.lister_sorties(velo_id=v_ami, x_code_acces=CODE_2)) == 1

          # Une personne garde toujours au moins un vélo : son dernier ne se supprime pas.
          refuse(400, "C'est ton dernier vélo : il ne peut pas être supprimé. Ajoute-en un autre d'abord.", main.supprimer_velo, v_ami, CODE_2)
          assert [v["id"] for v in main.obtenir_velos(CODE_2)] == [v_ami]

          # Deux personnes importent la MÊME sortie (faite ensemble) : permis. Deux fois la même : refusé.
          MEME = "2030-01-10T08:00:00Z"
          importer(CODE_MATH, MEME, velo_id=1, nom="Sortie ensemble Math")
          importer(CODE_2, MEME, nom="Sortie ensemble Ami")  # même heure de départ, autre personne
          assert lire("SELECT COUNT(*) FROM sorties WHERE debut = ?", (MEME,))[0][0] == 2
          assert sorted(r[0] for r in lire("SELECT velo_id FROM sorties WHERE debut = ?", (MEME,))) == sorted([1, v_ami])
          refuse(409, "Cette sortie est déjà importée.", importer, CODE_MATH, MEME, 1, "bis")
          refuse(409, "Cette sortie est déjà importée.", importer, CODE_2, MEME, None, "bis")

          # ---------------------------------------------------------------------------
          # E. Réglages d'usure : personnels. Math garde sa table d'origine.
          # ---------------------------------------------------------------------------
          PAR_DEFAUT = dict(main.REGLAGES_PAR_DEFAUT)


          def reglages(terrain_route=None, terrain_mixte=None, terrain_chemin=None, terrain_sentier=None, poids_denivele=None):
              d = dict(PAR_DEFAUT)
              for k, v in (("terrain_route", terrain_route), ("terrain_mixte", terrain_mixte),
                           ("terrain_chemin", terrain_chemin), ("terrain_sentier", terrain_sentier),
                           ("poids_denivele", poids_denivele)):
                  if v is not None:
                      d[k] = v
              return d


          assert main.obtenir_reglages(CODE_MATH) == PAR_DEFAUT
          assert main.obtenir_reglages(CODE_2) == PAR_DEFAUT
          assert main.obtenir_reglages(CODE_3) == PAR_DEFAUT
          assert sorted(main.obtenir_reglages(CODE_2)) == sorted(PAR_DEFAUT), "aucun marqueur technique exposé"

          coef_math_avant = main.lister_sorties(velo_id=1, x_code_acces=CODE_MATH)[0]["coef_usure"]
          coef_ami_avant = main.lister_sorties(velo_id=v_ami, x_code_acces=CODE_2)[0]["coef_usure"]

          # L'ami 2 règle SES coefficients : Math et l'ami 3 ne bougent pas.
          main.enregistrer_reglages(main.ReglagesRequest(**reglages(3.0, 3.0, 3.0, 3.0, 2.0)), CODE_2)
          assert main.obtenir_reglages(CODE_2) == reglages(3.0, 3.0, 3.0, 3.0, 2.0)
          assert main.obtenir_reglages(CODE_MATH) == PAR_DEFAUT
          assert main.obtenir_reglages(CODE_3) == PAR_DEFAUT
          # La table d'origine de Math n'a pas été touchée par l'écriture de l'ami.
          assert lire("SELECT cle, valeur FROM reglages WHERE cle IN ('terrain_sentier', 'poids_denivele') ORDER BY cle") == [
              ("poids_denivele", 1.0), ("terrain_sentier", 1.6)]
          assert lire("SELECT COUNT(*) FROM reglages_personne WHERE personne_id = 2")[0][0] == 5
          assert lire("SELECT COUNT(*) FROM reglages_personne WHERE personne_id <> 2")[0][0] == 0

          # Effet réel : le coefficient d'usure des sorties de l'ami change, celui de Math non.
          coef_ami_apres = main.lister_sorties(velo_id=v_ami, x_code_acces=CODE_2)[0]["coef_usure"]
          coef_math_apres = main.lister_sorties(velo_id=1, x_code_acces=CODE_MATH)[0]["coef_usure"]
          assert coef_ami_apres != coef_ami_avant, (coef_ami_avant, coef_ami_apres)
          assert coef_math_apres == coef_math_avant, (coef_math_avant, coef_math_apres)

          # Math règle les siens : l'ami 2 garde les siens (réécriture idempotente, pas de doublon).
          main.enregistrer_reglages(main.ReglagesRequest(**reglages(1.1, 1.2, 1.3, 1.4, 0.5)), CODE_MATH)
          assert main.obtenir_reglages(CODE_MATH) == reglages(1.1, 1.2, 1.3, 1.4, 0.5)
          assert main.obtenir_reglages(CODE_2) == reglages(3.0, 3.0, 3.0, 3.0, 2.0)
          main.enregistrer_reglages(main.ReglagesRequest(**reglages(3.0, 3.0, 3.0, 3.0, 2.5)), CODE_2)
          assert lire("SELECT COUNT(*) FROM reglages_personne WHERE personne_id = 2")[0][0] == 5
          assert main.obtenir_reglages(CODE_2)["poids_denivele"] == 2.5

          # Sauvegarde : chacun exporte ses réglages.
          assert main.sauvegarde(CODE_2)["reglages"] == reglages(3.0, 3.0, 3.0, 3.0, 2.5)
          assert main.sauvegarde(CODE_MATH)["reglages"] == reglages(1.1, 1.2, 1.3, 1.4, 0.5)
          assert main.sauvegarde(CODE_3)["reglages"] == PAR_DEFAUT

          # L'état des pièces se calcule avec les réglages de la personne (sans erreur pour chacun).
          assert main.obtenir_etat(velo_id=1, x_code_acces=CODE_MATH) is not None
          assert main.obtenir_etat(velo_id=v_ami, x_code_acces=CODE_2) is not None

          print("OK: cloisonnement par vélo et réglages d'usure (" + ("PostgreSQL" if db.USE_PG else "SQLite") + "), %d routes contrôlées." % len(avec_controle))
          PY
          rm -f "$SQLITE_PATH"
          PYTHONPATH="$PWD" python "$RUNNER_TEMP/test_cloisonnement.py"
          python - <<'PY2'
          import psycopg
          with psycopg.connect("postgresql://postgres:postgres@localhost:5432/maillons_test", autocommit=True) as c:
              c.execute("DROP DATABASE IF EXISTS maillons_cloisonnement")
              c.execute("CREATE DATABASE maillons_cloisonnement")
          PY2
          DATABASE_URL=postgresql://postgres:postgres@localhost:5432/maillons_cloisonnement PYTHONPATH="$PWD" python "$RUNNER_TEMP/test_cloisonnement.py"
      - name: Vérifier l'administration des personnes (codes, premier vélo, désactivation ; SQLite puis PostgreSQL)
        env:
          SQLITE_PATH: ${{ runner.temp }}/maillons-admin-test.db
          CODE_ACCES: test
        run: |
          cat > "$RUNNER_TEMP/test_admin.py" <<'PY'
          import os
          import re

          import db
          import main
          from fastapi import HTTPException

          CODE_MATH = "code-de-math-123"
          main.CODE_ACCES = CODE_MATH
          os.environ["CODE_ACCES"] = CODE_MATH


          def lire(sql, p=()):
              c = db.connect()
              cur = c.cursor()
              cur.execute(sql, p)
              r = [tuple(x) for x in cur.fetchall()]
              c.close()
              return r


          def refuse(statut, detail, fonction, *a, **k):
              try:
                  fonction(*a, **k)
              except HTTPException as e:
                  assert e.status_code == statut and e.detail == detail, (fonction.__name__, e.status_code, e.detail)
                  return
              raise AssertionError("%s aurait dû répondre %s" % (fonction.__name__, statut))


          def refuse_statut(statut, fonction, *a, **k):
              try:
                  fonction(*a, **k)
              except HTTPException as e:
                  assert e.status_code == statut, (fonction.__name__, e.status_code, e.detail)
                  return
              raise AssertionError("%s aurait dû répondre %s" % (fonction.__name__, statut))


          # 1. Math se reconnaît administrateur, la liste ne contient que lui.
          moi = main.qui_suis_je(CODE_MATH)
          assert moi == {"id": 1, "nom": "Math", "est_admin": True}, moi
          assert [(p["id"], p["nom"], p["est_admin"], p["actif"], p["a_un_code"]) for p in main.lister_personnes(CODE_MATH)] == [(1, "Math", True, True, True)]

          # 2. Ajouter une personne : un code lisible, un premier vélo à elle.
          r = main.ajouter_personne(main.NouvellePersonneRequest(nom="  Julie   Martin "), CODE_MATH)
          assert r["nom"] == "Julie Martin" and r["id"] == 2, r
          code_julie = r["code"]
          assert re.fullmatch("[a-z2-9]{4}-[a-z2-9]{4}-[a-z2-9]{4}", code_julie), code_julie
          assert not any(c in code_julie for c in "01oli".replace("-", "")), code_julie
          assert lire("SELECT personne_id, nom, type FROM velos WHERE id = ?", (r["velo_id"],)) == [(2, "Mon vélo", "vtt_electrique")]
          assert lire("SELECT COUNT(*) FROM composants WHERE velo_id = ?", (r["velo_id"],))[0][0] > 0, "le premier vélo doit avoir ses entretiens"
          # Le code n'est stocké que sous forme d'empreinte.
          assert all(code_julie not in str(x) for ligne in lire("SELECT * FROM personnes") for x in ligne)
          assert lire("SELECT code_hash IS NOT NULL, code_sel IS NOT NULL FROM personnes WHERE id = 2")[0] in ((1, 1), (True, True))

          # 3. Le code marche tout de suite : Julie est reconnue, voit son vélo et pas ceux de Math.
          assert main.verifier_auth(code_julie) == 2
          assert main.qui_suis_je(code_julie) == {"id": 2, "nom": "Julie Martin", "est_admin": False}
          assert [v["id"] for v in main.obtenir_velos(code_julie)] == [r["velo_id"]]
          assert 1 in [v["id"] for v in main.obtenir_velos(CODE_MATH)]
          refuse(404, "Vélo introuvable.", main.controle_acces, code_julie, 1)

          # 4. Julie ne peut rien administrer.
          for appel in (
              lambda: main.lister_personnes(code_julie),
              lambda: main.ajouter_personne(main.NouvellePersonneRequest(nom="Intrus"), code_julie),
              lambda: main.nouveau_code_personne(1, code_julie),
              lambda: main.activer_personne(2, main.PersonneActiveRequest(actif=False), code_julie),
          ):
              refuse(403, "Réservé à l'administrateur.", appel)
          assert lire("SELECT COUNT(*) FROM personnes")[0][0] == 2
          # Sans code ou avec un mauvais code : 401.
          refuse_statut(401, main.lister_personnes, "mauvais")
          refuse_statut(401, main.qui_suis_je, None)

          # 5. Refus : nom en double (même en majuscules), nom vide, type inconnu ; rien n'est créé.
          refuse(409, "Une personne porte déjà ce nom.", main.ajouter_personne, main.NouvellePersonneRequest(nom="JULIE martin"), CODE_MATH)
          refuse(400, "Donne un prénom ou un nom à la personne.", main.ajouter_personne, main.NouvellePersonneRequest(nom="   "), CODE_MATH)
          refuse(400, "Type de vélo inconnu.", main.ajouter_personne, main.NouvellePersonneRequest(nom="Paul", type_velo="trottinette"), CODE_MATH)
          assert lire("SELECT COUNT(*) FROM personnes")[0][0] == 2
          assert lire("SELECT COUNT(*) FROM velos")[0][0] == 2

          # 6. Deuxième personne, avec son type de vélo et le nom du vélo ; les codes sont différents.
          p = main.ajouter_personne(main.NouvellePersonneRequest(nom="Paul", nom_velo="Mon gravel", type_velo="gravel"), CODE_MATH)
          assert p["id"] == 3 and p["code"] != code_julie
          assert lire("SELECT nom, type, personne_id FROM velos WHERE id = ?", (p["velo_id"],)) == [("Mon gravel", "gravel", 3)]
          assert main.verifier_auth(p["code"]) == 3 and main.verifier_auth(code_julie) == 2

          # 7. Nouveau code : l'ancien cesse de marcher, le nouveau marche. Math (n° 1) refusé.
          n = main.nouveau_code_personne(2, CODE_MATH)
          assert n["code"] != code_julie
          refuse_statut(401, main.verifier_auth, code_julie)
          assert main.verifier_auth(n["code"]) == 2
          refuse(400, "Ton code se règle dans Render (CODE_ACCES), pas ici.", main.nouveau_code_personne, 1, CODE_MATH)
          refuse(404, "Personne introuvable.", main.nouveau_code_personne, 999, CODE_MATH)

          # 8. Désactiver : le code cesse de marcher aussitôt, les données restent ; réactiver : ça remarche.
          main.activer_personne(2, main.PersonneActiveRequest(actif=False), CODE_MATH)
          refuse_statut(401, main.verifier_auth, n["code"])
          assert lire("SELECT COUNT(*) FROM velos WHERE personne_id = 2")[0][0] == 1
          assert {x["id"]: x["actif"] for x in main.lister_personnes(CODE_MATH)} == {1: True, 2: False, 3: True}
          main.activer_personne(2, main.PersonneActiveRequest(actif=True), CODE_MATH)
          assert main.verifier_auth(n["code"]) == 2
          refuse(400, "Tu ne peux pas te désactiver toi-même.", main.activer_personne, 1, main.PersonneActiveRequest(actif=False), CODE_MATH)
          refuse(404, "Personne introuvable.", main.activer_personne, 999, main.PersonneActiveRequest(actif=True), CODE_MATH)
          assert main.verifier_auth(CODE_MATH) == 1

          # 9. La liste : nombre de vélos et présence d'un code.
          liste = {x["id"]: x for x in main.lister_personnes(CODE_MATH)}
          assert liste[2]["nb_velos"] == 1 and liste[2]["a_un_code"] and liste[3]["nb_velos"] == 1
          assert "code" not in liste[2] and "code_hash" not in liste[2]

          # 10. Le code généré est bien aléatoire et lisible (50 codes tous différents, bon format).
          codes = {main.generer_code_personnel() for _ in range(50)}
          assert len(codes) == 50 and all(re.fullmatch("[a-z2-9]{4}-[a-z2-9]{4}-[a-z2-9]{4}", c) for c in codes)

          # 11. Le premier vélo d'une personne est créé comme tout vélo : même création que « Ajouter un vélo ».
          v = main.creer_velo(main.NouveauVeloRequest(nom="Route de Julie", type="route"), n["code"])
          assert lire("SELECT personne_id FROM velos WHERE id = ?", (v["velo_id"],)) == [(2,)]
          assert [x["id"] for x in main.obtenir_velos(n["code"])] == sorted([x["id"] for x in main.obtenir_velos(n["code"])])
          assert len(main.obtenir_velos(n["code"])) == 2

          # 12. Suppression d'une personne : tout ce qui est à elle disparaît, rien d'autre ne bouge.
          def ecrire(requete, p=()):
              c = db.connect()
              cur = c.cursor()
              cur.execute(requete, p)
              c.commit()
              c.close()


          def empreinte(personne_id):
              """Tout ce qui appartient à une personne, pour comparer avant / après."""
              velos = [r[0] for r in lire("SELECT id FROM velos WHERE personne_id = ? ORDER BY id", (personne_id,))]
              marques = ",".join("?" * len(velos)) if velos else "NULL"
              return {
                  "velos": lire("SELECT * FROM velos WHERE personne_id = ? ORDER BY id", (personne_id,)),
                  "composants": lire("SELECT COUNT(*) FROM composants WHERE velo_id IN (" + marques + ")", tuple(velos)),
                  "sorties": lire("SELECT COUNT(*) FROM sorties WHERE velo_id IN (" + marques + ")", tuple(velos)),
                  "historique": lire("SELECT COUNT(*) FROM historique WHERE velo_id IN (" + marques + ")", tuple(velos)),
                  "mes_reglages_velo": lire("SELECT COUNT(*) FROM mes_reglages_velo WHERE velo_id IN (" + marques + ")", tuple(velos)),
                  "reglages_personne": lire("SELECT COUNT(*) FROM reglages_personne WHERE personne_id = ?", (personne_id,)),
              }


          velos_julie = [x["id"] for x in main.obtenir_velos(n["code"])]
          assert len(velos_julie) == 2
          for i, vj in enumerate(velos_julie):
              ecrire("INSERT INTO sorties (velo_id, debut, distance_km) VALUES (?, ?, ?)", (vj, "2031-01-0%dT08:00:00Z" % (i + 1), 12.5))
              comp = lire("SELECT id FROM composants WHERE velo_id = ? LIMIT 1", (vj,))[0][0]
              ecrire("INSERT INTO historique (composant_id, velo_id) VALUES (?, ?)", (comp, vj))
              ecrire(
                  "INSERT INTO mes_reglages_velo (velo_id, cle, valeur, maj_le) VALUES (?, 'x', 'y', 'z')", (vj,))
          ecrire("INSERT INTO reglages_personne (personne_id, cle, valeur) VALUES (2, 'terrain_route', 1.1)")
          ecrire("INSERT INTO sorties (velo_id, debut, distance_km) VALUES (1, '2031-02-01T08:00:00Z', 30)")
          ecrire("INSERT INTO sorties (velo_id, debut, distance_km) VALUES (?, '2031-02-02T08:00:00Z', 31)", (p["velo_id"],))
          ecrire("INSERT INTO reglages_personne (personne_id, cle, valeur) VALUES (3, 'terrain_route', 1.3)")
          avant_julie = empreinte(2)
          assert avant_julie["sorties"] == [(2,)] and avant_julie["historique"] == [(2,)] and avant_julie["reglages_personne"] == [(1,)]
          avant_math, avant_paul = empreinte(1), empreinte(3)

          # Refus : non-administrateur (403), soi-même (400), inconnu (404), administrateur (400), rien n'est effacé.
          refuse(403, "Réservé à l'administrateur.", main.supprimer_personne, 3, n["code"])
          refuse(400, "Tu ne peux pas supprimer ton propre compte.", main.supprimer_personne, 1, CODE_MATH)
          refuse(404, "Personne introuvable.", main.supprimer_personne, 999, CODE_MATH)
          ecrire("INSERT INTO personnes (nom, est_admin, actif) VALUES ('Admin bis', 1, 1)")
          admin_bis = lire("SELECT id FROM personnes WHERE nom = 'Admin bis'")[0][0]
          refuse(400, "Un administrateur ne peut pas être supprimé ici.", main.supprimer_personne, admin_bis, CODE_MATH)
          ecrire("DELETE FROM personnes WHERE id = ?", (admin_bis,))
          refuse_statut(401, main.supprimer_personne, 2, "mauvais")
          assert empreinte(2) == avant_julie, "un refus ne doit rien effacer"

          # La vraie suppression (Julie est ici désactivée : on doit pouvoir supprimer aussi une personne désactivée).
          main.activer_personne(2, main.PersonneActiveRequest(actif=False), CODE_MATH)
          r = main.supprimer_personne(2, CODE_MATH)
          assert r["statut"] == "success" and r["nom"] == "Julie Martin" and r["velos_effaces"] == 2, r
          assert lire("SELECT COUNT(*) FROM personnes WHERE id = 2")[0][0] == 0
          vide = empreinte(2)
          assert vide["velos"] == [] and all(v == [(0,)] for k, v in vide.items() if k != "velos"), vide
          for vj in velos_julie:
              for table in ("composants", "sorties", "historique", "mes_reglages_velo"):
                  assert lire("SELECT COUNT(*) FROM " + table + " WHERE velo_id = ?", (vj,))[0][0] == 0, (table, vj)
          assert lire("SELECT COUNT(*) FROM historique WHERE composant_id NOT IN (SELECT id FROM composants)")[0][0] == 0, "historique orphelin"
          # Math et Paul n'ont rien perdu, rien gagné.
          assert empreinte(1) == avant_math and empreinte(3) == avant_paul
          assert main.verifier_auth(CODE_MATH) == 1 and main.verifier_auth(p["code"]) == 3
          refuse_statut(401, main.verifier_auth, n["code"])
          assert [x["id"] for x in main.lister_personnes(CODE_MATH)] == [1, 3]
          refuse(404, "Personne introuvable.", main.supprimer_personne, 2, CODE_MATH)

          # Le prénom est de nouveau libre : on peut recréer « Julie Martin », avec un autre numéro et un autre code.
          r2 = main.ajouter_personne(main.NouvellePersonneRequest(nom="Julie Martin"), CODE_MATH)
          assert r2["id"] not in (1, 3) and r2["code"] != n["code"] and main.verifier_auth(r2["code"]) == r2["id"]
          assert [x["id"] for x in main.obtenir_velos(r2["code"])] == [r2["velo_id"]]
          assert empreinte(r2["id"])["sorties"] == [(0,)], "la nouvelle personne ne doit rien hériter de l'ancienne"

          # 13. Renommer : seul le nom change.
          avant_paul = empreinte(3)
          code_paul = p["code"]
          r = main.renommer_personne(3, main.RenommerPersonneRequest(nom="  Paul   Durand "), CODE_MATH)
          assert r == {"statut": "success", "id": 3, "nom": "Paul Durand"}, r
          assert lire("SELECT nom, est_admin, actif FROM personnes WHERE id = 3") == [("Paul Durand", 0, 1)]
          assert main.verifier_auth(code_paul) == 3 and main.qui_suis_je(code_paul)["nom"] == "Paul Durand"
          assert empreinte(3) == avant_paul, "renommer ne doit toucher ni vélos ni données"
          assert [x["nom"] for x in main.lister_personnes(CODE_MATH)][:2] == ["Math", "Paul Durand"]
          # Même nom écrit autrement : permis pour soi-même (changer la casse).
          main.renommer_personne(3, main.RenommerPersonneRequest(nom="PAUL durand"), CODE_MATH)
          assert lire("SELECT nom FROM personnes WHERE id = 3") == [("PAUL durand",)]
          main.renommer_personne(3, main.RenommerPersonneRequest(nom="Paul Durand"), CODE_MATH)
          # Refus : nom pris par une autre personne (même en minuscules), vide, inconnu, non-administrateur, sans code.
          refuse(409, "Une personne porte déjà ce nom.", main.renommer_personne, 3, main.RenommerPersonneRequest(nom="math"), CODE_MATH)
          refuse(409, "Une personne porte déjà ce nom.", main.renommer_personne, 1, main.RenommerPersonneRequest(nom="paul DURAND"), CODE_MATH)
          refuse(400, "Donne un prénom ou un nom à la personne.", main.renommer_personne, 3, main.RenommerPersonneRequest(nom="   "), CODE_MATH)
          refuse(404, "Personne introuvable.", main.renommer_personne, 999, main.RenommerPersonneRequest(nom="Zoé"), CODE_MATH)
          refuse(403, "Réservé à l'administrateur.", main.renommer_personne, 1, main.RenommerPersonneRequest(nom="Pirate"), code_paul)
          refuse_statut(401, main.renommer_personne, 3, main.RenommerPersonneRequest(nom="Zoé"), "mauvais")
          assert [x["nom"] for x in main.lister_personnes(CODE_MATH)][:2] == ["Math", "Paul Durand"], "les refus ne changent rien"
          # L'ancien nom est libre.
          main.renommer_personne(3, main.RenommerPersonneRequest(nom="Paulo"), CODE_MATH)
          assert main.ajouter_personne(main.NouvellePersonneRequest(nom="Paul Durand"), CODE_MATH)["nom"] == "Paul Durand"
          # Math peut se renommer : il reste administrateur, son code ne change pas.
          main.renommer_personne(1, main.RenommerPersonneRequest(nom="Mathieu"), CODE_MATH)
          assert main.qui_suis_je(CODE_MATH) == {"id": 1, "nom": "Mathieu", "est_admin": True}
          assert main.verifier_auth(CODE_MATH) == 1
          main.renommer_personne(1, main.RenommerPersonneRequest(nom="Math"), CODE_MATH)
          assert main.qui_suis_je(CODE_MATH)["nom"] == "Math"

          print("OK: administration des personnes (" + ("PostgreSQL" if db.USE_PG else "SQLite") + ").")
          PY
          rm -f "$SQLITE_PATH"
          PYTHONPATH="$PWD" python "$RUNNER_TEMP/test_admin.py"
          python - <<'PY2'
          import psycopg
          with psycopg.connect("postgresql://postgres:postgres@localhost:5432/maillons_test", autocommit=True) as c:
              c.execute("DROP DATABASE IF EXISTS maillons_admin")
              c.execute("CREATE DATABASE maillons_admin")
          PY2
          DATABASE_URL=postgresql://postgres:postgres@localhost:5432/maillons_admin PYTHONPATH="$PWD" python "$RUNNER_TEMP/test_admin.py"
      - name: Vérifier l'inscription sur invitation, la connexion par e-mail et les sessions (SQLite puis PostgreSQL)
        env:
          SQLITE_PATH: ${{ runner.temp }}/maillons-inscription-test.db
          CODE_ACCES: test
        run: |
          cat > "$RUNNER_TEMP/test_inscription.py" <<'PY'
          import os
          import re

          import db
          import main
          from fastapi import HTTPException

          # Les attentes de 0,5 s sur un refus ralentiraient inutilement ce test.
          main.time.sleep = lambda secondes: None

          CODE_MATH = "code-de-math-123"
          main.CODE_ACCES = CODE_MATH
          os.environ["CODE_ACCES"] = CODE_MATH
          MDP = "velo-de-julie-2026"


          def lire(sql, p=()):
              c = db.connect()
              cur = c.cursor()
              cur.execute(sql, p)
              r = [tuple(x) for x in cur.fetchall()]
              c.close()
              return r


          def ecrire(sql, p=()):
              c = db.connect()
              cur = c.cursor()
              cur.execute(sql, p)
              c.commit()
              c.close()


          def refuse(statut, detail, fonction, *a, **k):
              try:
                  fonction(*a, **k)
              except HTTPException as e:
                  assert e.status_code == statut and e.detail == detail, (fonction.__name__, e.status_code, e.detail)
                  return
              raise AssertionError("%s aurait dû répondre %s" % (fonction.__name__, statut))


          def refuse_statut(statut, fonction, *a, **k):
              try:
                  fonction(*a, **k)
              except HTTPException as e:
                  assert e.status_code == statut, (fonction.__name__, e.status_code, e.detail)
                  return
              raise AssertionError("%s aurait dû répondre %s" % (fonction.__name__, statut))


          def invitation(pour=None):
              return main.creer_invitation(main.NouvelleInvitationRequest(pour=pour), CODE_MATH)


          def formulaire(code, **autres):
              champs = dict(code_invitation=code, nom="Julie", email="Julie@Exemple.fr", mot_de_passe=MDP,
                            confirmation=MDP, type_velo="gravel", nom_velo="Mon gravel", date_achat="2024-05-17")
              champs.update(autres)
              return main.InscriptionRequest(**champs)


          def tout_le_texte():
              """Tout ce que la base contient, en texte : on y cherche les secrets qui ne doivent pas y être."""
              morceaux = []
              for table in ("personnes", "sessions", "invitations"):
                  morceaux += [str(x) for ligne in lire("SELECT * FROM " + table) for x in ligne]
              return " | ".join(morceaux)


          # ---------- 1. Fonctions de base
          h1, h2 = main.hacher_mot_de_passe("abcdefgh"), main.hacher_mot_de_passe("abcdefgh")
          assert h1 != h2 and h1.startswith("pbkdf2_sha256$300000$")
          assert main.verifier_mot_de_passe("abcdefgh", h1) and not main.verifier_mot_de_passe("abcdefgi", h1)
          for faux in (None, "", "n'importe quoi", "a$b$c$d", "pbkdf2_sha256$x$y$z", "md5$1$a$b"):
              assert main.verifier_mot_de_passe("abcdefgh", faux) is False, faux
          assert main.nettoyer_email("  Julie@Exemple.FR ") == "julie@exemple.fr"
          for mauvais in ("", "julie", "julie@", "@exemple.fr", "a@b", "a@@b.fr", "a b@c.fr", "a@.fr", "a@b.", "a@b..fr", None):
              assert main.nettoyer_email(mauvais) is None, mauvais

          # ---------- 2. Invitations (réservées à Math)
          inv = invitation("Julie")
          assert re.fullmatch("[a-z2-9]{4}(-[a-z2-9]{4}){3}", inv["code"]), inv
          assert inv["pour"] == "Julie" and inv["expire_le"] > main.iso_utc(main.datetime.now(main.timezone.utc))
          assert inv["code"] not in tout_le_texte() and inv["code"].replace("-", "") not in tout_le_texte(), "le code ne doit pas être gardé en clair"
          liste = main.lister_invitations(CODE_MATH)
          assert [(x["id"], x["pour"], x["etat"], x["utilisee_par"]) for x in liste] == [(inv["id"], "Julie", "en_attente", None)]
          assert "code" not in liste[0] and "code_hash" not in liste[0]
          ami = main.ajouter_personne(main.NouvellePersonneRequest(nom="Ami"), CODE_MATH)  # connexion par code d'accès
          refuse(403, "Réservé à l'administrateur.", main.creer_invitation, main.NouvelleInvitationRequest(), ami["code"])
          refuse(403, "Réservé à l'administrateur.", main.lister_invitations, ami["code"])
          refuse(403, "Réservé à l'administrateur.", main.annuler_invitation, inv["id"], ami["code"])
          refuse_statut(401, main.creer_invitation, main.NouvelleInvitationRequest(), "faux")
          assert invitation()["code"] != inv["code"]

          # ---------- 3. Inscription : le cas normal
          avant = lire("SELECT COUNT(*) FROM personnes")[0][0]
          r = main.inscription(formulaire(inv["code"]))
          assert r["statut"] == "success" and r["token"].startswith("ses_") and r["nom"] == "Julie", r
          jeton, pid = r["token"], r["id"]
          ligne = lire("SELECT email, est_admin, actif, mot_de_passe, mdp_provisoire, code_hash FROM personnes WHERE id = ?", (pid,))[0]
          assert ligne[0] == "julie@exemple.fr" and ligne[1] == 0 and ligne[2] == 1 and ligne[4] == 0 and ligne[5] is None
          assert ligne[3].startswith("pbkdf2_sha256$300000$")
          texte = tout_le_texte()
          assert MDP not in texte and jeton not in texte and jeton[4:] not in texte, "mot de passe et jeton jamais en clair"
          assert lire("SELECT nom, type, date_achat, personne_id FROM velos WHERE id = ?", (r["velo_id"],)) == [("Mon gravel", "gravel", "2024-05-17", pid)]
          assert lire("SELECT COUNT(*) FROM composants WHERE velo_id = ?", (r["velo_id"],))[0][0] > 0
          etat = {x["id"]: x for x in main.lister_invitations(CODE_MATH)}[inv["id"]]
          assert etat["etat"] == "utilisee" and etat["utilisee_par"] == "Julie"
          # Le jeton ouvre exactement ce que le code ouvrait : ses vélos, rien de ceux des autres.
          assert main.verifier_auth(jeton) == pid
          assert main.qui_suis_je(jeton) == {"id": pid, "nom": "Julie", "est_admin": False}
          assert [v["id"] for v in main.obtenir_velos(jeton)] == [r["velo_id"]]
          refuse(404, "Vélo introuvable.", main.controle_acces, jeton, 1)
          refuse(403, "Réservé à l'administrateur.", main.lister_personnes, jeton)
          assert main.verifier_auth(CODE_MATH) == 1 and main.verifier_auth(ami["code"]) == ami["id"], "les anciens codes marchent toujours"

          # ---------- 4. Invitation inutilisable : déjà utilisée, inconnue, annulée, expirée
          MAUVAISE = "Code d'invitation invalide ou expiré."
          refuse(403, MAUVAISE, main.inscription, formulaire(inv["code"], nom="Autre", email="autre@exemple.fr"))
          refuse(403, MAUVAISE, main.inscription, formulaire("zzzz-zzzz-zzzz-zzzz", nom="Autre", email="autre@exemple.fr"))
          annulee = invitation()
          main.annuler_invitation(annulee["id"], CODE_MATH)
          refuse(403, MAUVAISE, main.inscription, formulaire(annulee["code"], nom="Autre", email="autre@exemple.fr"))
          refuse(400, "Cette invitation est déjà utilisée.", main.annuler_invitation, inv["id"], CODE_MATH)
          refuse(404, "Invitation introuvable.", main.annuler_invitation, 9999, CODE_MATH)
          perimee = invitation()
          ecrire("UPDATE invitations SET expire_le = '2000-01-01T00:00:00Z' WHERE id = ?", (perimee["id"],))
          refuse(403, MAUVAISE, main.inscription, formulaire(perimee["code"], nom="Autre", email="autre@exemple.fr"))
          etats = {x["id"]: x["etat"] for x in main.lister_invitations(CODE_MATH)}
          assert etats[annulee["id"]] == "annulee" and etats[perimee["id"]] == "expiree"
          # Le code est reconnu même écrit en majuscules ou avec des espaces autour.
          cas = invitation()
          r2 = main.inscription(formulaire("  " + cas["code"].upper() + " ", nom="Paul", email="paul@exemple.fr"))
          assert r2["nom"] == "Paul"

          # ---------- 5. Formulaire refusé : rien n'est créé et l'invitation reste valable
          bonne = invitation()
          n_personnes = lire("SELECT COUNT(*) FROM personnes")[0][0]
          n_velos = lire("SELECT COUNT(*) FROM velos")[0][0]
          essais = [
              (400, "Les deux mots de passe ne sont pas identiques.", dict(confirmation="autre-chose-123")),
              (400, "Le mot de passe doit faire au moins 8 caractères.", dict(mot_de_passe="court", confirmation="court")),
              (400, "Le mot de passe est trop long (128 caractères au maximum).", dict(mot_de_passe="a" * 129, confirmation="a" * 129)),
              (400, "Ce mot de passe est trop facile à deviner. Choisis-en un autre.", dict(mot_de_passe="MotDePasse", confirmation="MotDePasse")),
              (400, "Ce mot de passe est trop facile à deviner. Choisis-en un autre.", dict(email="nouvelle@exemple.fr", mot_de_passe="nouvelle@exemple.fr", confirmation="nouvelle@exemple.fr")),
              (400, "Cette adresse e-mail n'a pas l'air valide.", dict(email="pas-un-mail")),
              (400, "Type de vélo inconnu.", dict(type_velo="trottinette")),
              (400, "Date d'achat non valide.", dict(date_achat="31/12/2024")),
              (400, "Donne ton prénom.", dict(nom="   ")),
              (409, "Ce prénom est déjà pris : ajoute une initiale, par exemple Paul D.", dict(nom="JULIE", email="nouvelle@exemple.fr")),
              (409, "Cette adresse e-mail est déjà utilisée.", dict(nom="Autre Julie", email="JULIE@exemple.FR")),
          ]
          for statut, detail, champs in essais:
              if "email" not in champs:
                  champs["email"] = "nouvelle@exemple.fr"
              if "nom" not in champs:
                  champs["nom"] = "Nouvelle"
              refuse(statut, detail, main.inscription, formulaire(bonne["code"], **champs))
          assert lire("SELECT COUNT(*) FROM personnes")[0][0] == n_personnes and lire("SELECT COUNT(*) FROM velos")[0][0] == n_velos
          assert {x["id"]: x["etat"] for x in main.lister_invitations(CODE_MATH)}[bonne["id"]] == "en_attente", "un refus ne consomme pas l'invitation"
          # Sans nom de vélo ni date : « Mon vélo », VTT électrique par défaut.
          r3 = main.inscription(main.InscriptionRequest(code_invitation=bonne["code"], nom="Zoé", email="zoe@exemple.fr",
                                                        mot_de_passe=MDP, confirmation=MDP))
          assert lire("SELECT nom, type, date_achat FROM velos WHERE id = ?", (r3["velo_id"],)) == [("Mon vélo", "vtt_electrique", main.date.today().isoformat())]

          # ---------- 6. Connexion
          c = main.connexion(main.ConnexionRequest(email="  JULIE@exemple.fr ", mot_de_passe=MDP))
          assert c["token"].startswith("ses_") and c["token"] != jeton and c["nom"] == "Julie" and c["est_admin"] is False
          assert c["mot_de_passe_provisoire"] is False
          assert main.verifier_auth(c["token"]) == pid and main.verifier_auth(jeton) == pid, "deux appareils, deux sessions"
          GENERIQUE = main.MESSAGE_CONNEXION_REFUSEE
          refuse(401, GENERIQUE, main.connexion, main.ConnexionRequest(email="julie@exemple.fr", mot_de_passe="mauvais-mot-de-passe"))
          refuse(401, GENERIQUE, main.connexion, main.ConnexionRequest(email="inconnu@exemple.fr", mot_de_passe=MDP))
          refuse(401, GENERIQUE, main.connexion, main.ConnexionRequest(email="pas-un-mail", mot_de_passe=MDP))
          refuse(401, GENERIQUE, main.connexion, main.ConnexionRequest(email="math@exemple.fr", mot_de_passe=MDP))
          # Une personne qui se connecte par code d'accès n'a pas de connexion par e-mail.
          ecrire("UPDATE personnes SET email = 'ami@exemple.fr' WHERE id = ?", (ami["id"],))
          refuse(401, GENERIQUE, main.connexion, main.ConnexionRequest(email="ami@exemple.fr", mot_de_passe=MDP))

          # Blocage : 5 essais ratés, puis même le bon mot de passe est refusé (429) jusqu'à la fin du blocage.
          for _ in range(4):
              refuse(401, GENERIQUE, main.connexion, main.ConnexionRequest(email="paul@exemple.fr", mot_de_passe="mauvais-mot-de-passe"))
          assert lire("SELECT echecs_connexion FROM personnes WHERE id = ?", (r2["id"],)) == [(4,)]
          refuse(401, GENERIQUE, main.connexion, main.ConnexionRequest(email="paul@exemple.fr", mot_de_passe="mauvais-mot-de-passe"))
          refuse(429, "Trop d'essais. Réessaie dans quelques minutes.", main.connexion, main.ConnexionRequest(email="paul@exemple.fr", mot_de_passe=MDP))
          refuse(429, "Trop d'essais. Réessaie dans quelques minutes.", main.connexion, main.ConnexionRequest(email="paul@exemple.fr", mot_de_passe="mauvais-mot-de-passe"))
          bloque = lire("SELECT bloque_jusqua FROM personnes WHERE id = ?", (r2["id"],))[0][0]
          assert bloque > main.iso_utc(main.datetime.now(main.timezone.utc) + main.timedelta(minutes=9))
          # Le blocage de Paul ne gêne pas Julie.
          assert main.connexion(main.ConnexionRequest(email="julie@exemple.fr", mot_de_passe=MDP))["id"] == pid
          ecrire("UPDATE personnes SET bloque_jusqua = '2000-01-01T00:00:00Z' WHERE id = ?", (r2["id"],))
          assert main.connexion(main.ConnexionRequest(email="paul@exemple.fr", mot_de_passe=MDP))["id"] == r2["id"]
          assert lire("SELECT echecs_connexion, bloque_jusqua FROM personnes WHERE id = ?", (r2["id"],)) == [(0, None)]
          # Un succès remet le compteur à zéro.
          refuse(401, GENERIQUE, main.connexion, main.ConnexionRequest(email="paul@exemple.fr", mot_de_passe="mauvais-mot-de-passe"))
          main.connexion(main.ConnexionRequest(email="paul@exemple.fr", mot_de_passe=MDP))
          assert lire("SELECT echecs_connexion FROM personnes WHERE id = ?", (r2["id"],)) == [(0,)]

          # ---------- 7. Personne désactivée
          main.activer_personne(pid, main.PersonneActiveRequest(actif=False), CODE_MATH)
          refuse_statut(401, main.verifier_auth, jeton)
          refuse(403, "Ce compte est désactivé. Contacte l'administrateur.", main.connexion, main.ConnexionRequest(email="julie@exemple.fr", mot_de_passe=MDP))
          refuse(401, GENERIQUE, main.connexion, main.ConnexionRequest(email="julie@exemple.fr", mot_de_passe="mauvais-mot-de-passe"))
          main.activer_personne(pid, main.PersonneActiveRequest(actif=True), CODE_MATH)
          assert main.verifier_auth(jeton) == pid

          # ---------- 8. Expiration d'une session
          ecrire("UPDATE sessions SET expire_le = '2000-01-01T00:00:00Z' WHERE jeton_hash = ?", (main.empreinte_jeton(c["token"]),))
          refuse_statut(401, main.verifier_auth, c["token"])
          assert main.verifier_auth(jeton) == pid
          main.connexion(main.ConnexionRequest(email="julie@exemple.fr", mot_de_passe=MDP))  # le ménage retire les sessions expirées
          assert lire("SELECT COUNT(*) FROM sessions WHERE jeton_hash = ?", (main.empreinte_jeton(c["token"]),)) == [(0,)]

          # ---------- 9. Déconnexion
          d1 = main.connexion(main.ConnexionRequest(email="julie@exemple.fr", mot_de_passe=MDP))["token"]
          d2 = main.connexion(main.ConnexionRequest(email="julie@exemple.fr", mot_de_passe=MDP))["token"]
          assert main.deconnexion(d1) == {"statut": "success"}
          refuse_statut(401, main.verifier_auth, d1)
          assert main.verifier_auth(d2) == pid, "l'autre appareil reste connecté"
          assert main.deconnexion(CODE_MATH) == {"statut": "success"} and main.verifier_auth(CODE_MATH) == 1
          refuse_statut(401, main.deconnexion, "faux")

          # ---------- 10. Changer son mot de passe
          NOUVEAU = "nouveau-mdp-solide-9"
          refuse(403, "L'ancien mot de passe est incorrect.", main.changer_mot_de_passe, main.ChangerMotDePasseRequest(ancien="pas-le-bon-mdp", nouveau=NOUVEAU, confirmation=NOUVEAU), d2)
          refuse(400, "Les deux mots de passe ne sont pas identiques.", main.changer_mot_de_passe, main.ChangerMotDePasseRequest(ancien=MDP, nouveau=NOUVEAU, confirmation="autre-chose-12"), d2)
          refuse(400, "Le mot de passe doit faire au moins 8 caractères.", main.changer_mot_de_passe, main.ChangerMotDePasseRequest(ancien=MDP, nouveau="court", confirmation="court"), d2)
          refuse(400, "Choisis un mot de passe différent de l'ancien.", main.changer_mot_de_passe, main.ChangerMotDePasseRequest(ancien=MDP, nouveau=MDP, confirmation=MDP), d2)
          refuse(400, "Ton compte se connecte avec un code d'accès : il n'a pas de mot de passe à changer.", main.changer_mot_de_passe, main.ChangerMotDePasseRequest(ancien=MDP, nouveau=NOUVEAU, confirmation=NOUVEAU), ami["code"])
          refuse(400, "Ton compte se connecte avec un code d'accès : il n'a pas de mot de passe à changer.", main.changer_mot_de_passe, main.ChangerMotDePasseRequest(ancien=MDP, nouveau=NOUVEAU, confirmation=NOUVEAU), CODE_MATH)
          refuse_statut(401, main.changer_mot_de_passe, main.ChangerMotDePasseRequest(ancien=MDP, nouveau=NOUVEAU, confirmation=NOUVEAU), "faux")
          autre_appareil = main.connexion(main.ConnexionRequest(email="julie@exemple.fr", mot_de_passe=MDP))["token"]
          assert main.changer_mot_de_passe(main.ChangerMotDePasseRequest(ancien=MDP, nouveau=NOUVEAU, confirmation=NOUVEAU), d2) == {"statut": "success"}
          assert main.verifier_auth(d2) == pid, "l'appareil qui change garde sa session"
          refuse_statut(401, main.verifier_auth, autre_appareil)
          refuse_statut(401, main.verifier_auth, jeton)
          refuse(401, GENERIQUE, main.connexion, main.ConnexionRequest(email="julie@exemple.fr", mot_de_passe=MDP))
          assert main.connexion(main.ConnexionRequest(email="julie@exemple.fr", mot_de_passe=NOUVEAU))["id"] == pid
          assert NOUVEAU not in tout_le_texte()

          # ---------- 11. Réinitialisation par Math
          refuse(403, "Réservé à l'administrateur.", main.reinitialiser_mot_de_passe, pid, ami["code"])
          refuse(403, "Réservé à l'administrateur.", main.reinitialiser_mot_de_passe, pid, d2)
          refuse(400, "Ton accès se règle dans Render (CODE_ACCES), pas ici.", main.reinitialiser_mot_de_passe, 1, CODE_MATH)
          refuse(404, "Personne introuvable.", main.reinitialiser_mot_de_passe, 9999, CODE_MATH)
          refuse(400, "Cette personne se connecte avec un code d'accès : utilise « Nouveau code ».", main.reinitialiser_mot_de_passe, ami["id"], CODE_MATH)
          ecrire("UPDATE personnes SET bloque_jusqua = '2999-01-01T00:00:00Z', echecs_connexion = 3 WHERE id = ?", (pid,))
          prov = main.reinitialiser_mot_de_passe(pid, CODE_MATH)["mot_de_passe_provisoire"]
          assert re.fullmatch("[a-z2-9]{4}(-[a-z2-9]{4}){2}", prov) and prov not in tout_le_texte()
          refuse_statut(401, main.verifier_auth, d2)
          refuse(401, GENERIQUE, main.connexion, main.ConnexionRequest(email="julie@exemple.fr", mot_de_passe=NOUVEAU))
          ap = main.connexion(main.ConnexionRequest(email="julie@exemple.fr", mot_de_passe=prov))
          assert ap["mot_de_passe_provisoire"] is True, "le débloquage est inclus"
          refuse(400, "Ce mot de passe est trop facile à deviner. Choisis-en un autre.", main.changer_mot_de_passe, main.ChangerMotDePasseRequest(ancien=prov, nouveau="password1", confirmation="password1"), ap["token"])
          main.changer_mot_de_passe(main.ChangerMotDePasseRequest(ancien=prov, nouveau=MDP, confirmation=MDP), ap["token"])
          assert main.connexion(main.ConnexionRequest(email="julie@exemple.fr", mot_de_passe=MDP))["mot_de_passe_provisoire"] is False

          # ---------- 12. Liste des personnes et codes d'accès
          liste = {x["id"]: x for x in main.lister_personnes(CODE_MATH)}
          assert liste[pid]["email"] == "julie@exemple.fr" and liste[pid]["a_un_mot_de_passe"] and not liste[pid]["a_un_code"]
          assert liste[ami["id"]]["a_un_code"] and not liste[ami["id"]]["a_un_mot_de_passe"]
          assert all("mot_de_passe" not in x and "code_hash" not in x for x in liste.values())
          c = db.connect()
          cur = c.cursor()
          try:
              main.definir_code_personne(cur, ami["id"], "ses_un-faux-jeton")
              raise AssertionError("un code qui ressemble à un jeton doit être refusé")
          except ValueError as e:
              assert str(e) == "Ce code est réservé."
          finally:
              c.close()

          # ---------- 13. Supprimer une personne nettoie ses sessions et libère son e-mail
          tok = main.connexion(main.ConnexionRequest(email="julie@exemple.fr", mot_de_passe=MDP))["token"]
          main.supprimer_personne(pid, CODE_MATH)
          refuse_statut(401, main.verifier_auth, tok)
          assert lire("SELECT COUNT(*) FROM sessions WHERE personne_id = ?", (pid,)) == [(0,)]
          assert {x["id"]: x["utilisee_par"] for x in main.lister_invitations(CODE_MATH)}[inv["id"]] is None
          refuse(401, GENERIQUE, main.connexion, main.ConnexionRequest(email="julie@exemple.fr", mot_de_passe=MDP))
          nouvelle = invitation()
          rr = main.inscription(formulaire(nouvelle["code"]))
          assert rr["id"] != pid and main.verifier_auth(rr["token"]) == rr["id"]
          assert [v["id"] for v in main.obtenir_velos(rr["token"])] == [rr["velo_id"]], "la nouvelle Julie n'hérite de rien"

          print("OK: inscription sur invitation, connexion, sessions, mot de passe (" + ("PostgreSQL" if db.USE_PG else "SQLite") + ").")
          PY
          rm -f "$SQLITE_PATH"
          PYTHONPATH="$PWD" python "$RUNNER_TEMP/test_inscription.py"
          python - <<'PY2'
          import psycopg
          with psycopg.connect("postgresql://postgres:postgres@localhost:5432/maillons_test", autocommit=True) as c:
              c.execute("DROP DATABASE IF EXISTS maillons_inscription")
              c.execute("CREATE DATABASE maillons_inscription")
          PY2
          DATABASE_URL=postgresql://postgres:postgres@localhost:5432/maillons_inscription PYTHONPATH="$PWD" python "$RUNNER_TEMP/test_inscription.py"
      - name: Vérifier de bout en bout par le vrai serveur web (Math crée Julie, qui entre avec son code ; SQLite puis PostgreSQL)
        env:
          SQLITE_PATH: ${{ runner.temp }}/maillons-http-test.db
          CODE_ACCES: test
        run: |
          pip install httpx
          cat > "$RUNNER_TEMP/test_http.py" <<'PY'
          import os

          import db
          import main
          from fastapi.testclient import TestClient

          # Vrai serveur web (en mémoire), vrais en-têtes : rien n'est remplacé dans le code d'accès.
          CODE_MATH = "code-math-de-bout-en-bout"
          main.CODE_ACCES = CODE_MATH
          os.environ["CODE_ACCES"] = CODE_MATH


          def h(code):
              return {"x-code-acces": code}


          def sql(requete, p=()):
              c = db.connect()
              cur = c.cursor()
              cur.execute(requete, p)
              c.commit()
              c.close()


          with TestClient(main.app) as client:
              sql("UPDATE velos SET nom = 'VELO-SECRET-DE-MATH' WHERE id = 1")

              # Sans code, avec un mauvais code : refusé.
              assert client.get("/api/velos").status_code == 401
              assert client.get("/api/velos", headers=h("faux")).status_code == 401

              # Math : administrateur, voit son vélo.
              assert client.get("/api/moi", headers=h(CODE_MATH)).json() == {"id": 1, "nom": "Math", "est_admin": True}
              assert 1 in [v["id"] for v in client.get("/api/velos", headers=h(CODE_MATH)).json()]

              # Un nom vide est refusé avant tout (422), un nom correct crée la personne.
              assert client.post("/api/personnes", json={"nom": ""}, headers=h(CODE_MATH)).status_code == 422
              r = client.post("/api/personnes", json={"nom": "Julie", "type_velo": "gravel"}, headers=h(CODE_MATH))
              assert r.status_code == 200, r.text
              julie = r.json()
              code_j = julie["code"]
              assert client.post("/api/personnes", json={"nom": "julie"}, headers=h(CODE_MATH)).status_code == 409
              assert [p["nom"] for p in client.get("/api/personnes", headers=h(CODE_MATH)).json()] == ["Math", "Julie"]

              # Julie entre avec son code : elle voit son vélo, et lui seulement.
              assert client.get("/api/moi", headers=h(code_j)).json() == {"id": julie["id"], "nom": "Julie", "est_admin": False}
              vj = client.get("/api/velos", headers=h(code_j)).json()
              assert [v["id"] for v in vj] == [julie["velo_id"]], vj
              assert client.get("/api/etat?velo_id=%d" % julie["velo_id"], headers=h(code_j)).status_code == 200
              for chemin in ("/api/etat", "/api/sorties", "/api/historique"):
                  assert client.get(chemin + "?velo_id=1", headers=h(code_j)).status_code == 404, chemin
              assert "VELO-SECRET-DE-MATH" not in client.get("/api/sauvegarde", headers=h(code_j)).text
              assert "VELO-SECRET-DE-MATH" in client.get("/api/sauvegarde", headers=h(CODE_MATH)).text

              # Julie ne peut rien administrer, ni supprimer son dernier vélo.
              assert client.get("/api/personnes", headers=h(code_j)).status_code == 403
              assert client.post("/api/personnes", json={"nom": "Intrus"}, headers=h(code_j)).status_code == 403
              assert client.post("/api/personnes/1/nouveau-code", headers=h(code_j)).status_code == 403
              assert client.post("/api/personnes/%d/actif" % julie["id"], json={"actif": False}, headers=h(code_j)).status_code == 403
              assert client.post("/api/velos/%d/supprimer" % julie["velo_id"], headers=h(code_j)).status_code == 400

              # Julie crée un deuxième vélo à elle ; Math ne le voit pas dans sa liste.
              r = client.post("/api/velos", json={"nom": "Route de Julie", "type": "route"}, headers=h(code_j))
              assert r.status_code == 200, r.text
              assert r.json()["velo_id"] not in [v["id"] for v in client.get("/api/velos", headers=h(CODE_MATH)).json()]
              assert len(client.get("/api/velos", headers=h(code_j)).json()) == 2

              # Nouveau code : l'ancien ne marche plus. Désactivation : plus rien ne marche. Réactivation : ça remarche.
              nouveau = client.post("/api/personnes/%d/nouveau-code" % julie["id"], headers=h(CODE_MATH)).json()["code"]
              assert client.get("/api/velos", headers=h(code_j)).status_code == 401
              assert client.get("/api/velos", headers=h(nouveau)).status_code == 200
              assert client.post("/api/personnes/%d/actif" % julie["id"], json={"actif": False}, headers=h(CODE_MATH)).status_code == 200
              assert client.get("/api/velos", headers=h(nouveau)).status_code == 401
              assert client.post("/api/personnes/%d/actif" % julie["id"], json={"actif": True}, headers=h(CODE_MATH)).status_code == 200
              assert len(client.get("/api/velos", headers=h(nouveau)).json()) == 2, "les vélos de Julie sont gardés"

              # Suppression d'une personne : réservée à Math ; tout ce qui est à Julie disparaît, Math garde tout.
              id_j = julie["id"]
              vel_j = [v["id"] for v in client.get("/api/velos", headers=h(nouveau)).json()]
              assert client.post("/api/personnes/%d/supprimer" % id_j, headers=h(nouveau)).status_code == 403
              assert client.post("/api/personnes/%d/supprimer" % id_j).status_code == 401
              assert client.post("/api/personnes/1/supprimer", headers=h(CODE_MATH)).status_code == 400
              assert client.post("/api/personnes/9999/supprimer", headers=h(CODE_MATH)).status_code == 404
              assert len(client.get("/api/velos", headers=h(nouveau)).json()) == 2, "les refus n'effacent rien"
              r = client.post("/api/personnes/%d/supprimer" % id_j, headers=h(CODE_MATH))
              assert r.status_code == 200 and r.json()["velos_effaces"] == 2 and r.json()["nom"] == "Julie", r.text
              assert client.get("/api/velos", headers=h(nouveau)).status_code == 401
              assert [p["nom"] for p in client.get("/api/personnes", headers=h(CODE_MATH)).json()] == ["Math"]
              assert not set(vel_j) & {v["id"] for v in client.get("/api/velos", headers=h(CODE_MATH)).json()}
              assert client.post("/api/personnes/%d/supprimer" % id_j, headers=h(CODE_MATH)).status_code == 404
              r = client.post("/api/personnes", json={"nom": "Julie"}, headers=h(CODE_MATH))
              assert r.status_code == 200, "le prénom est de nouveau libre"
              nouvelle = r.json()

              # Renommer : réservé à Math ; seul le nom change.
              rn = "/api/personnes/%d/renommer" % nouvelle["id"]
              assert client.post(rn, json={"nom": "Julie Martin"}, headers=h(nouvelle["code"])).status_code == 403
              assert client.post(rn, json={"nom": "Julie Martin"}).status_code == 401
              assert client.post(rn, json={"nom": ""}, headers=h(CODE_MATH)).status_code == 422
              assert client.post(rn, json={"nom": "math"}, headers=h(CODE_MATH)).status_code == 409
              assert client.post("/api/personnes/9999/renommer", json={"nom": "Zoé"}, headers=h(CODE_MATH)).status_code == 404
              r = client.post(rn, json={"nom": "  Julie   Martin "}, headers=h(CODE_MATH))
              assert r.status_code == 200 and r.json()["nom"] == "Julie Martin", r.text
              assert [p["nom"] for p in client.get("/api/personnes", headers=h(CODE_MATH)).json()] == ["Math", "Julie Martin"]
              assert client.get("/api/moi", headers=h(nouvelle["code"])).json()["nom"] == "Julie Martin"
              assert len(client.get("/api/velos", headers=h(nouvelle["code"])).json()) == 1, "son code et son vélo sont intacts"

              # Math n'est pas touché par tout cela.
              assert client.get("/api/etat?velo_id=1", headers=h(CODE_MATH)).status_code == 200
              assert client.post("/api/personnes/1/actif", json={"actif": False}, headers=h(CODE_MATH)).status_code == 400
              assert client.get("/api/velos", headers=h(CODE_MATH)).status_code == 200

          print("OK: de bout en bout par le vrai serveur web (" + ("PostgreSQL" if db.USE_PG else "SQLite") + ") : création de Julie, ses accès, ses limites, nouveau code, désactivation, suppression, renommage.")
          PY
          rm -f "$SQLITE_PATH"
          PYTHONPATH="$PWD" python "$RUNNER_TEMP/test_http.py"
          python - <<'PY2'
          import psycopg
          with psycopg.connect("postgresql://postgres:postgres@localhost:5432/maillons_test", autocommit=True) as c:
              c.execute("DROP DATABASE IF EXISTS maillons_http")
              c.execute("CREATE DATABASE maillons_http")
          PY2
          DATABASE_URL=postgresql://postgres:postgres@localhost:5432/maillons_http PYTHONPATH="$PWD" python "$RUNNER_TEMP/test_http.py"
      - name: Vérifier de bout en bout l'inscription, la connexion et la déconnexion par le vrai serveur web (SQLite puis PostgreSQL)
        env:
          SQLITE_PATH: ${{ runner.temp }}/maillons-http-inscription-test.db
          CODE_ACCES: test
        run: |
          pip install httpx
          cat > "$RUNNER_TEMP/test_http_inscription.py" <<'PY'
          import os

          import db
          import main
          from fastapi.testclient import TestClient

          # Vrai serveur web (en mémoire), vrais en-têtes, vraies erreurs HTTP.
          main.time.sleep = lambda secondes: None
          CODE_MATH = "code-math-inscription-http"
          main.CODE_ACCES = CODE_MATH
          os.environ["CODE_ACCES"] = CODE_MATH
          MDP = "velo-de-julie-2026"


          def h(code):
              return {"x-code-acces": code}


          def sql(requete, p=()):
              c = db.connect()
              cur = c.cursor()
              cur.execute(requete, p)
              c.commit()
              c.close()


          def formulaire(code, **autres):
              d = {"code_invitation": code, "nom": "Julie", "email": "Julie@Exemple.fr", "mot_de_passe": MDP, "confirmation": MDP,
                   "type_velo": "gravel", "nom_velo": "Mon gravel", "date_achat": "2024-05-17"}
              d.update(autres)
              return d


          with TestClient(main.app) as client:
              sql("UPDATE velos SET nom = 'VELO-SECRET-DE-MATH' WHERE id = 1")

              # La page d'accueil (publique) propose bien l'inscription et la connexion.
              page = client.get("/")
              assert page.status_code == 200 and "authPanneauInscription" in page.text and "authPanneauConnexion" in page.text

              # Les invitations sont réservées à Math.
              assert client.post("/api/invitations", json={"pour": "Julie"}).status_code == 401
              assert client.post("/api/invitations", json={"pour": "Julie"}, headers=h("faux")).status_code == 401
              ami = client.post("/api/personnes", json={"nom": "Ami"}, headers=h(CODE_MATH)).json()
              assert client.post("/api/invitations", json={"pour": "Julie"}, headers=h(ami["code"])).status_code == 403
              assert client.get("/api/invitations", headers=h(ami["code"])).status_code == 403
              r = client.post("/api/invitations", json={"pour": "Julie"}, headers=h(CODE_MATH))
              assert r.status_code == 200, r.text
              inv = r.json()
              assert [x["etat"] for x in client.get("/api/invitations", headers=h(CODE_MATH)).json()] == ["en_attente"]

              # L'inscription est publique (aucun en-tête) mais exige l'invitation.
              assert client.post("/api/inscription", json={"nom": "Julie"}).status_code == 422
              r = client.post("/api/inscription", json=formulaire("zzzz-zzzz-zzzz-zzzz"))
              assert r.status_code == 403 and r.json()["detail"] == "Code d'invitation invalide ou expiré."
              assert client.post("/api/inscription", json=formulaire(inv["code"], confirmation="autre-chose-123")).status_code == 400
              assert client.post("/api/inscription", json=formulaire(inv["code"], email="pas-un-mail")).status_code == 400
              r = client.post("/api/inscription", json=formulaire(inv["code"]))
              assert r.status_code == 200, r.text
              julie = r.json()
              jeton = julie["token"]
              assert jeton.startswith("ses_") and julie["nom"] == "Julie"
              assert client.post("/api/inscription", json=formulaire(inv["code"], nom="Autre", email="autre@exemple.fr")).status_code == 403, "invitation à usage unique"
              assert client.post("/api/inscription", json=formulaire(client.post("/api/invitations", json={}, headers=h(CODE_MATH)).json()["code"])).status_code == 409, "e-mail déjà pris"

              # Avec son jeton, Julie voit ce qui est à elle, et seulement cela.
              assert client.get("/api/moi", headers=h(jeton)).json() == {"id": julie["id"], "nom": "Julie", "est_admin": False}
              vj = client.get("/api/velos", headers=h(jeton)).json()
              assert [v["id"] for v in vj] == [julie["velo_id"]] and vj[0]["nom"] == "Mon gravel", vj
              assert client.get("/api/etat?velo_id=%d" % julie["velo_id"], headers=h(jeton)).status_code == 200
              for chemin in ("/api/etat", "/api/sorties", "/api/historique"):
                  assert client.get(chemin + "?velo_id=1", headers=h(jeton)).status_code == 404, chemin
              assert "VELO-SECRET-DE-MATH" not in client.get("/api/sauvegarde", headers=h(jeton)).text
              for reponse in (client.get("/api/personnes", headers=h(jeton)), client.get("/api/invitations", headers=h(jeton)),
                              client.post("/api/invitations", json={}, headers=h(jeton)),
                              client.post("/api/personnes/1/reinitialiser-mot-de-passe", headers=h(jeton))):
                  assert reponse.status_code == 403
              # Le jeton n'est pas un code d'accès : on ne peut pas s'en servir pour en fabriquer un, ni le deviner.
              assert client.get("/api/velos", headers=h("ses_" + "a" * 43)).status_code == 401
              assert client.get("/api/velos", headers=h(jeton[:-1])).status_code == 401

              # Connexion par e-mail : mauvais mot de passe, e-mail inconnu, puis le bon (autre appareil = autre jeton).
              assert client.post("/api/connexion", json={"email": "julie@exemple.fr", "mot_de_passe": "mauvais-mot-de-passe"}).status_code == 401
              assert client.post("/api/connexion", json={"email": "inconnu@exemple.fr", "mot_de_passe": MDP}).status_code == 401
              r = client.post("/api/connexion", json={"email": "  JULIE@exemple.fr ", "mot_de_passe": MDP})
              assert r.status_code == 200, r.text
              jeton2 = r.json()["token"]
              assert jeton2 != jeton and r.json()["mot_de_passe_provisoire"] is False and r.json()["est_admin"] is False
              assert client.get("/api/velos", headers=h(jeton2)).status_code == 200 and client.get("/api/velos", headers=h(jeton)).status_code == 200

              # Blocage après 5 mauvais essais (même le bon mot de passe est alors refusé), sans gêner les autres.
              for _ in range(5):
                  assert client.post("/api/connexion", json={"email": "julie@exemple.fr", "mot_de_passe": "mauvais-mot-de-passe"}).status_code == 401
              assert client.post("/api/connexion", json={"email": "julie@exemple.fr", "mot_de_passe": MDP}).status_code == 429
              assert client.get("/api/velos", headers=h(jeton)).status_code == 200, "une session déjà ouverte n'est pas coupée"
              assert client.get("/api/velos", headers=h(CODE_MATH)).status_code == 200 and client.get("/api/velos", headers=h(ami["code"])).status_code == 200
              sql("UPDATE personnes SET bloque_jusqua = NULL, echecs_connexion = 0 WHERE id = ?", (julie["id"],))

              # Déconnexion d'un appareil : l'autre reste ouvert.
              assert client.post("/api/deconnexion", headers=h(jeton2)).json() == {"statut": "success"}
              assert client.get("/api/velos", headers=h(jeton2)).status_code == 401 and client.get("/api/velos", headers=h(jeton)).status_code == 200
              assert client.post("/api/deconnexion").status_code == 401

              # Changer son mot de passe : l'autre appareil est déconnecté, l'ancien mot de passe ne marche plus.
              r = client.post("/api/connexion", json={"email": "julie@exemple.fr", "mot_de_passe": MDP})
              jeton3 = r.json()["token"]
              nouveau = "nouveau-solide-9876"
              assert client.post("/api/mot-de-passe", json={"ancien": "pas-le-bon", "nouveau": nouveau, "confirmation": nouveau}, headers=h(jeton3)).status_code == 403
              assert client.post("/api/mot-de-passe", json={"ancien": MDP, "nouveau": nouveau, "confirmation": nouveau}, headers=h(jeton3)).status_code == 200
              assert client.get("/api/velos", headers=h(jeton3)).status_code == 200 and client.get("/api/velos", headers=h(jeton)).status_code == 401
              assert client.post("/api/connexion", json={"email": "julie@exemple.fr", "mot_de_passe": MDP}).status_code == 401
              assert client.post("/api/connexion", json={"email": "julie@exemple.fr", "mot_de_passe": nouveau}).status_code == 200

              # Math voit l'e-mail dans la liste, annule une invitation, et donne un mot de passe provisoire.
              liste = {p["id"]: p for p in client.get("/api/personnes", headers=h(CODE_MATH)).json()}
              assert liste[julie["id"]]["email"] == "julie@exemple.fr" and liste[julie["id"]]["a_un_mot_de_passe"] is True
              assert "mot_de_passe" not in liste[julie["id"]] and "code_hash" not in liste[julie["id"]]
              attente = client.post("/api/invitations", json={"pour": "Paul"}, headers=h(CODE_MATH)).json()
              assert client.post("/api/invitations/%d/annuler" % attente["id"], headers=h(CODE_MATH)).status_code == 200
              assert client.post("/api/inscription", json=formulaire(attente["code"], nom="Paul", email="paul@exemple.fr")).status_code == 403
              assert client.post("/api/invitations/%d/annuler" % inv["id"], headers=h(CODE_MATH)).status_code == 400, "déjà utilisée"
              r = client.post("/api/personnes/%d/reinitialiser-mot-de-passe" % julie["id"], headers=h(CODE_MATH))
              assert r.status_code == 200, r.text
              provisoire = r.json()["mot_de_passe_provisoire"]
              assert client.get("/api/velos", headers=h(jeton3)).status_code == 401, "ses appareils sont déconnectés"
              r = client.post("/api/connexion", json={"email": "julie@exemple.fr", "mot_de_passe": provisoire})
              assert r.status_code == 200 and r.json()["mot_de_passe_provisoire"] is True
              assert client.post("/api/personnes/1/reinitialiser-mot-de-passe", headers=h(CODE_MATH)).status_code == 400
              assert client.post("/api/personnes/%d/reinitialiser-mot-de-passe" % ami["id"], headers=h(CODE_MATH)).status_code == 400, "l'ami se connecte par code"

              # Désactivée : le jeton ne marche plus ; supprimée : tout disparaît et l'e-mail est de nouveau libre.
              jeton4 = r.json()["token"]
              assert client.post("/api/personnes/%d/actif" % julie["id"], json={"actif": False}, headers=h(CODE_MATH)).status_code == 200
              assert client.get("/api/velos", headers=h(jeton4)).status_code == 401
              assert client.post("/api/connexion", json={"email": "julie@exemple.fr", "mot_de_passe": provisoire}).status_code == 403
              assert client.post("/api/personnes/%d/actif" % julie["id"], json={"actif": True}, headers=h(CODE_MATH)).status_code == 200
              assert client.get("/api/velos", headers=h(jeton4)).status_code == 200
              assert client.post("/api/personnes/%d/supprimer" % julie["id"], headers=h(CODE_MATH)).status_code == 200
              assert client.get("/api/velos", headers=h(jeton4)).status_code == 401
              assert client.post("/api/connexion", json={"email": "julie@exemple.fr", "mot_de_passe": provisoire}).status_code == 401
              neuve = client.post("/api/invitations", json={"pour": "Julie"}, headers=h(CODE_MATH)).json()
              r = client.post("/api/inscription", json=formulaire(neuve["code"]))
              assert r.status_code == 200 and r.json()["id"] != julie["id"], "l'e-mail est de nouveau libre"
              assert len(client.get("/api/velos", headers=h(r.json()["token"])).json()) == 1, "la nouvelle Julie n'hérite de rien"

              # Math et l'ami n'ont jamais été gênés : leurs codes marchent comme avant.
              assert client.get("/api/moi", headers=h(CODE_MATH)).json() == {"id": 1, "nom": "Math", "est_admin": True}
              assert client.get("/api/etat?velo_id=1", headers=h(CODE_MATH)).status_code == 200
              assert client.get("/api/moi", headers=h(ami["code"])).json()["nom"] == "Ami"
              assert client.post("/api/connexion", json={"email": "math@exemple.fr", "mot_de_passe": CODE_MATH}).status_code == 401

          print("OK: inscription sur invitation, connexion, déconnexion, mot de passe et administration de bout en bout (" + ("PostgreSQL" if db.USE_PG else "SQLite") + ").")
          PY
          rm -f "$SQLITE_PATH"
          PYTHONPATH="$PWD" python "$RUNNER_TEMP/test_http_inscription.py"
          python - <<'PY2'
          import psycopg
          with psycopg.connect("postgresql://postgres:postgres@localhost:5432/maillons_test", autocommit=True) as c:
              c.execute("DROP DATABASE IF EXISTS maillons_http_inscription")
              c.execute("CREATE DATABASE maillons_http_inscription")
          PY2
          DATABASE_URL=postgresql://postgres:postgres@localhost:5432/maillons_http_inscription PYTHONPATH="$PWD" python "$RUNNER_TEMP/test_http_inscription.py"
      - name: Vérifier la mise à niveau d'une base en ligne faite par l'ancien code (SQLite puis PostgreSQL)
        env:
          SQLITE_PATH: ${{ runner.temp }}/maillons-niveau-test.db
          CODE_ACCES: test
        run: |
          # L'« ancien » code est figé : la version en ligne avant la fusion de l'inscription sur invitation.
          git fetch --depth=1 origin 14353c97e62eb0db9bfa566d872e3be929c8b391
          mkdir -p "$RUNNER_TEMP/ancien"
          git show FETCH_HEAD:main.py > "$RUNNER_TEMP/ancien/main.py"
          cp db.py gpx_import.py "$RUNNER_TEMP/ancien/"
          cat > "$RUNNER_TEMP/test_mise_a_niveau.py" <<'PY'
          import json
          import os
          import sys

          import db
          import main
          from fastapi import HTTPException

          phase, fichier = sys.argv[1], sys.argv[2]
          CODE_MATH = "code-de-math-mise-a-niveau"
          main.CODE_ACCES = CODE_MATH
          os.environ["CODE_ACCES"] = CODE_MATH
          TABLES = ("personnes", "velos", "composants", "historique")


          def lire(sql, p=()):
              c = db.connect()
              cur = c.cursor()
              cur.execute(sql, p)
              r = [tuple(x) for x in cur.fetchall()]
              c.close()
              return r


          def ecrire(sql, p=()):
              c = db.connect()
              cur = c.cursor()
              cur.execute(sql, p)
              c.commit()
              c.close()


          def compter():
              return {t: lire("SELECT COUNT(*) FROM " + t)[0][0] for t in TABLES}


          if phase == "ancien":
              # La base telle qu'elle est en ligne aujourd'hui : l'ancien code, ses personnes, ses vélos.
              ami = main.ajouter_personne(main.NouvellePersonneRequest(nom="Ami", type_velo="gravel"), CODE_MATH)
              ecrire("UPDATE velos SET nom = 'VELO-ANCIEN-DE-MATH' WHERE id = 1")
              assert lire("SELECT COUNT(*) FROM composants")[0][0] > 0
              anciennes = {x[0] for x in lire("SELECT name FROM sqlite_master WHERE type = 'table'")} if not db.USE_PG else set()
              assert "sessions" not in anciennes and "invitations" not in anciennes, "l'ancienne base ne connaît pas les sessions"
              with open(fichier, "w", encoding="utf-8") as f:
                  json.dump({"ami": ami, "compte": compter()}, f)
              print("OK: ancienne base préparée (" + ("PostgreSQL" if db.USE_PG else "SQLite") + ") : " + json.dumps(compter()))
          else:
              # Le nouveau code démarre (init_db a tourné à l'import) sur la base de l'ancien.
              avant = json.load(open(fichier, encoding="utf-8"))
              ami = avant["ami"]
              assert compter() == avant["compte"], (compter(), avant["compte"])
              assert lire("SELECT nom FROM velos WHERE id = 1") == [("VELO-ANCIEN-DE-MATH",)]
              ligne = lire("SELECT mot_de_passe, mdp_provisoire, echecs_connexion, bloque_jusqua, email FROM personnes WHERE id = ?", (ami["id"],))[0]
              assert ligne[0] is None and ligne[1] in (0, None) and ligne[2] in (0, None) and ligne[3] is None, ligne
              assert lire("SELECT COUNT(*) FROM sessions")[0][0] == 0 and lire("SELECT COUNT(*) FROM invitations")[0][0] == 0
              # Les anciens accès marchent comme avant.
              assert main.verifier_auth(CODE_MATH) == 1
              assert main.verifier_auth(ami["code"]) == ami["id"]
              assert [v["id"] for v in main.obtenir_velos(ami["code"])] == [ami["velo_id"]]
              assert 1 in [v["id"] for v in main.obtenir_velos(CODE_MATH)]
              try:
                  main.controle_acces(ami["code"], 1)
                  raise AssertionError("l'ami ne doit pas voir le vélo de Math")
              except HTTPException as e:
                  assert e.status_code == 404
              liste = {x["id"]: x for x in main.lister_personnes(CODE_MATH)}
              assert liste[ami["id"]]["a_un_code"] and not liste[ami["id"]]["a_un_mot_de_passe"] and liste[ami["id"]]["nb_velos"] == 1
              # Une personne ancienne ne peut pas se connecter par e-mail (elle n'a pas de mot de passe).
              try:
                  main.connexion(main.ConnexionRequest(email="ami@exemple.fr", mot_de_passe="n-importe-quoi-123"))
                  raise AssertionError("pas de connexion par e-mail sans mot de passe")
              except HTTPException as e:
                  assert e.status_code == 401
              # Le nouveau parcours marche sur cette base mise à niveau.
              main.time.sleep = lambda s: None
              inv = main.creer_invitation(main.NouvelleInvitationRequest(pour="Julie"), CODE_MATH)
              r = main.inscription(main.InscriptionRequest(code_invitation=inv["code"], nom="Julie", email="julie@exemple.fr",
                                                           mot_de_passe="velo-de-julie-2026", confirmation="velo-de-julie-2026", type_velo="route"))
              assert main.verifier_auth(r["token"]) == r["id"] and r["id"] not in (1, ami["id"])
              assert [v["id"] for v in main.obtenir_velos(r["token"])] == [r["velo_id"]]
              # Un second démarrage (redéploiement) ne change rien et ne perd rien.
              main.init_db()
              main.init_db()
              assert compter() == {"personnes": avant["compte"]["personnes"] + 1, "velos": avant["compte"]["velos"] + 1,
                                   "composants": compter()["composants"], "historique": avant["compte"]["historique"]}
              assert main.verifier_auth(r["token"]) == r["id"] and main.verifier_auth(ami["code"]) == ami["id"]
              print("OK: mise à niveau de la base en ligne vers les comptes e-mail (" + ("PostgreSQL" if db.USE_PG else "SQLite") + ").")
          PY
          rm -f "$SQLITE_PATH"
          PYTHONPATH="$RUNNER_TEMP/ancien" python "$RUNNER_TEMP/test_mise_a_niveau.py" ancien "$RUNNER_TEMP/etat-sqlite.json"
          PYTHONPATH="$PWD" python "$RUNNER_TEMP/test_mise_a_niveau.py" nouveau "$RUNNER_TEMP/etat-sqlite.json"
          python - <<'PY2'
          import psycopg
          with psycopg.connect("postgresql://postgres:postgres@localhost:5432/maillons_test", autocommit=True) as c:
              c.execute("DROP DATABASE IF EXISTS maillons_niveau")
              c.execute("CREATE DATABASE maillons_niveau")
          PY2
          DATABASE_URL=postgresql://postgres:postgres@localhost:5432/maillons_niveau PYTHONPATH="$RUNNER_TEMP/ancien" python "$RUNNER_TEMP/test_mise_a_niveau.py" ancien "$RUNNER_TEMP/etat-pg.json"
          DATABASE_URL=postgresql://postgres:postgres@localhost:5432/maillons_niveau PYTHONPATH="$PWD" python "$RUNNER_TEMP/test_mise_a_niveau.py" nouveau "$RUNNER_TEMP/etat-pg.json"
      - name: Vérifier l'heure de départ unique par vélo et la mise à niveau de l'ancienne base (SQLite puis PostgreSQL)
        env:
          SQLITE_PATH: ${{ runner.temp }}/maillons-unicite-test.db
          CODE_ACCES: test
        run: |
          cat > "$RUNNER_TEMP/test_unicite.py" <<'PY'
          import os
          import subprocess
          import sys

          import db


          def demarrer():
              # Un vrai démarrage de l'appli (l'import de main lance init_db).
              r = subprocess.run([sys.executable, "-c", "import main"], capture_output=True, text=True)
              if r.returncode != 0:
                  print(r.stderr[-1500:])
                  raise SystemExit("le démarrage de l'appli a échoué")


          def lire(sql, p=()):
              c = db.connect()
              cur = c.cursor()
              cur.execute(sql, p)
              r = [tuple(x) for x in cur.fetchall()]
              c.close()
              return r


          def ecrire(sql, p=()):
              c = db.connect()
              try:
                  cur = c.cursor()
                  cur.execute(sql, p)
                  c.commit()
              except Exception:
                  c.rollback()
                  raise
              finally:
                  c.close()


          def echoue(sql, p=()):
              try:
                  ecrire(sql, p)
              except Exception:
                  return True
              return False


          def regle_unique_sur_debut():
              """Y a-t-il une règle d'unicité sur « debut » seul ?"""
              if db.USE_PG:
                  return lire(
                      "SELECT COUNT(*) FROM pg_index i JOIN pg_attribute a "
                      "ON a.attrelid = i.indrelid AND a.attnum = i.indkey[0] "
                      "WHERE i.indrelid = 'sorties'::regclass AND i.indisunique "
                      "AND i.indnatts = 1 AND a.attname = 'debut'"
                  )[0][0] > 0
              for ligne in lire("PRAGMA index_list(sorties)"):
                  if ligne[2]:
                      colonnes = [c[2] for c in lire('PRAGMA index_info("' + ligne[1] + '")')]
                      if colonnes == ["debut"]:
                          return True
              return False


          def index_par_velo_present():
              if db.USE_PG:
                  return lire("SELECT COUNT(*) FROM pg_indexes WHERE indexname = 'sorties_velo_debut'")[0][0] == 1
              return lire("SELECT COUNT(*) FROM sqlite_master WHERE type = 'index' AND name = 'sorties_velo_debut'")[0][0] == 1


          def colonnes_sorties():
              if db.USE_PG:
                  return [r[0] for r in lire(
                      "SELECT column_name FROM information_schema.columns "
                      "WHERE table_name = 'sorties' ORDER BY ordinal_position")]
              return [r[1] for r in lire("PRAGMA table_info(sorties)")]


          def revenir_a_l_ancienne_regle():
              """Remet la base dans l'état d'avant l'étape 3c : UNIQUE sur « debut » seul."""
              if db.USE_PG:
                  ecrire("DROP INDEX IF EXISTS sorties_velo_debut")
                  # Nom volontairement inhabituel : le code ne doit pas le deviner.
                  ecrire("ALTER TABLE sorties ADD CONSTRAINT regle_debut_unique UNIQUE (debut)")
              else:
                  definition = lire("SELECT sql FROM sqlite_master WHERE type = 'table' AND name = 'sorties'")[0][0]
                  suite = lire("SELECT seq FROM sqlite_sequence WHERE name = 'sorties'")
                  ancien = definition.replace("debut TEXT NOT NULL", "debut TEXT NOT NULL UNIQUE", 1)
                  ancien = ancien.replace("CREATE TABLE sorties", "CREATE TABLE sorties_ancienne", 1)
                  ecrire(ancien)
                  ecrire("INSERT INTO sorties_ancienne SELECT * FROM sorties")
                  ecrire("DROP TABLE sorties")
                  ecrire("ALTER TABLE sorties_ancienne RENAME TO sorties")
                  if suite:
                      ecrire("UPDATE sqlite_sequence SET seq = ? WHERE name = 'sorties'", (suite[0][0],))


          # 1. Base neuve : pas de règle sur « debut » seul, index par vélo présent.
          demarrer()
          assert not regle_unique_sur_debut(), "base neuve : debut ne doit plus être unique à lui seul"
          assert index_par_velo_present(), "base neuve : index (velo_id, debut) absent"

          # 2. De la vie : deux vélos, 5 sorties (dont de grosses données), la dernière supprimée
          #    (le prochain numéro automatique doit rester 6, pas retomber à 5).
          ecrire("INSERT INTO velos (nom, type) VALUES ('Gravel', 'gravel')")
          v2 = lire("SELECT MAX(id) FROM velos")[0][0]
          grosse_trace = "[" + ",".join('[44.%06d,2.%06d,500,%d]' % (i, i, i) for i in range(3000)) + "]"
          for velo, debut, nom in (
              (1, "2030-02-01T08:00:00Z", "Été à Millau"),
              (1, "2030-02-02T08:00:00Z", "Sortie 2"),
              (1, "2030-02-03T08:00:00Z", "Sortie 3"),
              (v2, "2030-02-04T08:00:00Z", "Gravel 1"),
              (v2, "2030-02-05T08:00:00Z", "À supprimer"),
          ):
              ecrire(
                  "INSERT INTO sorties (velo_id, nom, debut, distance_km, denivele_pos, trace, notes, photos, a_verifier) "
                  "VALUES (?, ?, ?, ?, ?, ?, ?, ?, ?)",
                  (velo, nom, debut, 25.5, 400, grosse_trace, "note é à ü", '["photo"]', 0),
              )
          ecrire("DELETE FROM sorties WHERE nom = 'À supprimer'")
          assert [r[0] for r in lire("SELECT id FROM sorties ORDER BY id")] == [1, 2, 3, 4]

          # 3. Retour à l'ancienne règle (comme la base de production avant l'étape 3c).
          revenir_a_l_ancienne_regle()
          assert regle_unique_sur_debut(), "simulation : l'ancienne règle doit être en place"
          assert not index_par_velo_present()
          assert echoue(
              "INSERT INTO sorties (velo_id, nom, debut) VALUES (?, 'doublon', '2030-02-01T08:00:00Z')", (v2,)
          ), "simulation : l'ancienne règle devait bloquer ce doublon"

          avant = lire("SELECT * FROM sorties ORDER BY id")
          colonnes_avant = colonnes_sorties()
          assert len(avant) == 4

          # 4. Mise à niveau : deux démarrages.
          demarrer()
          demarrer()

          assert lire("SELECT * FROM sorties ORDER BY id") == avant, "les lignes ont changé"
          assert colonnes_sorties() == colonnes_avant, "les colonnes ont changé"
          assert not regle_unique_sur_debut(), "l'ancienne règle devait être retirée"
          assert index_par_velo_present()
          if db.USE_PG:
              reste = lire("SELECT COUNT(*) FROM pg_constraint WHERE conname = 'regle_debut_unique'")[0][0]
              assert reste == 0, "la règle, de nom inhabituel, devait être retirée"

          # 5. Les numéros automatiques ne reculent pas (au moins 6 ; PostgreSQL peut sauter un numéro après un refus).
          ecrire("INSERT INTO sorties (velo_id, nom, debut) VALUES (?, 'nouvelle', '2030-02-09T08:00:00Z')", (1,))
          assert lire("SELECT MAX(id) FROM sorties")[0][0] >= 6, "le numéro automatique a reculé"

          # 6. La même heure de départ sur deux vélos : permise. Sur le même vélo : refusée.
          ecrire("INSERT INTO sorties (velo_id, nom, debut) VALUES (?, 'même heure, autre vélo', '2030-02-01T08:00:00Z')", (v2,))
          assert echoue("INSERT INTO sorties (velo_id, nom, debut) VALUES (?, 'doublon', '2030-02-01T08:00:00Z')", (v2,))
          assert echoue("INSERT INTO sorties (velo_id, nom, debut) VALUES (?, 'doublon', '2030-02-01T08:00:00Z')", (1,))

          # 7. Redémarrage de plus : rien ne bouge.
          apres = lire("SELECT * FROM sorties ORDER BY id")
          demarrer()
          assert lire("SELECT * FROM sorties ORDER BY id") == apres
