      - name: Vérifier le script de migration SQLite sur une base temporaire
        run: |
          python - <<'PY'
          import sqlite3
          from pathlib import Path

          source = Path("main.py").read_text(encoding="utf-8")
          required = [
              "CREATE TABLE IF NOT EXISTS velos",
              '@app.get("/api/velos")',
              '@app.post("/api/velos")',
              'CREATE TABLE IF NOT EXISTS mes_reglages_velo',
              'INSERT INTO mes_reglages_velo',
              'SELECT id, nom, type, marque, modele, annee, taille, actif',
              '@app.get("/api/etat")',
              'WHERE id = ? AND actif = 1',
              'SELECT * FROM composants WHERE velo_id = ? ORDER BY id',
              'FROM sorties',
              'WHERE velo_id = ?',
              'WHERE h.velo_id = ? AND c.velo_id = ?',
              'Vélo introuvable.',
              '@app.get("/api/historique")',
              '@app.post("/api/historique")',
              '@app.post("/api/historique/{historique_id}/supprimer")',
              '@app.post("/api/historique/supprimer-plusieurs")',
              '@app.post("/api/historique/{historique_id}/modifier")',
              'def retirer_intervention(cursor, historique_id, velo_id=1):',
              'WHERE id = ? AND velo_id = ?',
              'SELECT km_total FROM velos WHERE id = ?',
              '@app.get("/api/sorties")',
              'SELECT * FROM sorties WHERE velo_id = ? ORDER BY debut DESC',
              '@app.post("/api/sync")',
              'def synchroniser_kilometrage(',
              'UPDATE velos',
              'WHERE id = ?',
              'velo_id: int = 1',
              'def ajuster_km_total(cursor, delta_km, velo_id=1):',
              '@app.post("/api/sorties/import")',
              # Doublons d'import : heure de départ unique tous vélos confondus (voir les tests réels).
              'SELECT id FROM sorties WHERE debut = ?',
              'debut >= ? AND debut <= ?',
              'INSERT INTO sorties (',
              'SELECT km_maj_le FROM velos WHERE id = ?',
              'def supprimer_sortie(',
              'SELECT distance_km, km_compte FROM sorties WHERE id = ? AND velo_id = ?',
              'DELETE FROM sorties WHERE id = ? AND velo_id = ?',
              'WHERE h.velo_id = ? AND c.velo_id = ?',
              "INSERT INTO velos",
              "legacy_velo_id",
              "UPDATE velos",
              "SET km_total =",
              'ajouter_colonne(cursor, "composants", "velo_id", "INTEGER DEFAULT 1")',
              'ajouter_colonne(cursor, "sorties", "velo_id", "INTEGER DEFAULT 1")',
          ]
          missing = [item for item in required if item not in source]
          assert not missing, f"Instructions de migration introuvables dans main.py: {missing}"

          db = sqlite3.connect(":memory:")
          db.row_factory = sqlite3.Row
          db.executescript("""
              CREATE TABLE velo (
                  id INTEGER PRIMARY KEY,
                  km_total INTEGER NOT NULL DEFAULT 0,
                  date_achat TEXT
              );
              INSERT INTO velo (id, km_total, date_achat)
              VALUES (1, 2700, '2025-11-18');
              CREATE TABLE composants (id INTEGER PRIMARY KEY, nom TEXT);
              INSERT INTO composants (id, nom) VALUES (1, 'Freins');
              CREATE TABLE sorties (id INTEGER PRIMARY KEY, nom TEXT);
              INSERT INTO sorties (id, nom) VALUES (1, 'Sortie test');
          """)
          db.execute("ALTER TABLE velo ADD COLUMN km_maj_le TEXT")
          db.execute("ALTER TABLE velo ADD COLUMN km_frac REAL DEFAULT 0")
          db.execute("UPDATE velo SET km_maj_le = '2026-10-26T14:33:17Z' WHERE km_maj_le IS NULL")
          db.execute("""
              CREATE TABLE IF NOT EXISTS velos (
                  id INTEGER PRIMARY KEY AUTOINCREMENT,
                  nom TEXT,
                  type TEXT,
                  marque TEXT,
                  modele TEXT,
                  annee INTEGER,
                  km_total INTEGER DEFAULT 0,
                  km_frac REAL DEFAULT 0,
                  km_maj_le TEXT,
                  date_achat TEXT,
                  legacy_velo_id INTEGER UNIQUE
              )
          """)
          db.execute("""
              INSERT INTO velos
                (nom, type, marque, modele, annee, km_total, km_frac,
                 km_maj_le, date_achat, legacy_velo_id)
              VALUES ('Mon CUBE', 'electrique', 'Cube',
                      'Stereo Hybrid ONE44 EXC 800 (Bosch)', 2025,
                      2700, 0, NULL, NULL, 1)
              ON CONFLICT (legacy_velo_id) DO NOTHING
          """)
          db.execute("""
              UPDATE velos
              SET km_total=(SELECT km_total FROM velo WHERE id=1),
                  km_frac=(SELECT km_frac FROM velo WHERE id=1),
                  km_maj_le=(SELECT km_maj_le FROM velo WHERE id=1),
                  date_achat=(SELECT date_achat FROM velo WHERE id=1)
              WHERE legacy_velo_id=1
          """)
          db.execute("ALTER TABLE composants ADD COLUMN velo_id INTEGER DEFAULT 1")
          db.execute("ALTER TABLE sorties ADD COLUMN velo_id INTEGER DEFAULT 1")
          db.execute("UPDATE composants SET velo_id=1 WHERE velo_id IS NULL")
          db.execute("UPDATE sorties SET velo_id=1 WHERE velo_id IS NULL")
          # Rejouer l'insertion vérifie que la contrainte évite les doublons.
          db.execute("""
              INSERT INTO velos
                (nom, type, marque, modele, annee, km_total, km_frac,
                 km_maj_le, date_achat, legacy_velo_id)
              VALUES ('Mon CUBE', 'electrique', 'Cube',
                      'Stereo Hybrid ONE44 EXC 800 (Bosch)', 2025,
                      2700, 0, NULL, NULL, 1)
              ON CONFLICT (legacy_velo_id) DO NOTHING
          """)
          bike = db.execute("SELECT * FROM velos WHERE legacy_velo_id=1").fetchone()
          assert bike["km_total"] == 2700, dict(bike)
          assert bike["date_achat"] == "2025-11-18", dict(bike)
          assert db.execute("SELECT COUNT(*) FROM velos").fetchone()[0] == 1
          assert db.execute("SELECT velo_id FROM composants WHERE id=1").fetchone()[0] == 1
          assert db.execute("SELECT velo_id FROM sorties WHERE id=1").fetchone()[0] == 1
          print("OK: syntaxe de main.py, copie du CUBE, conservation des kilomètres, attribution composants/sorties et absence de doublon.")
          PY
      - name: Vérifier les entretiens par type, les fiches et la mise à niveau sans perte d'historique
        env:
          SQLITE_PATH: ${{ runner.temp }}/maillons-entretiens-par-type.db
          DATABASE_URL: ""
          CODE_ACCES: test
        run: |
          python - <<'PY'
          import sqlite3
          from pathlib import Path

          import main
          import db

          main.verifier_auth = lambda _code: None

          types = (
              "vtt_electrique", "vtt", "enduro", "descente",
              "gravel", "gravel_electrique", "route", "route_electrique",
          )
          source = Path("main.py").read_text(encoding="utf-8")
          guides_start = source.index("const GUIDES = {")
          guides_end = source.index("function lienYoutube(nom) {", guides_start)
          guides = source[guides_start:guides_end]

          # Chaque pièce et chaque contrôle proposé par chaque type doit avoir
          # une fiche « Comment faire » associée à son nom exact.
          for type_velo in types:
              entretiens = main.entretiens_du_type(type_velo)
              assert entretiens, f"Aucun entretien pour {type_velo}"
              noms = [item[0] for item in entretiens]
              assert len(noms) == len(set(noms)), f"Noms en double pour {type_velo}"
              for nom in noms:
                  assert '"' + nom + '"' in guides, (
                      f"Fiche « Comment faire » absente pour {type_velo}: {nom}"
                  )

          # Créer un vélo de chaque famille : les vérifications doivent être
          # enregistrées et les pièces électriques réservées aux vélos électriques.
          ids = {}
          for type_velo in types:
              resultat = main.creer_velo(
                  main.NouveauVeloRequest(nom="Test " + type_velo, type=type_velo),
                  x_code_acces="test",
              )
              ids[type_velo] = resultat["velo_id"]
              conn = db.connect()
              cursor = conn.cursor()
              cursor.execute(
                  "SELECT nom, verification FROM composants WHERE velo_id = ?",
                  (ids[type_velo],),
              )
              composants = cursor.fetchall()
              assert composants, f"Aucun composant créé pour {type_velo}"
              assert any(row[1] == 1 for row in composants), (
                  f"Aucun contrôle régulier pour {type_velo}"
              )
              noms = {row[0] for row in composants}
              if type_velo in ("vtt_electrique", "gravel_electrique", "route_electrique"):
                  assert "Batterie (contacts et état)" in noms, type_velo
              else:
                  assert "Batterie (contacts et état)" not in noms, type_velo
              conn.close()

          # Simuler un vélo déjà présent avant cette évolution, avec une
          # intervention liée à une ancienne pièce générique.
          conn = db.connect()
          cursor = conn.cursor()
          cursor.execute("""
              INSERT INTO velos (nom, type, marque, modele, actif, km_total, km_frac)
              VALUES (?, ?, ?, ?, 1, 0, 0)
          """, ("Vélo historique test", "vtt", "Test", "Ancien modèle"))
          cursor.execute("SELECT id FROM velos WHERE nom = ?", ("Vélo historique test",))
          ancien_velo_id = cursor.fetchone()[0]
          cursor.execute("""
              INSERT INTO composants (
                  velo_id, nom, km_depart, seuil_alerte, categorie,
                  pos_x, pos_y, verification, coef_usure
              ) VALUES (?, ?, ?, ?, ?, ?, ?, ?, ?)
          """, (ancien_velo_id, "Frein avant", 1234, 2500, "piece", 50, 50, 0, 1))
          cursor.execute("SELECT id FROM composants WHERE velo_id = ?", (ancien_velo_id,))
          composant_id = cursor.fetchone()[0]
          cursor.execute("""
              INSERT INTO historique (
                  composant_id, velo_id, date_remplacement, cout, notes, km_intervention
              ) VALUES (?, ?, ?, ?, ?, ?)
          """, (composant_id, ancien_velo_id, "2026-10-01", 12, "À conserver", 1234))
          conn.commit()

          main.mettre_a_niveau_velos(cursor)
          conn.commit()

          cursor.execute(
              "SELECT nom, km_depart, seuil_alerte FROM composants WHERE id = ?",
              (composant_id,),
          )
          composant = cursor.fetchone()
          assert tuple(composant) == ("Plaquettes de frein (avant)", 1234, 2500), tuple(composant)
          cursor.execute(
              "SELECT composant_id, velo_id, notes, km_intervention FROM historique WHERE composant_id = ?",
              (composant_id,),
          )
          historique = cursor.fetchone()
          assert tuple(historique) == (composant_id, ancien_velo_id, "À conserver", 1234), tuple(historique)
          cursor.execute(
              "SELECT COUNT(*) FROM composants WHERE velo_id = ? AND verification = 1",
              (ancien_velo_id,),
          )
          assert cursor.fetchone()[0] > 0, "Les vérifications n'ont pas été ajoutées à l'ancien vélo"
          cursor.execute(
              "SELECT valeur FROM reglages WHERE cle = ?",
              (main.marqueur_entretiens_velo(ancien_velo_id),),
          )
          assert cursor.fetchone() is not None, "Le marqueur de migration manque"

          # Une seconde migration ne doit pas créer de doublons.
          cursor.execute("SELECT COUNT(*) FROM composants WHERE velo_id = ?", (ancien_velo_id,))
          avant = cursor.fetchone()[0]
          main.mettre_a_niveau_velos(cursor)
          conn.commit()
          cursor.execute("SELECT COUNT(*) FROM composants WHERE velo_id = ?", (ancien_velo_id,))
          assert cursor.fetchone()[0] == avant, "La migration a créé des doublons au second passage"
          conn.close()

          # Le vélo historique CUBE (id 1) doit rester en dehors de cette migration.
          conn = db.connect()
          cursor = conn.cursor()
          cursor.execute("SELECT valeur FROM reglages WHERE cle = ?", (main.marqueur_entretiens_velo(1),))
          assert cursor.fetchone() is None, "La migration par type a touché le CUBE"
          conn.close()

          print("OK: 8 types, contrôles visibles, fiches complètes, migration d'un vélo existant, historique conservé et seconde migration sans doublon.")
          PY
