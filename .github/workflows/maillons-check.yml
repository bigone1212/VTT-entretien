              carte.locator(".menu-sortie-btn").click(); carte.get_by_text("Modifier ce composant").click(); pg.wait_for_timeout(300)
              assert pg.evaluate("document.getElementById('fenetreComposant').open") and pg.input_value("#champComposantNom") == "Maxxis Minion"
              pg.fill("#champComposantNom", "Schwalbe Nobby Nic 2,6"); pg.click("#boutonEnregistrerComposant"); pg.wait_for_timeout(800)
              chemin, corps = puts[-1]
              assert chemin == "/api/velos/2" and corps["nom"] == "Trek" and corps["modele"] == "Fuel" and corps["date_achat"] == "2025-05-01", puts[-1]
              liste = json.loads(corps["fiche_composants"])
              assert {"categorie": "pneus_avant", "nom": "Schwalbe Nobby Nic 2,6", "validation": "valide_par_utilisateur", "sources": []} in liste and len(liste) == 3, liste
              assert not pg.evaluate("document.getElementById('fenetreComposant').open")
              assert "Schwalbe Nobby Nic 2,6" in pg.locator("#ficheAutreEquipement .ftv-item", has_text="Pneu avant").inner_text()
              pg.close()
              # CUBE : modification gardée à part, retour à la fiche d'origine
              pg = ouvrir(1)
              pg.click("#ficheTechniqueCube summary"); pg.wait_for_timeout(300)
              c = pg.locator("#ficheTechniqueCube .ftv-item[data-cat=pneus_avant]")
              c.locator(".menu-sortie-btn").click()
              assert c.locator("[role=menuitem]").all_inner_texts() == ["Fiche technique", "Chercher à l'achat", "Modifier ce composant"]
              c.get_by_text("Modifier ce composant").click(); pg.fill("#champComposantNom", "DT Swiss XM 481"); pg.click("#boutonEnregistrerComposant"); pg.wait_for_timeout(800)
              assert puts[-1][0] == "/api/velos/1" and json.loads(puts[-1][1]["fiche_composants"])[0]["nom"] == "DT Swiss XM 481"
              c = pg.locator("#ficheTechniqueCube .ftv-item[data-cat=pneus_avant]")
              assert "DT Swiss XM 481" in c.inner_text() and "Modifié par toi" in c.inner_text()
              c.locator(".menu-sortie-btn").click(); c.get_by_text("Revenir à la fiche d'origine").click(); pg.wait_for_timeout(800)
              assert json.loads(puts[-1][1]["fiche_composants"]) == []
              assert "Schwalbe Nobby Nic" in pg.locator("#ficheTechniqueCube .ftv-item[data-cat=pneus_avant]").inner_text()
              pg.close()
              nav.close()
          assert not erreurs, erreurs
          print("OK menu des composants : liens, achat, modification, retour à l'origine")
          PY
          rm -f "$SQLITE_PATH"
          PYTHONPATH="$PWD" python "$RUNNER_TEMP/test_menu_composants.py"
      - name: Tester l'ouverture de l'appli par une autre personne que Math dans un vrai navigateur
        env:
          SQLITE_PATH: ${{ runner.temp }}/maillons-autre-personne-test.db
          CODE_ACCES: test
        run: |
          cat > "$RUNNER_TEMP/test_autre_personne.py" <<'PY'
          import json
          from urllib.parse import urlparse, parse_qs
          from playwright.sync_api import sync_playwright
          import main
          html = main.accueil()
          CODE_AMI = "code-de-lami"
          V_AMI = [{"id": 5, "nom": "Gravel de l'ami", "type": "gravel", "actif": 1, "km_total": 0, "km_frac": 0, "a_photo": 0, "sorties_a_verifier": 0}]
          erreurs, appels = [], []
          NOM = {"valeur": "Julie"}
          with sync_playwright() as p:
              nav = p.chromium.launch()

              def nouveau(code_en_memoire, largeur=390):
                  ctx = nav.new_context(viewport={"width": largeur, "height": 900})

                  def api(r):
                      u = urlparse(r.request.url)
                      q = parse_qs(u.query)
                      appels.append(u.path + ("?velo_id=" + q["velo_id"][0] if "velo_id" in q else ""))
                      if r.request.headers.get("x-code-acces") != CODE_AMI:
                          return r.fulfill(status=401, content_type="application/json", body='{"detail":"Code invalide."}')
                      if u.path == "/api/velos":
                          corps = V_AMI
                      elif u.path == "/api/etat":
                          # Comme le vrai serveur : un vélo qui n'est pas le sien est « introuvable ».
                          if q.get("velo_id", [""])[0] != "5":
                              return r.fulfill(status=404, content_type="application/json", body='{"detail":"Vélo introuvable."}')
                          corps = {"km_total": 0, "composants": []}
                      elif u.path == "/api/moi":
                          corps = {"id": 2, "nom": NOM["valeur"], "est_admin": False}
                      elif u.path == "/api/mes-reglages":
                          corps = {"valeurs": {}, "maj_le": None}
                      elif u.path == "/api/reglages":
                          corps = {"terrain_route": 1, "terrain_mixte": 1.2, "terrain_chemin": 1.5, "terrain_sentier": 2, "poids_denivele": 1}
                      else:
                          corps = []
                      r.fulfill(status=200, content_type="application/json", body=json.dumps(corps))

                  ctx.route("**/localhost/api/**", api)
                  ctx.route(lambda u: not u.startswith("http://localhost/"), lambda r: r.abort())
                  if code_en_memoire:
                      ctx.add_init_script("sessionStorage.setItem('vtt_code', '" + code_en_memoire + "');")
                  pg = ctx.new_page()
                  pg.on("pageerror", lambda e: erreurs.append(str(e)[:200]))
                  pg.route("http://localhost/", lambda r: r.fulfill(status=200, content_type="text/html", body=html))
                  return pg

              # 1) Saisie du code d'une autre personne que Math (le vélo n° 1 n'est pas le sien).
              pg = nouveau(None)
              pg.goto("http://localhost/"); pg.wait_for_timeout(600)
              pg.click("#authLienCode"); pg.fill("#authInput", CODE_AMI); pg.click("#authValiderCode"); pg.wait_for_timeout(1200)
              assert pg.eval_on_selector("#authScreen", "e => getComputedStyle(e).display") == "none", "l'écran du code est resté"
              assert pg.eval_on_selector("#authError", "e => e.textContent.trim()") == ""
              assert pg.eval_on_selector("#headerVeloNom", "e => e.textContent.trim()") == "Gravel de l'ami"
              assert pg.eval_on_selector("#selectVelo", "e => e.value") == "5"
              assert "/api/etat?velo_id=5" in appels, appels
              assert pg.evaluate("sessionStorage.getItem('maillons_velo_id')") == "5"
              # Message de bienvenue avec le nom de la personne, sous le titre.
              assert pg.eval_on_selector("#headerBienvenue", "e => !e.hidden && getComputedStyle(e).display !== 'none'")
              assert pg.eval_on_selector("#headerBienvenue", "e => e.textContent") == "Bienvenue Julie"
              pg.close()

              # 2) Réouverture avec le code déjà en mémoire (et un vélo n° 1 mémorisé par un ancien passage).
              appels.clear()
              pg = nouveau(CODE_AMI)
              pg.add_init_script("sessionStorage.setItem('maillons_velo_id', '1');")
              pg.goto("http://localhost/"); pg.wait_for_timeout(1200)
              assert pg.eval_on_selector("#authScreen", "e => getComputedStyle(e).display") == "none"
              assert pg.eval_on_selector("#headerVeloNom", "e => e.textContent.trim()") == "Gravel de l'ami"
              assert "/api/etat?velo_id=5" in appels, appels
              assert pg.eval_on_selector("#headerBienvenue", "e => e.textContent") == "Bienvenue Julie"
              pg.close()

              # 2b) Nom très long et nom contenant du HTML, sur un petit écran : texte brut, coupé par « … », rien ne déborde.
              NOM["valeur"] = "<b>Marie-Charlotte</b> de la Fontaine-Beauregard"
              pg = nouveau(CODE_AMI, 320)
              pg.goto("http://localhost/"); pg.wait_for_timeout(1200)
              assert pg.eval_on_selector("#headerBienvenue", "e => e.textContent") == "Bienvenue <b>Marie-Charlotte</b> de la Fontaine-Beauregard"
              assert pg.eval_on_selector("#headerBienvenue", "e => e.children.length") == 0, "le nom ne doit jamais être lu comme du HTML"
              assert pg.eval_on_selector("#headerBienvenue", "e => e.scrollWidth > e.clientWidth"), "le nom long doit être coupé"
              assert pg.eval_on_selector("#headerBienvenue", "e => { const s = getComputedStyle(e); return [s.textOverflow, s.overflow, s.whiteSpace].join(' '); }") == "ellipsis hidden nowrap", "coupure par « … » sur une seule ligne"
              assert pg.evaluate("document.documentElement.scrollWidth <= window.innerWidth"), "la page ne doit pas déborder"
              pg.close()
              NOM["valeur"] = "Julie"

              # 3) Mauvais code : refusé.
              pg = nouveau(None)
              pg.goto("http://localhost/"); pg.wait_for_timeout(600)
              pg.click("#authLienCode"); pg.fill("#authInput", "mauvais"); pg.click("#authValiderCode"); pg.wait_for_timeout(800)
              assert pg.eval_on_selector("#authError", "e => e.textContent.trim()") == "Code incorrect."
              assert pg.eval_on_selector("#authScreen", "e => getComputedStyle(e).display") != "none"
              assert pg.eval_on_selector("#headerBienvenue", "e => e.hidden"), "pas de bienvenue sans connexion"
              pg.close()
              nav.close()
          print("erreurs page :", erreurs); assert not erreurs, erreurs
          print("OK: une autre personne que Math entre avec son code et arrive sur son vélo, avec son message de bienvenue")
          PY
          rm -f "$SQLITE_PATH"
          PYTHONPATH="$PWD" python "$RUNNER_TEMP/test_autre_personne.py"
      - name: Tester l'écran Personnes (administration) dans un vrai navigateur
        env:
          SQLITE_PATH: ${{ runner.temp }}/maillons-admin-nav-test.db
          CODE_ACCES: test
        run: |
          cat > "$RUNNER_TEMP/test_admin_navigateur.py" <<'PY'
          import json
          from urllib.parse import urlparse
          from playwright.sync_api import sync_playwright
          import main
          html = main.accueil()
          V = [{"id": 1, "nom": "Mon CUBE", "type": "vtt_electrique", "actif": 1, "km_total": 0, "km_frac": 0, "a_photo": 0, "sorties_a_verifier": 0}]
          erreurs, appels, dialogues = [], [], []
          refuser = {"oui": False}
          reponse = {"texte": None}
          with sync_playwright() as p:
              nav = p.chromium.launch()

              def ouvrir(admin):
                  etat = {"personnes": [{"id": 1, "nom": "Math", "est_admin": True, "actif": True, "a_un_code": True, "nb_velos": 1}], "suivant": 1}
                  ctx = nav.new_context(viewport={"width": 390, "height": 900})

                  def api(r):
                      u = urlparse(r.request.url)
                      m = r.request.method
                      corps = r.request.post_data
                      appels.append((m, u.path, corps))

                      def rep(statut, obj):
                          r.fulfill(status=statut, content_type="application/json", body=json.dumps(obj))
                      if u.path == "/api/velos":
                          return rep(200, V)
                      if u.path == "/api/moi":
                          return rep(200, {"id": 1, "nom": "Math", "est_admin": admin})
                      if u.path == "/api/personnes" and m == "GET":
                          if not admin:
                              return rep(403, {"detail": "Réservé à l'administrateur."})
                          return rep(200, etat["personnes"])
                      if u.path == "/api/personnes" and m == "POST":
                          d = json.loads(corps)
                          if d["nom"].strip().lower() == "math":
                              return rep(409, {"detail": "Une personne porte déjà ce nom."})
                          etat["suivant"] += 1
                          etat["personnes"].append({"id": etat["suivant"], "nom": d["nom"], "est_admin": False, "actif": True, "a_un_code": True, "nb_velos": 1})
                          return rep(200, {"statut": "success", "id": etat["suivant"], "nom": d["nom"], "code": "abcd-efgh-jkmn", "velo_id": 9})
                      if u.path.endswith("/nouveau-code"):
                          return rep(200, {"statut": "success", "id": 2, "code": "wxyz-pqrs-tuvk"})
                      if u.path.endswith("/renommer"):
                          d = json.loads(corps)
                          ident = u.path.split("/")[3]
                          if any(x["nom"].lower() == d["nom"].lower() and str(x["id"]) != ident for x in etat["personnes"]):
                              return rep(409, {"detail": "Une personne porte déjà ce nom."})
                          for x in etat["personnes"]:
                              if str(x["id"]) == ident:
                                  x["nom"] = d["nom"]
                          return rep(200, {"statut": "success", "id": int(ident), "nom": d["nom"]})
                      if u.path.endswith("/supprimer"):
                          ident = u.path.split("/")[3]
                          etat["personnes"] = [x for x in etat["personnes"] if str(x["id"]) != ident]
                          return rep(200, {"statut": "success", "id": 2, "nom": "Julie", "velos_effaces": 1})
                      if u.path.endswith("/actif"):
                          d = json.loads(corps)
                          for x in etat["personnes"]:
                              if str(x["id"]) == u.path.split("/")[3]:
                                  x["actif"] = d["actif"]
                          return rep(200, {"statut": "success", "actif": d["actif"]})
                      if u.path == "/api/etat":
                          return rep(200, {"km_total": 0, "composants": []})
                      if u.path == "/api/mes-reglages":
                          return rep(200, {"valeurs": {}, "maj_le": None})
                      if u.path == "/api/reglages":
                          return rep(200, {"terrain_route": 1, "terrain_mixte": 1.2, "terrain_chemin": 1.5, "terrain_sentier": 2, "poids_denivele": 1})
                      return rep(200, [])

                  ctx.route("**/localhost/api/**", api)
                  ctx.route(lambda u: not u.startswith("http://localhost/"), lambda r: r.abort())
                  ctx.add_init_script("sessionStorage.setItem('vtt_code','m');")
                  pg = ctx.new_page()
                  pg.on("pageerror", lambda e: erreurs.append(str(e)[:200]))
                  def gerer_dialogue(d):
                      dialogues.append(d.message)
                      if d.type == "prompt":
                          d.accept(reponse["texte"]) if reponse["texte"] is not None else d.dismiss()
                      elif refuser["oui"]:
                          d.dismiss()
                      else:
                          d.accept()

                  pg.on("dialog", gerer_dialogue)
                  pg.route("http://localhost/", lambda r: r.fulfill(status=200, content_type="text/html", body=html))
                  pg.goto("http://localhost/#compte"); pg.wait_for_timeout(1200)
                  return pg

              texte = lambda pg, sel: pg.eval_on_selector(sel, "e => e.textContent.trim()")
              visible = lambda pg, sel: pg.eval_on_selector(sel, "e => getComputedStyle(e).display") != "none"

              # 1) Math : le bloc est là, la liste aussi.
              pg = ouvrir(True)
              assert visible(pg, "#blocPersonnes") and visible(pg, "#page-compte")
              assert texte(pg, "#headerBienvenue") == "Bienvenue Math" and visible(pg, "#headerBienvenue")
              assert "Math (administrateur)" in texte(pg, "#listePersonnes") and "1 vélo" in texte(pg, "#listePersonnes")
              assert not visible(pg, "#codeAffiche")
              assert pg.locator("#listePersonnes button").count() == 1 and pg.locator("#listePersonnes button").first.inner_text() == "Renommer", "Math : seulement Renommer"

              # 2) Ajouter Julie : code affiché une fois, liste mise à jour.
              pg.fill("#personneNom", "Julie"); pg.select_option("#personneTypeVelo", "gravel"); pg.click("#formAjouterPersonne button[type=submit]"); pg.wait_for_timeout(600)
              envoi = [a for a in appels if a[0] == "POST" and a[1] == "/api/personnes"][-1]
              assert json.loads(envoi[2]) == {"nom": "Julie", "type_velo": "gravel"}, envoi
              assert visible(pg, "#codeAffiche") and texte(pg, "#codeAfficheValeur") == "abcd-efgh-jkmn" and "Julie" in texte(pg, "#codeAfficheTitre")
              assert "Julie" in texte(pg, "#listePersonnes") and pg.input_value("#personneNom") == ""
              # 3) « J'ai noté le code » : le code disparaît de l'écran.
              pg.click("#boutonCodeNote")
              assert not visible(pg, "#codeAffiche") and texte(pg, "#codeAfficheValeur") == ""
              # 3b) Renommer : fenêtre avec le nom actuel, puis la liste change ; annuler n'envoie rien.
              ligne = lambda: pg.locator("#listePersonnes .personne-ligne").nth(1)
              renommer = lambda: [x for x in appels if x[0] == "POST" and x[1].endswith("/renommer")]
              reponse["texte"] = "  Julie M.  "
              ligne().get_by_text("Renommer").click(); pg.wait_for_timeout(500)
              assert any("Julie" in d and "Nouveau nom" in d for d in dialogues), dialogues
              assert json.loads(renommer()[-1][2]) == {"nom": "Julie M."}, renommer()
              assert "Julie M." in ligne().inner_text() and texte(pg, "#messagePersonnes") == "Nom changé : Julie M.."
              reponse["texte"] = None  # annuler
              ligne().get_by_text("Renommer").click(); pg.wait_for_timeout(400)
              assert len(renommer()) == 1, "annuler : rien ne doit partir"
              reponse["texte"] = "Julie M."  # même nom : rien à envoyer
              ligne().get_by_text("Renommer").click(); pg.wait_for_timeout(400)
              assert len(renommer()) == 1
              reponse["texte"] = "math"  # nom déjà pris : message d'erreur, nom inchangé
              ligne().get_by_text("Renommer").click(); pg.wait_for_timeout(500)
              assert texte(pg, "#messagePersonnes") == "Une personne porte déjà ce nom." and "Julie M." in ligne().inner_text()
              reponse["texte"] = "Julie"  # retour au nom d'origine
              ligne().get_by_text("Renommer").click(); pg.wait_for_timeout(500)
              assert "Julie M." not in ligne().inner_text() and "Julie" in ligne().inner_text()
              # Math peut aussi se renommer (le bouton est sur sa ligne).
              reponse["texte"] = "Mathieu"
              pg.locator("#listePersonnes .personne-ligne").nth(0).get_by_text("Renommer").click(); pg.wait_for_timeout(500)
              assert "Mathieu (administrateur)" in texte(pg, "#listePersonnes")
              assert texte(pg, "#headerBienvenue") == "Bienvenue Mathieu", "le message suit le nouveau nom tout de suite"
              reponse["texte"] = "Math"
              pg.locator("#listePersonnes .personne-ligne").nth(0).get_by_text("Renommer").click(); pg.wait_for_timeout(500)
              assert "Math (administrateur)" in texte(pg, "#listePersonnes") and texte(pg, "#headerBienvenue") == "Bienvenue Math"
              reponse["texte"] = None
              # 4) Nouveau code (avec confirmation).
              pg.locator("#listePersonnes .personne-ligne").nth(1).get_by_text("Nouveau code").click(); pg.wait_for_timeout(500)
              assert any("Julie" in d and "ancien code" in d for d in dialogues), dialogues
              assert visible(pg, "#codeAffiche") and texte(pg, "#codeAfficheValeur") == "wxyz-pqrs-tuvk"
              pg.click("#boutonCodeNote")
              # 5) Désactiver puis réactiver.
              ligne().get_by_text("Désactiver").click(); pg.wait_for_timeout(500)
              assert json.loads([a for a in appels if a[1] == "/api/personnes/2/actif"][-1][2]) == {"actif": False}
              assert "désactivée" in ligne().inner_text() and ligne().get_by_text("Réactiver").count() == 1
              ligne().get_by_text("Réactiver").click(); pg.wait_for_timeout(500)
              assert json.loads([a for a in appels if a[1] == "/api/personnes/2/actif"][-1][2]) == {"actif": True}
              assert "désactivée" not in ligne().inner_text()
              # 5b) Supprimer : confirmation d'abord, puis la personne disparaît de la liste.
              ligne().get_by_text("Supprimer").click(); pg.wait_for_timeout(500)
              assert any("Julie" in d and "pour de bon" in d and "sans retour" in d for d in dialogues), dialogues
              suppr = [a for a in appels if a[0] == "POST" and a[1] == "/api/personnes/2/supprimer"]
              assert len(suppr) == 1, appels
              assert "Julie" not in texte(pg, "#listePersonnes") and pg.locator("#listePersonnes .personne-ligne").count() == 1
              assert texte(pg, "#messagePersonnes") == "Julie a été supprimée."
              # Si on refuse la confirmation, rien n'est envoyé.
              pg.fill("#personneNom", "Paul"); pg.click("#formAjouterPersonne button[type=submit]"); pg.wait_for_timeout(500)
              pg.click("#boutonCodeNote")
              refuser["oui"] = True
              pg.locator("#listePersonnes .personne-ligne").nth(1).get_by_text("Supprimer").click(); pg.wait_for_timeout(400)
              assert len([a for a in appels if a[0] == "POST" and a[1].endswith("/supprimer")]) == 1, "refus : rien ne doit partir"
              assert "Paul" in texte(pg, "#listePersonnes")
              refuser["oui"] = False
              # 6) Nom déjà pris : message d'erreur, pas de code affiché.
              pg.fill("#personneNom", "Math"); pg.click("#formAjouterPersonne button[type=submit]"); pg.wait_for_timeout(500)
              assert texte(pg, "#messagePersonnes") == "Une personne porte déjà ce nom." and not visible(pg, "#codeAffiche")
              pg.close()

              # 7) Une personne qui n'est pas administratrice : aucun bloc, aucun appel d'administration.
              appels.clear()
              pg = ouvrir(False)
              assert not visible(pg, "#blocPersonnes")
              assert not any(a[1] == "/api/personnes" for a in appels), appels
              pg.close()
              nav.close()
          print("erreurs page :", erreurs); assert not erreurs, erreurs
          print("OK: écran Personnes (ajout, code affiché une fois, nouveau code, désactiver/réactiver, renommer, supprimer avec confirmation, erreur, non-administrateur)")
          PY
          rm -f "$SQLITE_PATH"
          PYTHONPATH="$PWD" python "$RUNNER_TEMP/test_admin_navigateur.py"
      - name: Tester l'écran S'inscrire / Se connecter, la déconnexion et le mot de passe dans un vrai navigateur
        env:
          SQLITE_PATH: ${{ runner.temp }}/maillons-acces-nav-test.db
          CODE_ACCES: test
        run: |
          cat > "$RUNNER_TEMP/test_ecran_acces.py" <<'PY'
          import json
          from urllib.parse import urlparse

          from playwright.sync_api import sync_playwright

          import main

          html = main.accueil()
          JETON = "ses_jeton-de-julie"
          VELO = [{"id": 7, "nom": "Mon gravel", "type": "gravel", "actif": 1, "km_total": 0, "km_frac": 0, "a_photo": 0, "sorties_a_verifier": 0}]
          erreurs, requetes = [], []
          etat = {"provisoire": False, "mdp_ok": True, "mdp_change": None}


          def api(r):
              u = urlparse(r.request.url)
              corps_requete = r.request.post_data
              requetes.append((u.path, r.request.method, r.request.headers.get("x-code-acces"), json.loads(corps_requete) if corps_requete else None))

              def rep(statut, corps):
                  r.fulfill(status=statut, content_type="application/json", body=json.dumps(corps))

              if u.path == "/api/inscription":
                  d = json.loads(corps_requete)
                  if d["code_invitation"] != "bonne-invitation":
                      return rep(403, {"detail": "Code d'invitation invalide ou expiré."})
                  return rep(200, {"statut": "success", "token": JETON, "id": 9, "nom": d["nom"], "velo_id": 7})
              if u.path == "/api/connexion":
                  d = json.loads(corps_requete)
                  if d["mot_de_passe"] != "bon-mot-de-passe":
                      return rep(401, {"detail": "E-mail ou mot de passe incorrect."})
                  return rep(200, {"statut": "success", "token": JETON, "id": 9, "nom": "Julie", "est_admin": False, "mot_de_passe_provisoire": etat["provisoire"]})
              if u.path == "/api/deconnexion":
                  return rep(200, {"statut": "success"})
              if u.path == "/api/mot-de-passe":
                  d = json.loads(corps_requete)
                  etat["mdp_change"] = d
                  if d["ancien"] != "bon-mot-de-passe":
                      return rep(403, {"detail": "L'ancien mot de passe est incorrect."})
                  return rep(200, {"statut": "success"})
              if r.request.headers.get("x-code-acces") not in (JETON, "code-de-math"):
                  return rep(401, {"detail": "Code d'accès incorrect."})
              if u.path == "/api/velos":
                  return rep(200, VELO)
              if u.path == "/api/moi":
                  if r.request.headers.get("x-code-acces") == "code-de-math":
                      return rep(200, {"id": 1, "nom": "Math", "est_admin": True})
                  return rep(200, {"id": 9, "nom": "Julie", "est_admin": False})
              if u.path == "/api/etat":
                  return rep(200, {"km_total": 0, "composants": []})
              if u.path == "/api/mes-reglages":
                  return rep(200, {"valeurs": {}, "maj_le": None})
              if u.path == "/api/reglages":
                  return rep(200, {"terrain_route": 1, "terrain_mixte": 1.2, "terrain_chemin": 1.5, "terrain_sentier": 2, "poids_denivele": 1})
              return rep(200, [])


          def visible(pg, sel):
              return pg.eval_on_selector(sel, "e => !e.hidden && getComputedStyle(e).display !== 'none'")


          def texte(pg, sel):
              return pg.eval_on_selector(sel, "e => e.textContent.trim()")


          with sync_playwright() as p:
              nav = p.chromium.launch()

              def ouvrir(stockage_local="", stockage_session=""):
                  ctx = nav.new_context(viewport={"width": 390, "height": 800})
                  ctx.route("**/localhost/api/**", api)
                  ctx.route(lambda u: not u.startswith("http://localhost/"), lambda r: r.abort())
                  # Ne s'applique qu'à la toute première ouverture : un rechargement ne doit pas tout remettre à zéro.
                  ctx.add_init_script("if (!sessionStorage.getItem('__init')) { sessionStorage.setItem('__init', '1');" + stockage_session + stockage_local + " }")
                  pg = ctx.new_page()
                  pg.on("pageerror", lambda e: erreurs.append(str(e)[:200]))
                  pg.route("http://localhost/", lambda r: r.fulfill(status=200, content_type="text/html", body=html))
                  pg.goto("http://localhost/")
                  pg.wait_for_timeout(700)
                  return pg

              # 1) Première visite : « S'inscrire », formulaire complet, lien discret vers le code d'accès.
              pg = ouvrir()
              assert texte(pg, "#authTitrePanneau") == "S'inscrire"
              assert visible(pg, "#authPanneauInscription") and not visible(pg, "#authPanneauConnexion") and not visible(pg, "#authPanneauCode")
              for champ in ("inscCode", "inscNom", "inscEmail", "inscMdp", "inscMdp2", "inscType", "inscNomVelo", "inscDate"):
                  assert visible(pg, "#" + champ), champ
              assert pg.eval_on_selector("#inscMdp", "e => e.type") == "password" and pg.eval_on_selector("#inscEmail", "e => e.type") == "email"
              assert visible(pg, "#authLienCode") and texte(pg, "#authLienCode") == "Se connecter avec un code d'accès"
              assert pg.eval_on_selector("#authScreen", "e => getComputedStyle(e).display") == "flex"
              # Le formulaire tient dans un petit téléphone : on peut faire défiler jusqu'au bouton.
              pg.eval_on_selector("#authPanneauInscription button", "e => e.scrollIntoView()")
              box = pg.eval_on_selector("#authPanneauInscription button", "e => { const r = e.getBoundingClientRect(); return [r.top, r.bottom] }")
              assert 0 <= box[0] and box[1] <= 800, box

              # Deux mots de passe différents : refus sur place, rien n'est envoyé.
              requetes.clear()
              pg.fill("#inscCode", "bonne-invitation"); pg.fill("#inscNom", "Julie"); pg.fill("#inscEmail", "julie@exemple.fr")
              pg.fill("#inscMdp", "velo-de-julie-2026"); pg.fill("#inscMdp2", "autre-chose-12345")
              pg.select_option("#inscType", "gravel"); pg.fill("#inscNomVelo", "Mon gravel"); pg.fill("#inscDate", "2024-05-17")
              pg.click("#authPanneauInscription button"); pg.wait_for_timeout(300)
              assert texte(pg, "#authError") == "Les deux mots de passe ne sont pas identiques."
              assert not [x for x in requetes if x[0] == "/api/inscription"]
              # Mauvaise invitation : le message du serveur s'affiche, on reste sur l'écran.
              pg.fill("#inscMdp2", "velo-de-julie-2026"); pg.fill("#inscCode", "mauvaise")
              pg.click("#authPanneauInscription button"); pg.wait_for_timeout(500)
              assert texte(pg, "#authError") == "Code d'invitation invalide ou expiré."
              assert visible(pg, "#authPanneauInscription") and pg.evaluate("sessionStorage.getItem('vtt_code')") is None
              # Bonne invitation : inscription, mémorisation, rechargement, arrivée sur son vélo.
              pg.fill("#inscCode", "bonne-invitation")
              requetes.clear()
              pg.click("#authPanneauInscription button"); pg.wait_for_timeout(1800)
              envoi = [x for x in requetes if x[0] == "/api/inscription"][0][3]
              assert envoi == {"code_invitation": "bonne-invitation", "nom": "Julie", "email": "julie@exemple.fr", "mot_de_passe": "velo-de-julie-2026",
                               "confirmation": "velo-de-julie-2026", "type_velo": "gravel", "nom_velo": "Mon gravel", "date_achat": "2024-05-17"}, envoi
              assert pg.evaluate("sessionStorage.getItem('vtt_code')") == JETON and pg.evaluate("localStorage.getItem('maillons_session')") == JETON
              assert pg.evaluate("localStorage.getItem('maillons_deja_inscrit')") == "1"
              assert pg.eval_on_selector("#authScreen", "e => getComputedStyle(e).display") == "none"
              assert texte(pg, "#headerVeloNom") == "Mon gravel"
              assert "Julie" in texte(pg, "#headerBienvenue")
              assert [x for x in requetes if x[0] == "/api/velos"][-1][2] == JETON, "le jeton remplace le code dans l'en-tête"
              pg.evaluate("location.hash = '#compte'"); pg.wait_for_timeout(300)
              assert texte(pg, "#compteIdentite") == "Connecté : Julie" and visible(pg, "#formMotDePasse") and not visible(pg, "#compteProvisoire")

              # 2) Mot de passe changé depuis Réglages.
              pg.fill("#mdpAncien", "faux-mot-de-passe"); pg.fill("#mdpNouveau", "nouveau-solide-123"); pg.fill("#mdpNouveau2", "nouveau-solide-123")
              pg.click("#formMotDePasse button"); pg.wait_for_timeout(500)
              assert texte(pg, "#messageCompte") == "L'ancien mot de passe est incorrect."
              pg.fill("#mdpAncien", "bon-mot-de-passe")
              pg.click("#formMotDePasse button"); pg.wait_for_timeout(500)
              assert etat["mdp_change"] == {"ancien": "bon-mot-de-passe", "nouveau": "nouveau-solide-123", "confirmation": "nouveau-solide-123"}
              assert texte(pg, "#messageCompte").startswith("Mot de passe changé.") and pg.input_value("#mdpAncien") == ""

              # 3) Déconnexion : le serveur est prévenu, tout est oublié, retour à « Se connecter ».
              requetes.clear()
              pg.click("#boutonDeconnexion"); pg.wait_for_timeout(1500)
              dec = [x for x in requetes if x[0] == "/api/deconnexion"]
              assert len(dec) == 1 and dec[0][1] == "POST" and dec[0][2] == JETON
              assert pg.evaluate("sessionStorage.getItem('vtt_code')") is None and pg.evaluate("localStorage.getItem('maillons_session')") is None
              assert pg.evaluate("localStorage.getItem('maillons_deja_inscrit')") == "1", "on sait qu'il s'est déjà inscrit"
              assert pg.eval_on_selector("#authScreen", "e => getComputedStyle(e).display") == "flex"
              assert texte(pg, "#authTitrePanneau") == "Se connecter" and visible(pg, "#authPanneauConnexion")
              assert texte(pg, "#authAccroche") == "Content de te revoir !"
              pg.close()

              # 4) Visite suivante : « Se connecter ». Mauvais mot de passe, puis bon.
              pg = ouvrir(stockage_local="localStorage.setItem('maillons_deja_inscrit','1');")
              assert texte(pg, "#authTitrePanneau") == "Se connecter" and visible(pg, "#authPanneauConnexion") and not visible(pg, "#authPanneauInscription")
              pg.fill("#authEmail", "julie@exemple.fr"); pg.fill("#authMdp", "mauvais")
              pg.click("#authPanneauConnexion button"); pg.wait_for_timeout(500)
              assert texte(pg, "#authError") == "E-mail ou mot de passe incorrect." and pg.evaluate("localStorage.getItem('maillons_session')") is None
              requetes.clear()
              pg.fill("#authMdp", "bon-mot-de-passe")
              pg.click("#authPanneauConnexion button"); pg.wait_for_timeout(1800)
              assert [x for x in requetes if x[0] == "/api/connexion"][0][3] == {"email": "julie@exemple.fr", "mot_de_passe": "bon-mot-de-passe"}
              assert pg.eval_on_selector("#authScreen", "e => getComputedStyle(e).display") == "none" and texte(pg, "#headerVeloNom") == "Mon gravel"
              # Les liens passent d'un écran à l'autre.
              pg.close()
              pg = ouvrir(stockage_local="localStorage.setItem('maillons_deja_inscrit','1');")
              pg.click("#authLienAutre"); assert texte(pg, "#authTitrePanneau") == "S'inscrire" and visible(pg, "#authPanneauInscription")
              pg.click("#authLienAutre"); assert texte(pg, "#authTitrePanneau") == "Se connecter"
              pg.click("#authLienCode"); assert texte(pg, "#authTitrePanneau") == "Code d'accès" and visible(pg, "#authInput") and not visible(pg, "#authLienCode")
              pg.click("#authLienAutre"); assert visible(pg, "#authPanneauConnexion") and visible(pg, "#authLienCode")
              pg.close()

              # 5) Mot de passe provisoire (donné par Math) : on est envoyé vers la page Mon compte avec le message.
              etat["provisoire"] = True
              pg = ouvrir(stockage_local="localStorage.setItem('maillons_deja_inscrit','1');")
              pg.fill("#authEmail", "julie@exemple.fr"); pg.fill("#authMdp", "bon-mot-de-passe")
              pg.click("#authPanneauConnexion button"); pg.wait_for_timeout(1800)
              assert pg.evaluate("location.hash") == "#compte" and visible(pg, "#compteProvisoire") and visible(pg, "#page-compte")
              pg.fill("#mdpAncien", "bon-mot-de-passe"); pg.fill("#mdpNouveau", "nouveau-solide-123"); pg.fill("#mdpNouveau2", "nouveau-solide-123")
              pg.click("#formMotDePasse button"); pg.wait_for_timeout(500)
              assert not visible(pg, "#compteProvisoire") and pg.evaluate("sessionStorage.getItem('maillons_mdp_provisoire')") is None
              etat["provisoire"] = False
              pg.close()

              # 6) Réouverture plus tard (nouvel onglet : session du téléphone seulement) : pas de nouvel écran de connexion.
              pg = ouvrir(stockage_local="localStorage.setItem('maillons_session','" + JETON + "'); localStorage.setItem('maillons_deja_inscrit','1');")
              assert pg.eval_on_selector("#authScreen", "e => getComputedStyle(e).display") == "none" and texte(pg, "#headerVeloNom") == "Mon gravel"
              assert pg.evaluate("sessionStorage.getItem('vtt_code')") == JETON
              pg.close()
              # Session périmée ou retirée par Math : on l'oublie et on demande de se reconnecter.
              pg = ouvrir(stockage_local="localStorage.setItem('maillons_session','ses_perimee'); localStorage.setItem('maillons_deja_inscrit','1');")
              assert pg.eval_on_selector("#authScreen", "e => getComputedStyle(e).display") == "flex" and visible(pg, "#authPanneauConnexion")
              assert pg.evaluate("localStorage.getItem('maillons_session')") is None and pg.evaluate("sessionStorage.getItem('vtt_code')") is None
              pg.close()

              # 7) Math entre avec son code d'accès : pas de formulaire de mot de passe, son ancien chemin marche.
              pg = ouvrir()
              pg.click("#authLienCode"); pg.fill("#authInput", "code-de-math"); pg.click("#authValiderCode"); pg.wait_for_timeout(1200)
              assert pg.eval_on_selector("#authScreen", "e => getComputedStyle(e).display") == "none"
              assert pg.evaluate("localStorage.getItem('maillons_deja_inscrit')") == "1" and pg.evaluate("localStorage.getItem('maillons_session')") is None
              pg.evaluate("location.hash = '#compte'"); pg.wait_for_timeout(300)
              assert texte(pg, "#compteIdentite") == "Connecté : Math" and not visible(pg, "#formMotDePasse") and visible(pg, "#boutonDeconnexion")
              pg.close()
              nav.close()

          assert not erreurs, erreurs
          print("OK: écran d'accès (inscription, connexion, code d'accès, mot de passe, déconnexion) dans un vrai navigateur")
          PY
          PYTHONPATH="$PWD" python "$RUNNER_TEMP/test_ecran_acces.py"
      - name: Tester les invitations et les mots de passe provisoires (administration) dans un vrai navigateur
        env:
          SQLITE_PATH: ${{ runner.temp }}/maillons-invitations-nav-test.db
          CODE_ACCES: test
        run: |
          cat > "$RUNNER_TEMP/test_admin_invitations.py" <<'PY'
          import json
          from urllib.parse import urlparse

          from playwright.sync_api import sync_playwright

          import main

          html = main.accueil()
          MATH = "code-de-math"
          VELOS = [{"id": 1, "nom": "Mon CUBE", "type": "vtt_electrique", "actif": 1, "km_total": 0, "km_frac": 0, "a_photo": 0, "sorties_a_verifier": 0}]
          personnes = [
              {"id": 1, "nom": "Math", "est_admin": True, "actif": 1, "nb_velos": 1, "email": None, "a_un_code": False, "a_un_mot_de_passe": False, "mot_de_passe_provisoire": False},
              {"id": 2, "nom": "Julie", "est_admin": False, "actif": 1, "nb_velos": 2, "email": "julie@exemple.fr", "a_un_code": False, "a_un_mot_de_passe": True, "mot_de_passe_provisoire": False},
              {"id": 3, "nom": "Ami", "est_admin": False, "actif": 1, "nb_velos": 1, "email": None, "a_un_code": True, "a_un_mot_de_passe": False, "mot_de_passe_provisoire": False},
          ]
          invitations = [
              {"id": 4, "pour": "Paul", "cree_le": "2026-11-08T08:00:00Z", "expire_le": "2026-11-15T08:00:00Z", "etat": "en_attente", "utilisee_par": None},
              {"id": 3, "pour": None, "cree_le": "2026-11-01T08:00:00Z", "expire_le": "2026-11-08T08:00:00Z", "etat": "utilisee", "utilisee_par": "Julie"},
              {"id": 2, "pour": "Zoé", "cree_le": "2026-10-01T08:00:00Z", "expire_le": "2026-10-08T08:00:00Z", "etat": "expiree", "utilisee_par": None},
              {"id": 1, "pour": "Luc", "cree_le": "2026-10-01T08:00:00Z", "expire_le": "2026-10-08T08:00:00Z", "etat": "annulee", "utilisee_par": None},
          ]
          requetes, erreurs, dialogues = [], [], []
          admin = {"oui": True}


          def api(r):
              u = urlparse(r.request.url)
              corps = r.request.post_data
              requetes.append((u.path, r.request.method, json.loads(corps) if corps else None))

              def rep(statut, c):
                  r.fulfill(status=statut, content_type="application/json", body=json.dumps(c))

              if r.request.headers.get("x-code-acces") != MATH:
                  return rep(401, {"detail": "Code d'accès incorrect."})
              if u.path == "/api/velos":
                  return rep(200, VELOS)
              if u.path == "/api/moi":
                  return rep(200, {"id": 1, "nom": "Math", "est_admin": admin["oui"]})
              if u.path == "/api/personnes":
                  return rep(200, personnes)
              if u.path == "/api/invitations" and r.request.method == "GET":
                  return rep(200, invitations)
              if u.path == "/api/invitations" and r.request.method == "POST":
                  d = json.loads(corps)
                  invitations.insert(0, {"id": 5, "pour": d.get("pour"), "cree_le": "2026-11-08T17:00:00Z", "expire_le": "2026-11-15T17:00:00Z", "etat": "en_attente", "utilisee_par": None})
                  return rep(200, {"statut": "success", "id": 5, "code": "abcd-efgh-jkmn-pqrs", "pour": d.get("pour"), "expire_le": "2026-11-15T17:00:00Z"})
              if u.path == "/api/invitations/4/annuler":
                  [i for i in invitations if i["id"] == 4][0]["etat"] = "annulee"
                  return rep(200, {"statut": "success"})
              if u.path == "/api/personnes/2/reinitialiser-mot-de-passe":
                  return rep(200, {"statut": "success", "id": 2, "mot_de_passe_provisoire": "abcd-efgh-jkmn"})
              if u.path == "/api/etat":
                  return rep(200, {"km_total": 0, "composants": []})
              if u.path == "/api/mes-reglages":
                  return rep(200, {"valeurs": {}, "maj_le": None})
              if u.path == "/api/reglages":
                  return rep(200, {"terrain_route": 1, "terrain_mixte": 1.2, "terrain_chemin": 1.5, "terrain_sentier": 2, "poids_denivele": 1})
              return rep(200, [])


          def texte(pg, sel):
              return pg.eval_on_selector(sel, "e => e.textContent.trim()")


          def visible(pg, sel):
              return pg.eval_on_selector(sel, "e => getComputedStyle(e).display !== 'none'")


          def noms_boutons(pg, sel):
              return pg.eval_on_selector_all(sel, "els => els.map(e => e.textContent.trim())")


          with sync_playwright() as p:
              nav = p.chromium.launch()
              ctx = nav.new_context(viewport={"width": 390, "height": 900})
              ctx.route("**/localhost/api/**", api)
              ctx.route(lambda u: not u.startswith("http://localhost/"), lambda r: r.abort())
              ctx.add_init_script("sessionStorage.setItem('vtt_code', '" + MATH + "'); window.__copie = null;"
                                  "Object.defineProperty(navigator, 'clipboard', {value: {writeText: async t => { window.__copie = t; }}, configurable: true});")
              pg = ctx.new_page()
              pg.on("pageerror", lambda e: erreurs.append(str(e)[:200]))
              reponse = {"ok": True}

              def dialogue(d):
                  dialogues.append(d.message)
                  d.accept() if reponse["ok"] else d.dismiss()

              pg.on("dialog", dialogue)
              pg.route("http://localhost/", lambda r: r.fulfill(status=200, content_type="text/html", body=html))
              pg.goto("http://localhost/#compte"); pg.wait_for_timeout(900)

              # 1) Les personnes : e-mail visible ; mot de passe provisoire pour Julie, nouveau code pour l'ami.
              lignes = pg.query_selector_all("#listePersonnes .personne-ligne")
              assert len(lignes) == 3
              assert "julie@exemple.fr" in lignes[1].inner_text() and "2 vélos" in lignes[1].inner_text()
              assert noms_boutons(pg, "#listePersonnes .personne-ligne:nth-child(1) button") == ["Renommer"]
              assert "Mot de passe provisoire" in noms_boutons(pg, "#listePersonnes .personne-ligne:nth-child(2) button")
              assert "Nouveau code" not in noms_boutons(pg, "#listePersonnes .personne-ligne:nth-child(2) button")
              assert "Nouveau code" in noms_boutons(pg, "#listePersonnes .personne-ligne:nth-child(3) button")
              assert "Mot de passe provisoire" not in noms_boutons(pg, "#listePersonnes .personne-ligne:nth-child(3) button")

              # 2) La liste des invitations : un état par ligne, « Annuler » seulement pour celle en attente.
              inv = pg.query_selector_all("#listeInvitations .invitation-ligne")
              assert len(inv) == 4
              t = [x.inner_text() for x in inv]
              assert "Pour Paul" in t[0] and "En attente, expire le 15/11/2026" in t[0]
              assert "Invitation n° 3" in t[1] and "Utilisée par Julie" in t[1]
              assert "Expirée" in t[2] and "Annulée" in t[3]
              assert noms_boutons(pg, "#listeInvitations button") == ["Annuler"]

              # 3) Créer une invitation : le code s'affiche une fois, avec un message prêt à envoyer.
              requetes.clear()
              pg.fill("#invitationPour", "Léa")
              pg.click("#formInviter button"); pg.wait_for_timeout(700)
              assert [x for x in requetes if x[0] == "/api/invitations" and x[1] == "POST"][0][2] == {"pour": "Léa"}
              assert visible(pg, "#codeAffiche") and texte(pg, "#codeAfficheValeur") == "abcd-efgh-jkmn-pqrs"
              assert texte(pg, "#codeAfficheTitre") == "Invitation pour Léa :" and visible(pg, "#boutonCopierInvitation")
              assert pg.input_value("#invitationPour") == ""
              assert len(pg.query_selector_all("#listeInvitations .invitation-ligne")) == 5, "la liste est rechargée"
              pg.click("#boutonCopierInvitation"); pg.wait_for_timeout(200)
              copie = pg.evaluate("window.__copie")
              assert "abcd-efgh-jkmn-pqrs" in copie and "http://localhost" in copie and "S'inscrire" in copie and "7 jours" in copie, copie
              assert "Message copié" in texte(pg, "#messagePersonnes")
              pg.click("#boutonCodeNote")
              assert not visible(pg, "#codeAffiche") and texte(pg, "#codeAfficheValeur") == "" and not visible(pg, "#boutonCopierInvitation")
              # Sans nom : l'invitation est créée quand même.
              requetes.clear()
              pg.click("#formInviter button"); pg.wait_for_timeout(600)
              assert [x for x in requetes if x[0] == "/api/invitations" and x[1] == "POST"][0][2] == {}
              assert texte(pg, "#codeAfficheTitre") == "Invitation :"
              pg.click("#boutonCodeNote")

              # 4) Annuler : refusé = rien n'est envoyé ; accepté = envoyé et liste rechargée.
              requetes.clear(); reponse["ok"] = False
              pg.click("#listeInvitations .invitation-ligne:has-text('Pour Paul') button"); pg.wait_for_timeout(300)
              assert not [x for x in requetes if "annuler" in x[0]]
              reponse["ok"] = True
              pg.click("#listeInvitations .invitation-ligne:has-text('Pour Paul') button"); pg.wait_for_timeout(600)
              assert [x for x in requetes if "annuler" in x[0]][0][:2] == ("/api/invitations/4/annuler", "POST")
              assert texte(pg, "#messagePersonnes") == "Invitation annulée."
              paul = pg.query_selector("#listeInvitations .invitation-ligne:has-text('Pour Paul')")
              assert "Annulée" in paul.inner_text() and not paul.query_selector("button")

              # 5) Mot de passe provisoire : confirmation, affichage une fois, message à envoyer.
              requetes.clear(); reponse["ok"] = False
              pg.click("#listePersonnes .personne-ligne:nth-child(2) button:has-text('Mot de passe provisoire')"); pg.wait_for_timeout(300)
              assert not [x for x in requetes if "reinitialiser" in x[0]]
              reponse["ok"] = True
              pg.click("#listePersonnes .personne-ligne:nth-child(2) button:has-text('Mot de passe provisoire')"); pg.wait_for_timeout(600)
