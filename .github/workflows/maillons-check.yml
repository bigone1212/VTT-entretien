          import db, main
          from fastapi import HTTPException
          main.verifier_auth = lambda _c: None
          C = "x"
          def refuse(code, f, *a, **k):
              try: f(*a, **k)
              except HTTPException as e:
                  assert e.status_code == code, (code, e.status_code, e.detail); return
              raise AssertionError("erreur %s attendue" % code)
          def pos(velo):
              c = db.connect(); cur = c.cursor(); cur.execute("SELECT id, pos_x, pos_y FROM composants WHERE velo_id = ? ORDER BY id", (velo,))
              r = [tuple(x) for x in cur.fetchall()]; c.close(); return r
          g = main.creer_velo(main.NouveauVeloRequest(nom="Gravel pos", type="gravel"), x_code_acces=C)["velo_id"]
