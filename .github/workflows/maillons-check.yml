          import json, struct, zlib
          from urllib.parse import urlparse
          from playwright.sync_api import sync_playwright
          import main
          html = main.accueil()
          def png(w, h):
              raw = b"".join(b"\x00" + bytes([40, 120, 200]) * w for _ in range(h))
              def ch(t, d): return struct.pack(">I", len(d)) + t + d + struct.pack(">I", zlib.crc32(t + d) & 0xffffffff)
              return b"\x89PNG\r\n\x1a\n" + ch(b"IHDR", struct.pack(">IIBBBBB", w, h, 8, 2, 0, 0, 0)) + ch(b"IDAT", zlib.compress(raw)) + ch(b"IEND", b"")
          import base64
          URL_PNG = "data:image/png;base64," + base64.b64encode(png(1600, 900)).decode()
          VELOS = [{"id": 1, "nom": "Mon CUBE", "type": "vtt_electrique", "actif": 1, "km_total": 0, "km_frac": 0, "a_photo": 0, "sorties_a_verifier": 0},
                   {"id": 2, "nom": "Gravel test", "type": "gravel", "actif": 1, "km_total": 0, "km_frac": 0, "a_photo": 0, "sorties_a_verifier": 0}]
          etat = {"photo": None, "lien": None, "echec": False}; dialogues = []; erreurs = []
          with sync_playwright() as p:
              nav = p.chromium.launch(); ctx = nav.new_context(viewport={"width": 390, "height": 844})
              def api(route):
                  r = route.request; u = urlparse(r.url)
                  if u.path == "/api/velos": corps = [dict(v) for v in VELOS]
                  elif u.path == "/api/photo-depuis-lien":
                      etat["lien"] = json.loads(r.post_data)["url"]
                      if etat["echec"]:
                          return route.fulfill(status=404, content_type="application/json", body=json.dumps({"detail": "Aucune photo trouvée sur cette page. Choisis plutôt une photo de ton téléphone."}))
                      corps = {"photo": URL_PNG, "source": "https://exemple.fr/velo.png"}
                  elif u.path == "/api/velos/2/photo":
                      if r.method == "PUT": etat["photo"] = json.loads(r.post_data)["photo"]; VELOS[1]["a_photo"] = 1; corps = {"statut": "success"}
                      else: corps = {"photo": etat["photo"]}
                  elif u.path == "/api/etat": corps = {"km_total": 0, "composants": []}
                  elif u.path == "/api/mes-reglages": corps = {"valeurs": {}, "maj_le": None}
                  elif u.path == "/api/reglages": corps = {"terrain_route": 1, "terrain_mixte": 1.2, "terrain_chemin": 1.5, "terrain_sentier": 2, "poids_denivele": 1}
                  else: corps = []
                  route.fulfill(status=200, content_type="application/json", body=json.dumps(corps))
              ctx.route("**/localhost/api/**", api); ctx.route(lambda u: not u.startswith("http://localhost/"), lambda r: r.abort())
              ctx.add_init_script("sessionStorage.setItem('vtt_code','t'); sessionStorage.setItem('maillons_velo_id','2')")
              page = ctx.new_page(); page.on("pageerror", lambda e: erreurs.append(str(e)[:200]))
              reponses = ["  https://www.exemple.fr/velo  ", "https://www.exemple.fr/introuvable"]
              def dlg(d):
                  dialogues.append((d.type, d.message))
                  d.accept(reponses.pop(0)) if d.type == "prompt" else d.accept()
              page.on("dialog", dlg)
              page.route("http://localhost/", lambda r: r.fulfill(status=200, content_type="text/html", body=html))
              page.goto("http://localhost/"); page.wait_for_timeout(1200)
              vis = lambda sel: page.eval_on_selector(sel, "e => getComputedStyle(e).display != 'none' && getComputedStyle(e).visibility != 'hidden'")
              assert vis("#btnPhotoVeloLien")
              page.click("#btnPhotoVeloLien"); page.wait_for_timeout(1500)
              assert etat["lien"] == "https://www.exemple.fr/velo", etat["lien"]      # espaces retirés
              assert etat["photo"] and etat["photo"].startswith("data:image/jpeg;base64,")   # réduite et enregistrée
              dim = page.evaluate("() => { const i = document.querySelector('.bike-img'); return [i.naturalWidth, i.naturalHeight]; }")
              assert dim == [1200, 675], dim
              assert vis(".bike-img") and not vis("#photoVeloACompleter")
              # Échec : message visible (alerte), rien d'enregistré en plus
              avant = etat["photo"]; etat["echec"] = True
              page.evaluate("location.hash = 'reglages'"); page.wait_for_timeout(400)
              page.click("#veloMenuZone button[aria-label='Actions du vélo']")
              page.click("#veloMenuZone [role=menuitem]:has-text('Photo depuis un lien')"); page.wait_for_timeout(1000)
              alertes = [m for t, m in dialogues if t == "alert"]
              assert alertes and "Aucune photo trouvée" in alertes[-1], dialogues
              assert etat["photo"] == avant
              assert not erreurs, erreurs
              nav.close()
          print("OK photo depuis un lien (navigateur)")
          PY
          rm -f "$SQLITE_PATH"
          PYTHONPATH="$PWD" python "$RUNNER_TEMP/test_photo_lien_nav.py"
      - name: Vérifier l'enregistrement groupé des positions des repères (tout ou rien)
        env:
