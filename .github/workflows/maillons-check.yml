      - name: Vérifier la table des personnes et le propriétaire des vélos (SQLite puis PostgreSQL)
        env:
          SQLITE_PATH: ${{ runner.temp }}/maillons-personnes-test.db
          CODE_ACCES: test
        run: |
          cat > "$RUNNER_TEMP/test_personnes.py" <<'PY'
          import os
          import subprocess
          import sys

          import db


          def demarrer():
              # Un vrai démarrage de l'appli (l'import de main lance init_db).
              subprocess.run([sys.executable, "-c", "import main"], check=True)


          def lire(sql, p=()):
              c = db.connect()
              cur = c.cursor()
              cur.execute(sql, p)
              r = [tuple(x) for x in cur.fetchall()]
              c.close()
              return r


          def ecrire(sql, p=()):
              c = db.connect()
              cur = c.cursor()
              cur.execute(sql, p)
              c.commit()
              c.close()


          TABLES = ("composants", "historique", "sorties", "reglages", "mes_reglages", "mes_reglages_velo")


          def photo():
              return {t: lire("SELECT * FROM " + t + " ORDER BY 1, 2") for t in TABLES}


          # 1. Base neuve : Math est la personne 1, le CUBE lui appartient.
          demarrer()
          assert lire("SELECT id, nom, est_admin, actif, email FROM personnes") == [(1, "Math", 1, 1, None)]
          assert lire("SELECT id, personne_id FROM velos") == [(1, 1)]

          # 2. Un vélo créé sans propriétaire (comme le fait l'appli aujourd'hui) est à Math.
          ecrire("INSERT INTO velos (nom, type) VALUES ('Gravel test', 'gravel')")
          assert lire("SELECT personne_id FROM velos WHERE nom = 'Gravel test'") == [(1,)]
          ecrire("INSERT INTO sorties (velo_id, debut, distance_km) VALUES (1, '2026-10-02T08:00:00Z', 25.5)")
          demarrer()  # mise à niveau habituelle du 2e vélo, faite avant de comparer

          # 3. Ancienne base : on retire ce que l'étape 1 ajoute, puis on redémarre deux fois.
          ecrire("ALTER TABLE velos DROP COLUMN personne_id")
          ecrire("DROP TABLE personnes")
          avant = photo()
          velos_avant = lire("SELECT id, nom, type, km_total FROM velos ORDER BY id")
          demarrer()
          demarrer()
          assert photo() == avant, "une table existante a changé"
          assert lire("SELECT id, nom, type, km_total FROM velos ORDER BY id") == velos_avant
          assert lire("SELECT personne_id FROM velos ORDER BY id") == [(1,), (1,)]
          assert lire("SELECT id, nom, est_admin FROM personnes") == [(1, "Math", 1)]

          # 4. Redémarrages : rien ne se duplique, un nom modifié est conservé.
          ecrire("UPDATE personnes SET nom = 'Math (admin)' WHERE id = 1")
          demarrer()
          assert lire("SELECT id, nom FROM personnes") == [(1, "Math (admin)")]

          # 5. E-mail facultatif mais unique ; numéro automatique de la personne suivante.
          ecrire("INSERT INTO personnes (nom) VALUES ('Ami sans mail 1')")
          ecrire("INSERT INTO personnes (nom) VALUES ('Ami sans mail 2')")
          ecrire("INSERT INTO personnes (nom, email) VALUES ('Ami A', 'a@exemple.fr')")
          assert lire("SELECT id FROM personnes ORDER BY id") == [(1,), (2,), (3,), (4,)]
          doublon = False
          try:
              ecrire("INSERT INTO personnes (nom, email) VALUES ('Ami B', 'a@exemple.fr')")
          except Exception:
              doublon = True
          assert doublon, "deux personnes ne doivent pas partager le même e-mail"

          print("OK: table des personnes et propriétaire des vélos (" + ("PostgreSQL" if db.USE_PG else "SQLite") + ").")
          PY
          rm -f "$SQLITE_PATH"
          PYTHONPATH="$PWD" python "$RUNNER_TEMP/test_personnes.py"
          python - <<'PY2'
          import psycopg
          with psycopg.connect("postgresql://postgres:postgres@localhost:5432/maillons_test", autocommit=True) as c:
              c.execute("DROP DATABASE IF EXISTS maillons_personnes")
              c.execute("CREATE DATABASE maillons_personnes")
          PY2
          DATABASE_URL=postgresql://postgres:postgres@localhost:5432/maillons_personnes PYTHONPATH="$PWD" python "$RUNNER_TEMP/test_personnes.py"
      - name: Vérifier que le code identifie la personne (SQLite puis PostgreSQL)
        env:
          SQLITE_PATH: ${{ runner.temp }}/maillons-codes-test.db
          CODE_ACCES: test
        run: |
          cat > "$RUNNER_TEMP/test_codes.py" <<'PY'
          import os
          import subprocess
          import sys

          import db
          import main
          from fastapi import HTTPException

          # Le code de Math (réglé dans Render). On le fixe long pour tester aussi
          # « un code personnel ne peut pas être celui de Math ».
          CODE_MATH = "code-de-math-123"
          main.CODE_ACCES = CODE_MATH
          os.environ["CODE_ACCES"] = CODE_MATH


          def statut(code):
              try:
                  return main.verifier_auth(code)
              except HTTPException as e:
                  return e.status_code


          def ecrire(sql, p=()):
              c = db.connect()
              cur = c.cursor()
              cur.execute(sql, p)
              c.commit()
              c.close()


          def lire(sql, p=()):
              c = db.connect()
              cur = c.cursor()
              cur.execute(sql, p)
              r = [tuple(x) for x in cur.fetchall()]
              c.close()
              return r


          def definir(personne_id, code):
              c = db.connect()
              cur = c.cursor()
              try:
                  main.definir_code_personne(cur, personne_id, code)
                  c.commit()
                  return "ok"
              except ValueError as e:
                  c.rollback()
                  return str(e)
              finally:
                  c.close()


          # 1. Le code de Math fonctionne comme avant ; les mauvais codes sont refusés.
          assert statut(CODE_MATH) == 1
          assert statut("mauvais") == 401 and statut("") == 401 and statut(None) == 401
          main.CODE_ACCES = ""
          assert statut(CODE_MATH) == 503, "code non réglé sur le serveur : 503 comme avant"
          main.CODE_ACCES = CODE_MATH

          # 2. Deux personnes, chacune avec son code : le code identifie la personne.
          ecrire("INSERT INTO personnes (nom) VALUES ('Ami 1')")
          ecrire("INSERT INTO personnes (nom) VALUES ('Ami 2')")
          assert [r[0] for r in lire("SELECT id FROM personnes ORDER BY id")] == [1, 2, 3]
          assert definir(2, "abcd-1234-efgh") == "ok"
          assert definir(3, "wxyz-5678-ijkl") == "ok"
          assert statut("abcd-1234-efgh") == 2
          assert statut("wxyz-5678-ijkl") == 3
          assert statut(CODE_MATH) == 1
          assert statut("abcd-1234-efgX") == 401 and statut("ABCD-1234-EFGH") == 401

          # 3. Jamais de code en clair dans la base.
          for sel, empreinte in lire("SELECT code_sel, code_hash FROM personnes WHERE id IN (2, 3)"):
              assert len(empreinte) == 64 and len(sel) == 16
              assert "abcd-1234-efgh" not in (sel + empreinte) and "wxyz-5678-ijkl" not in (sel + empreinte)
          assert lire("SELECT code_sel, code_hash FROM personnes WHERE id = 1") == [(None, None)]
          assert lire("SELECT code_hash FROM personnes WHERE id = 2") != lire("SELECT code_hash FROM personnes WHERE id = 3")

          # 4. Refus : personne 1, trop court, code de Math, code déjà pris, personne inconnue.
          assert "Render" in definir(1, "un-code-assez-long")
          assert "trop court" in definir(2, "court")
          assert "déjà utilisé" in definir(2, CODE_MATH)
          assert "déjà utilisé" in definir(2, "wxyz-5678-ijkl")
          assert "inconnue" in definir(99, "un-code-assez-long")
          assert statut("abcd-1234-efgh") == 2, "un refus ne doit rien changer"
          # Redéfinir son propre code est permis ; l'ancien code ne marche plus.
          assert definir(2, "nouveau-code-2026") == "ok"
          assert statut("nouveau-code-2026") == 2 and statut("abcd-1234-efgh") == 401

          # 5. Personne désactivée : refusée ; réactivée : reconnue.
          ecrire("UPDATE personnes SET actif = 0 WHERE id = 3")
          assert statut("wxyz-5678-ijkl") == 401
          ecrire("UPDATE personnes SET actif = 1 WHERE id = 3")
          assert statut("wxyz-5678-ijkl") == 3

          # 6. Une vraie route de l'appli : bon code accepté, mauvais refusé.
          assert len(main.obtenir_velos(CODE_MATH)) >= 1
          try:
              main.obtenir_velos("mauvais")
              raise AssertionError("la route aurait dû refuser")
          except HTTPException as e:
              assert e.status_code == 401

          # 7. Redémarrage : les codes survivent ; base de l'étape 1 (sans les colonnes) : mise à niveau.
          env = dict(os.environ)
          subprocess.run([sys.executable, "-c", "import main"], check=True, env=env)
          assert statut("nouveau-code-2026") == 2
          ecrire("ALTER TABLE personnes DROP COLUMN code_sel")
          ecrire("ALTER TABLE personnes DROP COLUMN code_hash")
          subprocess.run([sys.executable, "-c", "import main"], check=True, env=env)
          assert lire("SELECT code_sel, code_hash FROM personnes WHERE id = 1") == [(None, None)]
          assert [r[0] for r in lire("SELECT id FROM personnes ORDER BY id")] == [1, 2, 3]
          assert statut(CODE_MATH) == 1

          print("OK: code personnel qui identifie la personne (" + ("PostgreSQL" if db.USE_PG else "SQLite") + ").")
          PY
          rm -f "$SQLITE_PATH"
          PYTHONPATH="$PWD" python "$RUNNER_TEMP/test_codes.py"
          python - <<'PY2'
          import psycopg
          with psycopg.connect("postgresql://postgres:postgres@localhost:5432/maillons_test", autocommit=True) as c:
              c.execute("DROP DATABASE IF EXISTS maillons_codes")
              c.execute("CREATE DATABASE maillons_codes")
          PY2
          DATABASE_URL=postgresql://postgres:postgres@localhost:5432/maillons_codes PYTHONPATH="$PWD" python "$RUNNER_TEMP/test_codes.py"
