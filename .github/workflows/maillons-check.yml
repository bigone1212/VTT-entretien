          import db, main
          from fastapi import HTTPException
          main.verifier_auth = lambda _c: 1
          C = "x"
          def refuse(code, f, *a, **k):
              try: f(*a, **k)
              except HTTPException as e:
                  assert e.status_code == code, (code, e.status_code, e.detail); return
              raise AssertionError("erreur %s attendue" % code)
          def pos(velo):
              c = db.connect(); cur = c.cursor(); cur.execute("SELECT id, pos_x, pos_y FROM composants WHERE velo_id = ? ORDER BY id", (velo,))
              r = [tuple(x) for x in cur.fetchall()]; c.close(); return r
          g = main.creer_velo(main.NouveauVeloRequest(nom="Gravel pos", type="gravel"), x_code_acces=C)["velo_id"]
          h = main.creer_velo(main.NouveauVeloRequest(nom="VTT pos", type="vtt"), x_code_acces=C)["velo_id"]
          ids_g = [x[0] for x in pos(g)]; avant_g = pos(g); avant_h = pos(h); avant_cube = pos(1)
          lot = [main.PositionRepere(composant_id=i, pos_x=10 + k, pos_y=20 + k) for k, i in enumerate(ids_g)]
          r = main.enregistrer_positions_velo(g, main.PositionsRequest(positions=lot), x_code_acces=C)
          assert r["deplaces"] == len(ids_g)
          assert pos(g) == [(i, 10 + k, 20 + k) for k, i in enumerate(ids_g)]
          assert pos(h) == avant_h and pos(1) == avant_cube          # les autres vélos ne bougent pas
          # tout ou rien : une pièce d'un autre vélo -> rien n'est modifié
          etranger = pos(h)[0][0]
          mauvais = [main.PositionRepere(composant_id=ids_g[0], pos_x=99, pos_y=99), main.PositionRepere(composant_id=etranger, pos_x=1, pos_y=1)]
          refuse(404, main.enregistrer_positions_velo, g, main.PositionsRequest(positions=mauvais), x_code_acces=C)
          assert pos(g) == [(i, 10 + k, 20 + k) for k, i in enumerate(ids_g)] and pos(h) == avant_h
          refuse(404, main.enregistrer_positions_velo, 999, main.PositionsRequest(positions=lot[:1]), x_code_acces=C)
          print("OK positions groupées (serveur)")
          PY
          rm -f "$SQLITE_PATH"
